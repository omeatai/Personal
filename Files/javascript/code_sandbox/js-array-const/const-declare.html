<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Declare an array with const</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Declare an array with const</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["Saab", "Volvo", "BMW"];
      document.getElementById("demo").innerText = "cars -> " + String(JSON.stringify(cars));
    </script>
  </body>
</html>
