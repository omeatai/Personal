<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>const has block scope</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>const has block scope</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["Saab", "Volvo", "BMW"];
      let inside;
      {
        const cars = ["Toyota", "Volvo", "BMW"];
        inside = cars[0];
      }
      let outside = cars[0];
      document.getElementById("demo").innerText = "inside -> " + String(inside) + "\n" + "outside -> " + String(outside);
    </script>
  </body>
</html>
