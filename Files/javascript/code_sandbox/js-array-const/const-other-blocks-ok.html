<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>const in another block is allowed</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>const in another block is allowed</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["Volvo", "BMW"];
      let inner1;
      let inner2;
      {
        const cars = ["Toyota", "BMW"];
        inner1 = JSON.stringify(cars);
      }
      {
        const cars = ["Saab", "Audi"];
        inner2 = JSON.stringify(cars);
      }
      let outer = JSON.stringify(cars);
      document.getElementById("demo").innerText = "inner1 -> " + String(inner1) + "\n" + "inner2 -> " + String(inner2) + "\n" + "outer -> " + String(outer);
    </script>
  </body>
</html>
