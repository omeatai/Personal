<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Iterator.from([1, 2, 3])</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Iterator.from([1, 2, 3])</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myIterator = Iterator.from([1, 2, 3]);
      let text = "";
      for (const x of myIterator) {
        text += x + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
