<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>every(x =&gt; x &gt; 7) on &quot;123456789&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>every(x =&gt; x &gt; 7) on &quot;123456789&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myIterator = Iterator.from("123456789");
      let result = myIterator.every(x => x > 7);
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
