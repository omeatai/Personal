<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>find(x =&gt; x &gt; 18) on [3, 10, 18, 30, 20]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>find(x =&gt; x &gt; 18) on [3, 10, 18, 30, 20]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myIterator = Iterator.from([3, 10, 18, 30, 20]);
      let result = myIterator.find(x => x > 18);
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
