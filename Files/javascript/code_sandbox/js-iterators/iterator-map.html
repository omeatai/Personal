<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>map(x =&gt; x * 2) on &quot;123456789&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>map(x =&gt; x * 2) on &quot;123456789&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myIterator = Iterator.from("123456789");
      const mappedIterator = myIterator.map(x => x * 2);
      let text = "";
      for (const x of mappedIterator) {
        text += x + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
