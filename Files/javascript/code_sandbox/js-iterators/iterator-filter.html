<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>filter(x =&gt; x &gt; 18) on [32, 33, 16, 40]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>filter(x =&gt; x &gt; 18) on [32, 33, 16, 40]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myIterator = Iterator.from([32, 33, 16, 40]);
      const filteredIterator = myIterator.filter(x => x > 18);
      let text = "";
      for (const x of filteredIterator) {
        text += x + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
