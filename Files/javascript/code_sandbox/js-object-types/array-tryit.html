<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array cars = [&quot;Saab&quot;, &quot;Volvo&quot;, &quot;BMW&quot;]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array cars = [&quot;Saab&quot;, &quot;Volvo&quot;, &quot;BMW&quot;]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["Saab", "Volvo", "BMW"];
      document.getElementById("demo").innerText = "cars[0] -> " + String(cars[0]) + "\n" + "cars[1] -> " + String(cars[1]) + "\n" + "cars[2] -> " + String(cars[2]) + "\n" + "cars.length -> " + String(cars.length);
    </script>
  </body>
</html>
