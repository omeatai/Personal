<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>RegExp</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>RegExp</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const pat = /w3/i;
      let ok = pat.test("W3Schools");
      document.getElementById("demo").innerText = "String(pat) -> " + String(String(pat)) + "\n" + "pat.test(\"W3Schools\") -> " + String(ok) + "\n" + "typeof pat -> " + String(typeof pat);
    </script>
  </body>
</html>
