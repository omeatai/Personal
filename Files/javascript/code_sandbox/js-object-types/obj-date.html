<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Date</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Date</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const date = new Date("2022-03-25");
      document.getElementById("demo").innerText = "date -> " + String(String(date)) + "\n" + "date.toISOString() -> " + String(date.toISOString()) + "\n" + "typeof date -> " + String(typeof date);
    </script>
  </body>
</html>
