<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Promise</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Promise</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const p = Promise.resolve("ok");
      document.getElementById("demo").innerText = "typeof p -> " + String(typeof p) + "\n" + "p instanceof Promise -> " + String(p instanceof Promise) + "\n" + "String(p) -> " + String(String(p));
    </script>
  </body>
</html>
