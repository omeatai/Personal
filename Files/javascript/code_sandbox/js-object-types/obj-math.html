<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let pi = Math.PI;
      let abs = Math.abs(-3);
      document.getElementById("demo").innerText = "Math.PI -> " + String(pi) + "\n" + "Math.abs(-3) -> " + String(abs) + "\n" + "typeof Math -> " + String(typeof Math);
    </script>
  </body>
</html>
