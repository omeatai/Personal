<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>JSON</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const obj = { name: "John" };
      let text = JSON.stringify(obj);
      let back = JSON.parse(text);
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "back.name -> " + String(back.name) + "\n" + "typeof JSON -> " + String(typeof JSON);
    </script>
  </body>
</html>
