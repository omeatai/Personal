      pre {
        margin: 0;

  <body>
    <h3>Example</h3>
    <pre>function Person(first, last, age, eyecolor) {
  this.firstName = first;
  this.lastName = last;
  this.age = age;
  this.eyeColor = eyecolor;
  this.fullName = function () {
    return this.firstName + &quot; &quot; + this.lastName;
  };
}
const myFather = new Person(&quot;John&quot;, &quot;Doe&quot;, 50, &quot;blue&quot;);</pre>
