<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Person.nationality does not add to instances</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Person.nationality does not add to instances</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first, last, age, eye) {
        this.firstName = first;
        this.lastName = last;
        this.age = age;
        this.eyeColor = eye;
      }
      const myFather = new Person("John", "Doe", 50, "blue");
      Person.nationality = "English";
      document.getElementById("demo").innerText = "Person.nationality -> " + String(Person.nationality) + "\n" + "myFather.nationality -> " + String(myFather.nationality);
    </script>
  </body>
</html>
