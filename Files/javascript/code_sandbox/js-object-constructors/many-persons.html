<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>new Person: myFather / myMother / mySister / mySelf</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>new Person: myFather / myMother / mySister / mySelf</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first, last, age, eye) {
        this.firstName = first;
        this.lastName = last;
        this.age = age;
        this.eyeColor = eye;
      }
      const myFather = new Person("John", "Doe", 50, "blue");
      const myMother = new Person("Sally", "Rally", 48, "green");
      const mySister = new Person("Anna", "Rally", 18, "green");
      const mySelf = new Person("Johnny", "Rally", 22, "green");
      document.getElementById("demo").innerText = "myFather.firstName -> " + String(myFather.firstName) + "\n" + "myMother.firstName -> " + String(myMother.firstName) + "\n" + "mySister.firstName -> " + String(mySister.firstName) + "\n" + "mySelf.firstName -> " + String(mySelf.firstName);
    </script>
  </body>
</html>
