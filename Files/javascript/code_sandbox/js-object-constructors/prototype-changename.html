<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Person.prototype.changeName then myMother.changeName works</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Person.prototype.changeName then myMother.changeName works</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first, last, age, eye) {
        this.firstName = first;
        this.lastName = last;
        this.age = age;
        this.eyeColor = eye;
      }
      const myMother = new Person("Sally", "Rally", 48, "green");
      Person.prototype.changeName = function (name) {
        this.lastName = name;
      };
      myMother.changeName("Doe");
      document.getElementById("demo").innerText = "myMother.lastName -> " + String(myMother.lastName);
    </script>
  </body>
</html>
