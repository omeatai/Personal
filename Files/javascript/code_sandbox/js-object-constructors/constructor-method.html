<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Constructor method: fullName</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Constructor method: fullName</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first, last, age, eyecolor) {
        this.firstName = first;
        this.lastName = last;
        this.age = age;
        this.eyeColor = eyecolor;
        this.fullName = function () {
          return this.firstName + " " + this.lastName;
        };
      }
      const myFather = new Person("John", "Doe", 50, "blue");
      document.getElementById("demo").innerText = "myFather.fullName() -> " + String(myFather.fullName());
    </script>
  </body>
</html>
