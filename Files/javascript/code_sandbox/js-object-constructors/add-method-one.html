<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Add method to one object: myMother.changeName</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Add method to one object: myMother.changeName</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first, last, age, eye) {
        this.firstName = first;
        this.lastName = last;
        this.age = age;
        this.eyeColor = eye;
      }
      const myFather = new Person("John", "Doe", 50, "blue");
      const myMother = new Person("Sally", "Rally", 48, "green");
      myMother.changeName = function (name) {
        this.lastName = name;
      };
      myMother.changeName("Doe");
      document.getElementById("demo").innerText = "myMother.lastName -> " + String(myMother.lastName) + "\n" + "typeof myFather.changeName -> " + String(typeof myFather.changeName) + "\n" + "myFather.lastName -> " + String(myFather.lastName);
    </script>
  </body>
</html>
