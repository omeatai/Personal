<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>function Person(...) { this.firstName = ... }</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>function Person(...) { this.firstName = ... }</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first, last, age, eye) {
        this.firstName = first;
        this.lastName = last;
        this.age = age;
        this.eyeColor = eye;
      }
      const sample = new Person("John", "Doe", 50, "blue");
      document.getElementById("demo").innerText = "typeof Person -> " + String(typeof Person) + "\n" + "sample.firstName -> " + String(sample.firstName) + "\n" + "sample.eyeColor -> " + String(sample.eyeColor);
    </script>
  </body>
</html>
