<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>history.forward() — next session entry</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <button type="button" id="b">Go Forward</button>
    <pre id="demo"></pre>
    <script>
      document.getElementById("b").onclick = function () { history.forward(); };
      document.getElementById("demo").innerText =
        "typeof forward=" + typeof history.forward + " (not clicked)";
    </script>
  </body>
</html>
