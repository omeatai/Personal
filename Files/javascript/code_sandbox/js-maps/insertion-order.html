<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object vs Map — key order</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object vs Map — key order</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const obj = {};
      obj.z = 1;
      obj.a = 2;
      obj[1] = 3;
      const fruits = new Map();
      fruits.set('z', 1);
      fruits.set('a', 2);
      fruits.set(1, 3);
      document.getElementById("demo").innerText = "Object.keys(obj) -> " + String(JSON.stringify(Object.keys(obj))) + "\n" + "Array.from(fruits.keys()) -> " + String(JSON.stringify(Array.from(fruits.keys())));
    </script>
  </body>
</html>
