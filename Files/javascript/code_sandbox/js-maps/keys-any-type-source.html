<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object vs Map — key types source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>const obj = {};
obj[1] = &#x27;num&#x27;;
obj[{x: 1}] = &#x27;obj&#x27;;
const fruits = new Map();
const key = {x: 1};
fruits.set(1, &#x27;num&#x27;);
fruits.set(key, &#x27;obj&#x27;);</pre>
  </body>
</html>
