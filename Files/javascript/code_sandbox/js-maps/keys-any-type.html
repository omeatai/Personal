<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object vs Map — key types</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object vs Map — key types</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const obj = {};
      obj[1] = 'num';
      obj[{x: 1}] = 'obj';
      const fruits = new Map();
      const key = {x: 1};
      fruits.set(1, 'num');
      fruits.set(key, 'obj');
      document.getElementById("demo").innerText = "Object.keys(obj) -> " + String(JSON.stringify(Object.keys(obj))) + "\n" + "obj['[object Object]'] -> " + String(obj['[object Object]']) + "\n" + "Array.from(fruits.keys()) -> " + String(JSON.stringify(Array.from(fruits.keys()))) + "\n" + "fruits.get(key) -> " + String(fruits.get(key)) + "\n" + "fruits.get(1) -> " + String(fruits.get(1));
    </script>
  </body>
</html>
