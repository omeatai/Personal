<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>from() — array from an object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>from() — array from an object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = Array.from("ABC");
      document.getElementById("demo").innerText = "letters -> " + String(JSON.stringify(letters));
    </script>
  </body>
</html>
