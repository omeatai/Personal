<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>concat() — join arrays</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>concat() — join arrays</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const a = ["Cecilie", "Lone"];
      const b = a.concat(["Emil"]);
      document.getElementById("demo").innerText = "b -> " + String(JSON.stringify(b));
    </script>
  </body>
</html>
