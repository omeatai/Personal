<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>toString() — array as a string</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>toString() — array as a string</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      let text = fruits.toString();
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
