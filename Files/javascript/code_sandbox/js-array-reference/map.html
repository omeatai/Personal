<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>map() — new array from a function</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>map() — new array from a function</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const doubled = [4, 9, 16].map(v => v * 2);
      document.getElementById("demo").innerText = "doubled -> " + String(JSON.stringify(doubled));
    </script>
  </body>
</html>
