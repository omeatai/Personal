<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>entries() — [index, value] iterator</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>entries() — [index, value] iterator</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      const pairs = Array.from(fruits.entries());
      document.getElementById("demo").innerText = "pairs -> " + String(JSON.stringify(pairs));
    </script>
  </body>
</html>
