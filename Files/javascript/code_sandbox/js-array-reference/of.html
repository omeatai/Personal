<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>of() — array from arguments</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>of() — array from arguments</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const a = Array.of(7);
      const b = Array.of(1, 2, 3);
      document.getElementById("demo").innerText = "a -> " + String(JSON.stringify(a)) + "\n" + "b -> " + String(JSON.stringify(b));
    </script>
  </body>
</html>
