<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>some() — any pass a test?</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>some() — any pass a test?</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers = [4, 9, 16, 25, 29];
      let ok = numbers.some(v => v > 18);
      document.getElementById("demo").innerText = "ok -> " + String(ok);
    </script>
  </body>
</html>
