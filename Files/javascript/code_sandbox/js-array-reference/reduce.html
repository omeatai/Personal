<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>reduce() — fold left to right</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>reduce() — fold left to right</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers = [45, 4, 9, 16, 25];
      let sum = numbers.reduce((t, v) => t + v);
      document.getElementById("demo").innerText = "sum -> " + String(sum);
    </script>
  </body>
</html>
