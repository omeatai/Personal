<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Automatic HTML validation — required</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <form id="f" action="#"><input name="fname" required id="fname"><button type="submit">Submit</button></form>
    <pre id="demo"></pre>
    <script>
      const f = document.getElementById("f");
      f.addEventListener("submit", function (e) { e.preventDefault(); });
      document.getElementById("demo").innerText =
        "checkValidity=" + f.checkValidity() +
        "\nrequired empty=" + document.getElementById("fname").validity.valueMissing;
    </script>
  </body>
</html>
