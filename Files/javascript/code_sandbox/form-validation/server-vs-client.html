<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Data validation — client vs server</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p>Typical checks: required fields, valid date, text not in a numeric field.</p>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText = [
        "Client-side: browser, before request",
        "Server-side: server, after request"
      ].join("\n");
    </script>
  </body>
</html>
