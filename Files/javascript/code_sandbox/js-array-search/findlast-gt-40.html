<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>findLast(x =&gt; x &gt; 40)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>findLast(x =&gt; x &gt; 40)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const temp = [27, 28, 30, 40, 42, 35, 30];
      let high = temp.findLast(x => x > 40);
      document.getElementById("demo").innerText = "high -> " + String(high);
    </script>
  </body>
</html>
