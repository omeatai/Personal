<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>includes(&quot;Mango&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>includes(&quot;Mango&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      fruits.includes("Mango");
      document.getElementById("demo").innerText = "fruits.includes(\"Mango\") -> " + String(fruits.includes("Mango"));
    </script>
  </body>
</html>
