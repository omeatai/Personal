<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Function `myFunction(p1, p2)` returns p1 * p2</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Function `myFunction(p1, p2)` returns p1 * p2</h2>
    <pre id="demo"></pre>
    <script>
      function myFunction(p1, p2) {
        return p1 * p2;
      }
      document.getElementById("demo").innerText =
        "myFunction(3, 4) -> " + myFunction(3, 4);
    </script>
  </body>
</html>
