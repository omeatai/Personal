<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Conditional `if` / `else` (age 20 Adult)</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Conditional `if` / `else` (age 20 Adult)</h2>
    <pre id="demo"></pre>
    <script>
      function status(age) {
        let text = "Unknown";
        if (age >= 18) {
          text = "Adult";
        } else {
          text = "Minor";
        }
        return text;
      }
      document.getElementById("demo").innerText =
        "age 20 -> " + status(20) + "\n" +
        "age 16 (other branch) -> " + status(16);
    </script>
  </body>
</html>
