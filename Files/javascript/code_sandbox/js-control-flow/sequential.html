<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Default sequential flow</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Default sequential flow</h2>
    <pre id="demo"></pre>
    <script>
      let x = 5;
      let y = 6;
      let z = x + y;
      document.getElementById("demo").innerText =
        "x -> " + x + "\n" +
        "y -> " + y + "\n" +
        "z -> " + z;
    </script>
  </body>
</html>
