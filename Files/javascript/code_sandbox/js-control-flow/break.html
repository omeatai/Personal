<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`break` when i === 3</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`break` when i === 3</h2>
    <pre id="demo"></pre>
    <script>
      let text = "";
      for (let i = 0; i < 10; i++) {
        if (i === 3) {
          break;
        }
        text += "The number is " + i + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + text.trim();
    </script>
  </body>
</html>
