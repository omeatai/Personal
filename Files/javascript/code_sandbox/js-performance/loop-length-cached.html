<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Better: cache arr.length outside the comparison</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Better: cache arr.length outside the comparison</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const arr = [1, 2, 3, 4];
      let l = arr.length;
      let sum = 0;
      for (let i = 0; i < l; i++) {
        sum += arr[i];
      }
      document.getElementById("demo").innerText = "l -> " + String(l) + "\n" + "sum -> " + String(sum);
    </script>
  </body>
</html>
