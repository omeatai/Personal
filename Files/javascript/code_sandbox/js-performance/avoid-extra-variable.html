<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Don&#x27;t create a variable you never reuse</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Don&#x27;t create a variable you never reuse</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const firstName = "Ada";
      const lastName = "Lovelace";
      const withVar = firstName + " " + lastName;
      const inline = firstName + " " + lastName;
      document.getElementById("demo").innerText =
        "with variable -> " + withVar + "\n" +
        "inline -> " + inline;
    </script>
  </body>
</html>
