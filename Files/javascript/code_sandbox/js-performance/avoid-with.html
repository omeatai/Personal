<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Avoid with — slow, clutters scope, illegal in strict mode</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Avoid with — slow, clutters scope, illegal in strict mode</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let sloppy;
      (function () {
        let x;
        with (Math) { x = cos(0); }
        sloppy = x;
      })();
      let strictMsg;
      try {
        new Function('"use strict"; with (Math) { return cos(0); }')();
        strictMsg = "ran";
      } catch (e) {
        strictMsg = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "sloppy with cos(0) -> " + sloppy + "\n" +
        "strict with -> " + strictMsg;
    </script>
  </body>
</html>
