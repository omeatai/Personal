<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Delay JS: put scripts at the bottom, or defer, or onload inject</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Delay JS: put scripts at the bottom, or defer, or onload inject</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const element = document.createElement("script");
      element.textContent = "window.__injected = true;";
      document.body.appendChild(element);
      document.getElementById("demo").innerText =
        "injected -> " + window.__injected + "\n" +
        "prefer: script at end of body, or src + defer";
    </script>
  </body>
</html>
