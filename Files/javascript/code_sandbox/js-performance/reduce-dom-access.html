<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Cache getElementById instead of searching the DOM twice</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Cache getElementById instead of searching the DOM twice</h2>
    <p id="demo">(empty)</p>
    <pre id="demo"></pre>
    
    <script>
      const obj = document.getElementById("demo");
      obj.innerText = "Hello";
    </script>
  </body>
</html>
