<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Everything with a value is true source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>let rows = [
  [&quot;100&quot;, Boolean(100)],
  [&quot;3.14&quot;, Boolean(3.14)],
  [&quot;-15&quot;, Boolean(-15)],
  [&quot;true&quot;, Boolean(true)],
  [&#x27;&quot;Hello&quot;&#x27;, Boolean(&quot;Hello&quot;)],
  [&#x27;&quot;false&quot;&#x27;, Boolean(&quot;false&quot;)],
  [&quot;7+1+3.14&quot;, Boolean(7 + 1 + 3.14)],
  [&quot;[]&quot;, Boolean([])],
  [&quot;{}&quot;, Boolean({})]
];</pre>
  </body>
</html>
