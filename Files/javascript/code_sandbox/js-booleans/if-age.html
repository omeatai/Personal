<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>if (age &lt; 18)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>if (age &lt; 18)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let age = 16;
      let text = "adult path";
      if (age < 18) {
        text = "too young";
      }
      document.getElementById("demo").innerText = "age < 18 -> " + String(age < 18) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
