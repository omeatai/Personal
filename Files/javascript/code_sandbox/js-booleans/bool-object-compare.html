<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Boolean(false) == new Boolean(false)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Boolean(false) == new Boolean(false)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = Boolean(false);
      let y = new Boolean(false);
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "typeof y -> " + String(typeof y) + "\n" + "x == y -> " + String(x == y) + "\n" + "x === y -> " + String(x === y);
    </script>
  </body>
</html>
