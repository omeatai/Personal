<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for (x in person)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for (x in person)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {fname: "John", lname: "Doe"};
      let text = "";
      for (let x in person) {
        text += person[x];
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
