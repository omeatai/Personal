<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>if (day == &quot;Monday&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>if (day == &quot;Monday&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let day = "Monday";
      let text = "not Monday";
      if (day == "Monday") {
        text = "It is Monday";
      }
      document.getElementById("demo").innerText = "day == \"Monday\" -> " + String(day == "Monday") + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
