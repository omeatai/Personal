<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>if (salary &gt; 9000)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>if (salary &gt; 9000)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let salary = 12000;
      let text = "below";
      if (salary > 9000) {
        text = "above 9000";
      }
      document.getElementById("demo").innerText = "salary > 9000 -> " + String(salary > 9000) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
