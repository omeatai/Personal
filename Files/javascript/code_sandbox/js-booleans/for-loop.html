<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for (i = 0; i &lt; 5; i++)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for (i = 0; i &lt; 5; i++)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "";
      for (let i = 0; i < 5; i++) {
        text += i;
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
