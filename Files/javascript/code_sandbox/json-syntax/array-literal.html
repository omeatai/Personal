<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON array literal</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const a = JSON.parse('["Ford","BMW","Fiat"]');
      document.getElementById("demo").innerText = a.length + " " + a[0];
    </script>
  </body>
</html>
