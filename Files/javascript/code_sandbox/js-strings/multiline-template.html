<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Multiline template string</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Multiline template string</h2>
    <pre id="demo"></pre>
    <script>
      let text =
`The quick
brown fox
jumps over
the lazy dog`;
      document.getElementById("demo").innerText = text;
    </script>
  </body>
</html>
