<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Escape \" double quote</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Escape \&quot; double quote</h2>
    <pre id="demo"></pre>
    <script>
      let text = "We are the so-called \"Vikings\" from the north.";
      document.getElementById("demo").innerText = "text -> " + text;
    </script>
  </body>
</html>
