<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let carName does not belong to window</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let carName does not belong to window</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let carName = "Volvo";
      document.getElementById("demo").innerText =
        "carName -> " + carName + "\n" +
        "window.carName -> " + String(window.carName);
    </script>
  </body>
</html>
