<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`typeof` is bigint</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`typeof` is bigint</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = BigInt(999999999999999);
      let type = typeof x;
      document.getElementById("demo").innerText = "type -> " + String(type);
    </script>
  </body>
</html>
