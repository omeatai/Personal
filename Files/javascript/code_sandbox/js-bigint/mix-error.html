<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Cannot mix BigInt and Number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Cannot mix BigInt and Number</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 10n;
      let y = 5;
      let mix;
      try { mix = x + y; } catch (e) { mix = e.name; }
      let z = Number(x) + y;
      document.getElementById("demo").innerText =
        "x + y -> " + mix + "\n" +
        "Number(x) + y -> " + z;
    </script>
  </body>
</html>
