<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Comparisons with Numbers</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Comparisons with Numbers</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = (10n > 5n);
      let y = (10n === 10);
      let z = (10n == 10);
      document.getElementById("demo").innerText = "10n > 5n -> " + String(x) + "\n" + "10n === 10 -> " + String(y) + "\n" + "10n == 10 -> " + String(z);
    </script>
  </body>
</html>
