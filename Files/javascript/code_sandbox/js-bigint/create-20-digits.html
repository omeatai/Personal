<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>20-digit BigInt</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>20-digit BigInt</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 12345678901234567890n;
      let y = BigInt("12345678901234567890");
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "y -> " + String(y) + "\n" + "x === y -> " + String(x === y);
    </script>
  </body>
</html>
