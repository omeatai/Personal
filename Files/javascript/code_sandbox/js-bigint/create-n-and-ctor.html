<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Create BigInt: `n` suffix and `BigInt()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Create BigInt: `n` suffix and `BigInt()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 999999999999999n;
      let y = BigInt("999999999999999");
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "y -> " + String(y) + "\n" + "typeof x -> " + String(typeof x);
    </script>
  </body>
</html>
