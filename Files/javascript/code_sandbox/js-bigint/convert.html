<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>BigInt ↔ Number conversion</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>BigInt ↔ Number conversion</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let largeNumber = BigInt("12345678901234567890");
      let num = Number(largeNumber);
      document.getElementById("demo").innerText = "largeNumber -> " + String(largeNumber) + "\n" + "num -> " + String(num);
    </script>
  </body>
</html>
