<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>use y before var y = 7 — y is undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>use y before var y = 7 — y is undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      var x = 5;
      let text = x + " " + y;
      var y = 7;
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "y after -> " + String(y);
    </script>
  </body>
</html>
