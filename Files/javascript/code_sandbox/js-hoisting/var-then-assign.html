<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>var x then x = 5 — same result 5</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>var x then x = 5 — same result 5</h2>
    
    <pre id="demo"></pre>
    
    <script>
      var x;
      x = 5;
      document.getElementById("demo").innerText = "x -> " + String(x);
    </script>
  </body>
</html>
