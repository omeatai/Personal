<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Destructuring does not change the source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Destructuring does not change the source</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { firstName: "John", lastName: "Doe" };
      let { firstName } = person;
      firstName = "Jane";
      document.getElementById("demo").innerText = "firstName -> " + String(firstName) + "\n" + "person.firstName -> " + String(person.firstName);
    </script>
  </body>
</html>
