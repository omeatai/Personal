<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Nested array destructuring</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Nested array destructuring</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const pair = [1, [2, 3], 4];
      let [a, [b, c], d] = pair;
      document.getElementById("demo").innerText = "a -> " + String(a) + "\n" + "b -> " + String(b) + "\n" + "c -> " + String(c) + "\n" + "d -> " + String(d);
    </script>
  </body>
</html>
