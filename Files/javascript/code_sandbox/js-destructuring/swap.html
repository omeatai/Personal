<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Swap two variables</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Swap two variables</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let firstName = "John";
      let lastName = "Doe";
      [firstName, lastName] = [lastName, firstName];
      document.getElementById("demo").innerText = "firstName -> " + String(firstName) + "\n" + "lastName -> " + String(lastName);
    </script>
  </body>
</html>
