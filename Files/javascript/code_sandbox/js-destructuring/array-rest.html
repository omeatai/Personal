<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array rest — [a, b, ...rest]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array rest — [a, b, ...rest]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers = [10, 20, 30, 40, 50, 60, 70];
      const [a, b, ...rest] = numbers;
      document.getElementById("demo").innerText = "a -> " + String(a) + "\n" + "b -> " + String(b) + "\n" + "rest -> " + String(String(rest));
    </script>
  </body>
</html>
