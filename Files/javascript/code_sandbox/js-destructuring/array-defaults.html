<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array defaults — [a = &#x27;A&#x27;, b = &#x27;B&#x27;]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array defaults — [a = &#x27;A&#x27;, b = &#x27;B&#x27;]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let [a = "A", b = "B"] = ["Bananas"];
      document.getElementById("demo").innerText = "a -> " + String(a) + "\n" + "b -> " + String(b);
    </script>
  </body>
</html>
