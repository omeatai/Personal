<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Numeric coercion: &quot;5&quot; - 2 is 3</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Numeric coercion: &quot;5&quot; - 2 is 3</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "5" - 2;
      let y = "abc" - 1;
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "typeof x -> " + String(typeof x) + "\n" + "\"abc\" - 1 -> " + String(y) + "\n" + "Number.isNaN(y) -> " + String(Number.isNaN(y));
    </script>
  </body>
</html>
