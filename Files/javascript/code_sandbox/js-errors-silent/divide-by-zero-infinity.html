<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>1 / 0 is Infinity — silent vs throw</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>1 / 0 is Infinity — silent vs throw</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let silent = 1 / 0;
      let thrown;
      try {
        let x = 1 / 0;
        if (!Number.isFinite(x)) throw new Error("division produced Infinity");
      } catch (e) {
        thrown = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "silent 1 / 0 -> " + String(silent) + "\n" +
        "with throw -> " + thrown;
    </script>
  </body>
</html>
