<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>String coercion: &quot;5&quot; + 2 is &quot;52&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>String coercion: &quot;5&quot; + 2 is &quot;52&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "5" + 2;
      let y = Number("5") + 2;
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "typeof x -> " + String(typeof x) + "\n" + "Number(\"5\") + 2 -> " + String(y);
    </script>
  </body>
</html>
