<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>user.name on {} is undefined — silent vs throw</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>user.name on {} is undefined — silent vs throw</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const user = {};
      let silent = user.name;
      let thrown;
      try {
        if (user.name === undefined) throw new Error("missing name");
      } catch (e) {
        thrown = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "silent user.name -> " + String(silent) + "\n" +
        "with throw -> " + thrown;
    </script>
  </body>
</html>
