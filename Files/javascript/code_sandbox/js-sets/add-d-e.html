<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>add(&quot;d&quot;) and add(&quot;e&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>add(&quot;d&quot;) and add(&quot;e&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      letters.add("d");
      letters.add("e");
      document.getElementById("demo").innerText = "Array.from(letters) -> " + String(JSON.stringify(Array.from(letters))) + "\n" + "letters.size -> " + String(letters.size);
    </script>
  </body>
</html>
