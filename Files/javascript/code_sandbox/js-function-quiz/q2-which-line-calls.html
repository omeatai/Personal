<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Q2: Which line calls the function? → C let y = test()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Q2: Which line calls the function? → C let y = test()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function test() {
        return 5;
      }
      let x = test;
      let y = test();
      document.getElementById("demo").innerText = "typeof x -> " + String(typeof x) + "\n" + "y -> " + String(y) + "\n" + "answer -> " + String("C");
    </script>
  </body>
</html>
