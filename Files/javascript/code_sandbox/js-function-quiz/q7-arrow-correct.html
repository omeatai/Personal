<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Q7: Which arrow is correct? → C const add = (a, b) =&gt; a + b</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Q7: Which arrow is correct? → C const add = (a, b) =&gt; a + b</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let a, b, c;
      try {
        eval("const add = (a, b) => return a + b");
        a = "parsed";
      } catch (e) {
        a = e.name;
      }
      try {
        eval("const add = a, b => a + b");
        b = "parsed";
      } catch (e) {
        b = e.name;
      }
      const add = (a, b) => a + b;
      c = add(2, 3);
      document.getElementById("demo").innerText =
        "A (=> return) -> " + a + "\n" +
        "B (a, b =>) -> " + b + "\n" +
        "C add(2, 3) -> " + c + "\n" +
        "answer -> C";
    </script>
  </body>
</html>
