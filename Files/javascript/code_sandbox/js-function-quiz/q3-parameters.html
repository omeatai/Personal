<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Q3: What are a and b? → B Parameters</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Q3: What are a and b? → B Parameters</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function multiply(a, b) {
        return a * b;
      }
      let result = multiply(4, 5);
      document.getElementById("demo").innerText = "a and b are -> " + String("parameters") + "\n" + "4 and 5 are -> " + String("arguments") + "\n" + "result -> " + String(result) + "\n" + "answer -> " + String("B");
    </script>
  </body>
</html>
