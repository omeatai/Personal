<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Q9: Why does the arrow method fail? → B Arrow functions do not have their own this</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Q9: Why does the arrow method fail? → B Arrow functions do not have their own this</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {
        name: "John",
        greet: () => this.name
      };
      let text = person.greet();
      document.getElementById("demo").innerText = "text -> " + String(String(text)) + "\n" + "is John? -> " + String(text === 'John') + "\n" + "answer -> " + String("B");
    </script>
  </body>
</html>
