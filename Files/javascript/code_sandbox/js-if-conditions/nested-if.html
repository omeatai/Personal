<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Nested `if` (USA, age 16)</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Nested `if` (USA, age 16)</h2>
    <pre id="demo"></pre>
    <script>
      let age = 16;
      let country = "USA";
      let text = "You can Not drive!";
      if (country == "USA") {
        if (age >= 16) {
          text = "You can drive!";
        }
      }
      document.getElementById("demo").innerText =
        "country -> " + country + "\n" +
        "age -> " + age + "\n" +
        "text -> " + text;
    </script>
  </body>
</html>
