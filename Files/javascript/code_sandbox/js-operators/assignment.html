<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Operators - Assignment</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Assignment Operators</h2>
    <pre id="demo"></pre>
    <script>
      let log = "";
      let x = 10;
      log += "x = 10   -> " + x + "\n";
      x += 5;
      log += "x += 5   -> " + x + "\n";
      x -= 3;
      log += "x -= 3   -> " + x + "\n";
      x *= 2;
      log += "x *= 2   -> " + x + "\n";
      x /= 4;
      log += "x /= 4   -> " + x + "\n";
      x %= 4;
      log += "x %= 4   -> " + x + "\n";
      x **= 3;
      log += "x **= 3  -> " + x;
      document.getElementById("demo").innerText = log;
    </script>
  </body>
</html>
