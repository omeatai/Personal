<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>10 === &quot;10&quot; is false (strict comparison)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>10 === &quot;10&quot; is false (strict comparison)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 10;
      let y = "10";
      document.getElementById("demo").innerText = "x === y -> " + String(x === y);
    </script>
  </body>
</html>
