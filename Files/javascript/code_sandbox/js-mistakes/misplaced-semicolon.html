<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>if (x == 19);{ } always runs the block</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>if (x == 19);{ } always runs the block</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 0;
      let ranBad = false;
      if (x == 19);
      {
        ranBad = true;
      }
      let ranGood = false;
      if (x == 19) {
        ranGood = true;
      }
      document.getElementById("demo").innerText =
        "with extra semicolon, block ran -> " + ranBad + "\n" +
        "normal if, block ran -> " + ranGood;
    </script>
  </body>
</html>
