<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>10 + 5 is 15; 10 += &quot;5&quot; is &quot;105&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>10 + 5 is 15; 10 += &quot;5&quot; is &quot;105&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 10;
      x = 10 + 5;
      let y = 10;
      y += "5";
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "typeof x -> " + String(typeof x) + "\n" + "y -> " + String(JSON.stringify(y)) + "\n" + "typeof y -> " + String(typeof y);
    </script>
  </body>
</html>
