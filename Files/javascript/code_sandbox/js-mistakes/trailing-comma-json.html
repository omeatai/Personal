<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON.parse rejects trailing commas</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>JSON.parse rejects trailing commas</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let ok, bad;
      try { ok = JSON.parse('{"firstName":"John","age":46}'); }
      catch (e) { ok = e.name + ": " + e.message; }
      try { bad = JSON.parse('{"firstName":"John","age":46,}'); }
      catch (e) { bad = e.name + ": " + e.message; }
      document.getElementById("demo").innerText =
        "valid JSON -> " + JSON.stringify(ok) + "\n" +
        "trailing comma -> " + bad;
    </script>
  </body>
</html>
