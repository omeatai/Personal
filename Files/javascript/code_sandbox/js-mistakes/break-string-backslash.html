<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Backslash continues a string across lines</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Backslash continues a string across lines</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "Hello \
      World!";
      document.getElementById("demo").innerText = "x -> " + String(JSON.stringify(x));
    </script>
  </body>
</html>
