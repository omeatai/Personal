<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>return a * power with semicolons — same result</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>return a * power with semicolons — same result</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction(a) {
        let power = 10;
        return a * power;
      }
      document.getElementById("demo").innerText = "myFunction(2) -> " + String(myFunction(2));
    </script>
  </body>
</html>
