<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>x + y is 15 or &quot;105&quot; depending on y&#x27;s type</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>x + y is 15 or &quot;105&quot; depending on y&#x27;s type</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 10;
      let y = 5;
      let z = x + y;
      let y2 = "5";
      let z2 = x + y2;
      document.getElementById("demo").innerText = "z -> " + String(z) + "\n" + "z2 -> " + String(JSON.stringify(z2));
    </script>
  </body>
</html>
