<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>person[&quot;firstName&quot;] turns the array into a plain object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>person[&quot;firstName&quot;] turns the array into a plain object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = [];
      person["firstName"] = "John";
      person["lastName"] = "Doe";
      person["age"] = 46;
      document.getElementById("demo").innerText = "length -> " + String(person.length) + "\n" + "person[0] -> " + String(String(person[0])) + "\n" + "person.firstName -> " + String(person.firstName) + "\n" + "Array.isArray(person) -> " + String(Array.isArray(person));
    </script>
  </body>
</html>
