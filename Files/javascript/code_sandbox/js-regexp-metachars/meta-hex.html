<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>\xhh — hexadecimal replace</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>\xhh — hexadecimal replace</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "Visit W3Schools. Hello World!";
      let pattern = /\x6F/g;
      let result = text.replace(pattern, "*");
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
