<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Primitives throw on add()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Primitives throw on add()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const mySet = new WeakSet();
      const obj = {x: 1};
      let r0;
      try {
        r0 = (mySet.add(obj), mySet.has(obj));
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = mySet.add("hello");
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      let r2;
      try {
        r2 = mySet.add(42);
      } catch (e) {
        r2 = e.name + ": " + e.message;
      }
      let r3;
      try {
        r3 = mySet.add(null);
      } catch (e) {
        r3 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "mySet.add(obj); has -> " + String(r0) + "\n" + "mySet.add(\"hello\") -> " + String(r1) + "\n" + "mySet.add(42) -> " + String(r2) + "\n" + "mySet.add(null) -> " + String(r3);
    </script>
  </body>
</html>
