<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WeakSet is not iterable</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>WeakSet is not iterable</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const mySet = new WeakSet();
      const obj = {x: 1};
      mySet.add(obj);
      let r0;
      try {
        r0 = [...mySet];
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = (function () { for (const x of mySet) {} return 'looped'; })();
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      let r2;
      try {
        r2 = mySet.forEach(function () {});
      } catch (e) {
        r2 = e.name + ": " + e.message;
      }
      let r3;
      try {
        r3 = mySet.values();
      } catch (e) {
        r3 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "[...mySet] -> " + String(r0) + "\n" + "for...of -> " + String(r1) + "\n" + "mySet.forEach(fn) -> " + String(r2) + "\n" + "mySet.values() -> " + String(r3);
    </script>
  </body>
</html>
