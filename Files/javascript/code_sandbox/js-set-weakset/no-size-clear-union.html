<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>No size, clear(), or logic methods</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>No size, clear(), or logic methods</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const mySet = new WeakSet();
      let r0;
      try {
        r0 = mySet.size;
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = typeof mySet.clear;
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      let r2;
      try {
        r2 = mySet.clear();
      } catch (e) {
        r2 = e.name + ": " + e.message;
      }
      let r3;
      try {
        r3 = typeof mySet.union;
      } catch (e) {
        r3 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "mySet.size -> " + String(r0) + "\n" + "typeof mySet.clear -> " + String(r1) + "\n" + "mySet.clear() -> " + String(r2) + "\n" + "typeof mySet.union -> " + String(r3);
    </script>
  </body>
</html>
