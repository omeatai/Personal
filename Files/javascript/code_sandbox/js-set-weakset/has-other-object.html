<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>has() is by reference</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>has() is by reference</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const mySet = new WeakSet();
      const a = {fname:"John", lname:"Doe"};
      const b = {fname:"John", lname:"Doe"};
      mySet.add(a);
      document.getElementById("demo").innerText = "mySet.has(a) -> " + String(mySet.has(a)) + "\n" + "mySet.has(b) -> " + String(mySet.has(b));
    </script>
  </body>
</html>
