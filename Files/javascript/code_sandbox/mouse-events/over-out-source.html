<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>mouseover and mouseout on a box source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>&lt;div id=&quot;box&quot;&gt;Move mouse over this box&lt;/div&gt;
&lt;script&gt;
const box = document.getElementById(&quot;box&quot;);
box.addEventListener(&quot;mouseover&quot;, function () { box.innerHTML = &quot;Mouse is over me!&quot;; });
box.addEventListener(&quot;mouseout&quot;, function () { box.innerHTML = &quot;Mouse is out!&quot;; });
&lt;/script&gt;</pre>
  </body>
</html>
