<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>dblclick</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <button type="button" id="b">Double-click</button>
    <pre id="demo"></pre>
    <script>
      document.getElementById("b").addEventListener("dblclick", function () {
        document.getElementById("demo").innerText = "double";
      });
      document.getElementById("b").dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
    </script>
  </body>
</html>
