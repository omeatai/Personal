<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>function* with three yield values</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>function* with three yield values</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function* myStream() {
        yield 1;
        yield 2;
        yield 3;
      }
      let myGenerator = myStream();
      let text = "";
      for (let value of myGenerator) {
        text += value + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
