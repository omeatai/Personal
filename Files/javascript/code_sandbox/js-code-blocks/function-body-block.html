<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Function body is a code block</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Function body is a code block</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction() {
        // This is a code block
        let a = 1;
        let b = 2;
        return a + b;
      }
      let result = myFunction();
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
