<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>if / else blocks</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>if / else blocks</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function check(n) {
        if (n > 5) {
          return "if block: " + n + " is greater than 5";
        } else {
          return "else block: " + n + " is not greater than 5";
        }
      }
      document.getElementById("demo").innerText = "check(10) -> " + String(check(10)) + "\n" + "check(3) -> " + String(check(3));
    </script>
  </body>
</html>
