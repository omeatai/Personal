<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>Source</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #f1f1f1;
        color: #111;
        font-family: Consolas, "Courier New", monospace;
      }
      body {
        padding: 16px;
        box-sizing: border-box;
      }
      h3 {
        font-family: sans-serif;
        margin: 0 0 8px;
      }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        white-space: pre-wrap;
        font-size: 16px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre id="src"></pre>
    <script>
      document.getElementById("src").textContent = decodeURIComponent(
        new URLSearchParams(location.search).get("q") || "",
      );
    </script>
  </body>
</html>
