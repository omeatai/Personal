<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Six numbers: new Array vs []</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Six numbers: new Array vs []</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const a = new Array(40, 100, 1, 5, 25, 10);
      const b = [40, 100, 1, 5, 25, 10];
      document.getElementById("demo").innerText = "a -> " + String(JSON.stringify(a)) + "\n" + "b -> " + String(JSON.stringify(b));
    </script>
  </body>
</html>
