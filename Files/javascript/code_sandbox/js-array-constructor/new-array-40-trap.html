<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WARNING new Array(40) — 40 empty slots</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>WARNING new Array(40) — 40 empty slots</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const points = new Array(40);
      document.getElementById("demo").innerText = "points.length -> " + String(points.length) + "\n" + "0 in points -> " + String(0 in points) + "\n" + "points[0] -> " + String(points[0]);
    </script>
  </body>
</html>
