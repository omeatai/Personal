<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array(3) without new — three empty spots</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array(3) without new — three empty spots</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const a = Array(3);
      document.getElementById("demo").innerText = "a -> " + String(JSON.stringify(a)) + "\n" + "a.length -> " + String(a.length) + "\n" + "0 in a -> " + String(0 in a);
    </script>
  </body>
</html>
