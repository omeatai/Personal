<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>const multiply = function(a, b)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>const multiply = function(a, b)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const multiply = function(a, b) {
        return a * b;
      };
      document.getElementById("demo").innerText = "typeof multiply -> " + String(typeof multiply) + "\n" + "multiply(4, 3) -> " + String(multiply(4, 3));
    </script>
  </body>
</html>
