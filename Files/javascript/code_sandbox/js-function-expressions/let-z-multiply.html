<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let z = multiply(4, 3)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let z = multiply(4, 3)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const multiply = function(a, b) {
        return a * b;
      };
      let z = multiply(4, 3);
      document.getElementById("demo").innerText = "z -> " + String(z);
    </script>
  </body>
</html>
