<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Function declaration is hoisted</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Function declaration is hoisted</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let sum = add(2, 3);
      function add(a, b) {
        return a + b;
      }
      document.getElementById("demo").innerText = "sum -> " + String(sum);
    </script>
  </body>
</html>
