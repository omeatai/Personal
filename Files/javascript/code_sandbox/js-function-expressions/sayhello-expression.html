<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>sayHello expression called</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>sayHello expression called</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const sayHello = function() {
        return "Hello World";
      };
      sayHello();
      document.getElementById("demo").innerText = "sayHello() -> " + String(sayHello());
    </script>
  </body>
</html>
