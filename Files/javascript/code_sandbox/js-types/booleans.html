<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Types - Booleans, undefined, empty</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Booleans, undefined & empty</h2>
    <pre id="demo"></pre>
    <script>
      let b = 10 > 9; // true
      let c = 10 > 11; // false
      let car; // declared, no value -> undefined
      let carEmpty = ""; // an empty string is a legal string
      document.getElementById("demo").innerText =
        "10 > 9  = " + b + " (boolean)\n" +
        "10 > 11 = " + c + " (boolean)\n" +
        "car (no value): value=" + car + ", typeof=" + typeof car + "\n" +
        'carEmpty = "": typeof=' + typeof carEmpty + " (empty string is still a string)\n" +
        "typeof null = " + typeof null + " (known quirk)";
    </script>
  </body>
</html>
