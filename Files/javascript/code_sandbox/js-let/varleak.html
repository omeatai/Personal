<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Let - var is not block scoped</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>var Is Not Block Scoped</h2>
    <pre id="demo"></pre>
    <script>
      var x = 10;
      let out = "outside before block, x = " + x + "\n";
      {
        var x = 2; // same x -> changes the outer variable
        out += "inside block,        x = " + x + "\n";
      }
      out += "outside after block,  x = " + x + "   <- var leaked out!";
      document.getElementById("demo").innerText = out;
    </script>
  </body>
</html>
