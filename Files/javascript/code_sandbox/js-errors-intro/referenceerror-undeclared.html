<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>ReferenceError — y is not defined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>ReferenceError — y is not defined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 5;
      let r0;
      try {
        r0 = (x = y + 1);
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "x = y + 1 -> " + String(r0);
    </script>
  </body>
</html>
