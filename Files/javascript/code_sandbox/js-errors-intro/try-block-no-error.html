<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>try — catch is skipped when nothing throws</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>try — catch is skipped when nothing throws</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let status = "start";
      try {
        status = "try ran";
      } catch (err) {
        status = "catch ran: " + err;
      }
      document.getElementById("demo").innerText = "status -> " + String(status);
    </script>
  </body>
</html>
