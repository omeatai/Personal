<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Avoid eval() — it runs text as code</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Avoid eval() — it runs text as code</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = eval("2 + 2");
      let y = 2 + 2;
      document.getElementById("demo").innerText = "eval -> " + String(x) + "\n" + "plain 2 + 2 -> " + String(y);
    </script>
  </body>
</html>
