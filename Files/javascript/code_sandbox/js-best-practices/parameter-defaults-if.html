<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Default a missing argument: if (y === undefined) y = 0</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Default a missing argument: if (y === undefined) y = 0</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction(x, y) {
        if (y === undefined) {
          y = 0;
        }
        return x + y;
      }
      document.getElementById("demo").innerText = "myFunction(5) -> " + String(myFunction(5)) + "\n" + "myFunction(5, 2) -> " + String(myFunction(5, 2));
    </script>
  </body>
</html>
