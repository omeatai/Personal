<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Put all declarations at the top of the script or function</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Put all declarations at the top of the script or function</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let firstName, lastName, price, discount, fullPrice;
      firstName = "John";
      lastName = "Doe";
      price = 19.90;
      discount = 0.10;
      fullPrice = price - discount;
      document.getElementById("demo").innerText = "firstName -> " + String(firstName) + "\n" + "fullPrice -> " + String(fullPrice);
    </script>
  </body>
</html>
