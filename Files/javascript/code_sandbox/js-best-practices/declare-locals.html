<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Always declare local variables (var / let / const)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Always declare local variables (var / let / const)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function sloppy() { implicit = 1; }
      sloppy();
      let strictMsg;
      try {
        (function () {
          "use strict";
          implicit2 = 1;
        })();
        strictMsg = "assigned";
      } catch (e) {
        strictMsg = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "global implicit -> " + implicit + "\n" +
        "strict implicit2 -> " + strictMsg;
    </script>
  </body>
</html>
