<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Initialize variables when you declare them</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Initialize variables when you declare them</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let firstName = "";
      let price = 0;
      const myArray = [];
      const myObject = {};
      document.getElementById("demo").innerText = "firstName -> " + String(JSON.stringify(firstName)) + "\n" + "price -> " + String(price) + "\n" + "Array.isArray(myArray) -> " + String(Array.isArray(myArray)) + "\n" + "typeof myObject -> " + String(typeof myObject);
    </script>
  </body>
</html>
