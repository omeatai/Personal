<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Avoid global variables — they can be overwritten</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Avoid global variables — they can be overwritten</h2>
    
    <pre id="demo"></pre>
    
    <script>
      var leaked = "global";
      function hide() {
        let local = "local";
        return local;
      }
      let localMsg;
      try { localMsg = local; } catch (e) { localMsg = e.name + ": " + e.message; }
      document.getElementById("demo").innerText =
        "leaked -> " + leaked + "\n" +
        "hide() -> " + hide() + "\n" +
        "bare local -> " + localMsg;
    </script>
  </body>
</html>
