<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let cars = [...]; cars = 3 changes array to number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let cars = [...]; cars = 3 changes array to number</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let cars = ["Saab", "Volvo", "BMW"];
      cars = 3;
      document.getElementById("demo").innerText = "cars -> " + String(cars) + "\n" + "Array.isArray(cars) -> " + String(Array.isArray(cars));
    </script>
  </body>
</html>
