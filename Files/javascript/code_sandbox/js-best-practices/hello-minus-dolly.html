<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>&quot;Hello&quot; - &quot;Dolly&quot; returns NaN</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>&quot;Hello&quot; - &quot;Dolly&quot; returns NaN</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "Hello" - "Dolly";
      document.getElementById("demo").innerText = "x -> " + String(String(x)) + "\n" + "Number.isNaN(x) -> " + String(Number.isNaN(x));
    </script>
  </body>
</html>
