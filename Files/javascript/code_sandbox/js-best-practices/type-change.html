<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let x = &quot;Hello&quot;; x = 5 changes typeof to number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let x = &quot;Hello&quot;; x = 5 changes typeof to number</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "Hello";
      const first = typeof x;
      x = 5;
      document.getElementById("demo").innerText =
        "first typeof -> " + first + "\n" +
        "after x = 5 -> " + typeof x;
    </script>
  </body>
</html>
