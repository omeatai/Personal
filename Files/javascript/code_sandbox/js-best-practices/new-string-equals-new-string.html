<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>new String(&quot;John&quot;) == new String(&quot;John&quot;) is false</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>new String(&quot;John&quot;) == new String(&quot;John&quot;) is false</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = new String("John");
      let y = new String("John");
      document.getElementById("demo").innerText = "x == y -> " + String(x == y) + "\n" + "x.valueOf() == y.valueOf() -> " + String(x.valueOf() == y.valueOf());
    </script>
  </body>
</html>
