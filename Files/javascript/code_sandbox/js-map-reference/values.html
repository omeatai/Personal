<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>values() — value iterator</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>values() — value iterator</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Map([
        ["apples", 500],
        ["bananas", 300],
        ["oranges", 200]
      ]);
      const list = Array.from(fruits.values());
      document.getElementById("demo").innerText = "list -> " + String(JSON.stringify(list));
    </script>
  </body>
</html>
