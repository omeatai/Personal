<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>clear() — removes all elements</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>clear() — removes all elements</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Map([
        ["apples", 500],
        ["bananas", 300],
        ["oranges", 200]
      ]);
      fruits.clear();
      document.getElementById("demo").innerText = "fruits.size -> " + String(fruits.size) + "\n" + "Array.from(fruits) -> " + String(JSON.stringify(Array.from(fruits)));
    </script>
  </body>
</html>
