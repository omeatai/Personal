  <body>
    <h3>Example</h3>
    <pre>const fruits = [
  {name:&quot;apples&quot;, quantity:300},
  {name:&quot;bananas&quot;, quantity:500},
  {name:&quot;oranges&quot;, quantity:200},
  {name:&quot;kiwi&quot;, quantity:150}
];
function myCallback({ quantity }) {
  return quantity &gt; 200 ? &quot;ok&quot; : &quot;low&quot;;
}
const result = Map.groupBy(fruits, myCallback);</pre>
