<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>set() — set the value for a key</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>set() — set the value for a key</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Map([
        ["apples", 500],
        ["bananas", 300],
        ["oranges", 200]
      ]);
      const ret = fruits.set("apples", 200);
      document.getElementById("demo").innerText = "fruits.get(\"apples\") -> " + String(fruits.get("apples")) + "\n" + "ret === fruits -> " + String(ret === fruits) + "\n" + "Array.from(fruits) -> " + String(JSON.stringify(Array.from(fruits)));
    </script>
  </body>
</html>
