<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>has() — whether a key exists</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>has() — whether a key exists</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Map([
        ["apples", 500],
        ["bananas", 300],
        ["oranges", 200]
      ]);
      fruits.has("oranges");
      document.getElementById("demo").innerText = "fruits.has(\"oranges\") -> " + String(fruits.has("oranges")) + "\n" + "fruits.has(\"kiwi\") -> " + String(fruits.has("kiwi"));
    </script>
  </body>
</html>
