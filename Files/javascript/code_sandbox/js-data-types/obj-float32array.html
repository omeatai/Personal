<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Float32Array</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Float32Array</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const a = new Float32Array([1.5, 2]);
      document.getElementById("demo").innerText = "a -> " + String(String(a)) + "\n" + "a.BYTES_PER_ELEMENT -> " + String(a.BYTES_PER_ELEMENT);
    </script>
  </body>
</html>
