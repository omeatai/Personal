<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Map</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Map</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const m = new Map([["apples", 500], ["bananas", 300]]);
      let n = m.get("apples");
      document.getElementById("demo").innerText = "m.get(\"apples\") -> " + String(n) + "\n" + "m.size -> " + String(m.size) + "\n" + "typeof m -> " + String(typeof m);
    </script>
  </body>
</html>
