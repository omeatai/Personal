<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Dynamic types — same variable, new type</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Dynamic types — same variable, new type</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x;          // undefined
      x = 5;          // Number
      x = "John";     // String
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "typeof x -> " + String(typeof x);
    </script>
  </body>
</html>
