<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["Saab", "Volvo", "BMW"];
      document.getElementById("demo").innerText = "cars -> " + String(String(cars)) + "\n" + "cars[0] -> " + String(cars[0]) + "\n" + "typeof cars -> " + String(typeof cars) + "\n" + "Array.isArray(cars) -> " + String(Array.isArray(cars));
    </script>
  </body>
</html>
