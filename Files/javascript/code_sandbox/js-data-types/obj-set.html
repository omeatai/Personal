<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Set</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Set</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const s = new Set(["A", "B", "A"]);
      let n = s.size;
      document.getElementById("demo").innerText = "s.size -> " + String(n) + "\n" + "s.has(\"A\") -> " + String(s.has("A")) + "\n" + "typeof s -> " + String(typeof s);
    </script>
  </body>
</html>
