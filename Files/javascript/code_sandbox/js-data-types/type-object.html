<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {firstName:"John", lastName:"Doe"};
      document.getElementById("demo").innerText = "person.firstName -> " + String(person.firstName) + "\n" + "typeof person -> " + String(typeof person) + "\n" + "String(person) -> " + String(String(person));
    </script>
  </body>
</html>
