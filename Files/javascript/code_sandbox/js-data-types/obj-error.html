<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Error</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Error</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const err = new Error("Oops");
      document.getElementById("demo").innerText = "err.name -> " + String(err.name) + "\n" + "err.message -> " + String(err.message) + "\n" + "String(err) -> " + String(String(err));
    </script>
  </body>
</html>
