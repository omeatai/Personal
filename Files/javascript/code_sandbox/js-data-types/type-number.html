<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Number</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let length = 16;
      let weight = 7.5;
      document.getElementById("demo").innerText = "length -> " + String(length) + "\n" + "weight -> " + String(weight) + "\n" + "typeof length -> " + String(typeof length);
    </script>
  </body>
</html>
