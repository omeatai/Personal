<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Syntax</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>JavaScript Syntax</h2>
    <p id="literals"></p>
    <p id="keywords"></p>
    <p id="sum"></p>
    <p id="expr"></p>
    <p id="names"></p>
    <script>
      document.getElementById("literals").innerText =
        "Literals: " +
        10.5 +
        ", " +
        1001 +
        ", " +
        "John Doe" +
        ", " +
        "John Doe";
      let x = 5;
      const fname = "John";
      document.getElementById("keywords").innerText =
        "let x = " + x + "; const fname = " + fname;
      let y = 6;
      let sum = x + y;
      document.getElementById("sum").innerText = "x + y = " + sum;
      document.getElementById("expr").innerText =
        "(5 + 6) * 10 = " +
        (5 + 6) * 10 +
        '; "John" + " " + "Doe" = ' +
        ("John" + " " + "Doe");
      let lastName = "Doe";
      let lastname = "Peterson";
      document.getElementById("names").innerText =
        "lastName = " + lastName + "; lastname = " + lastname;
    </script>
  </body>
</html>
