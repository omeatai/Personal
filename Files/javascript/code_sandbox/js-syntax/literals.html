<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Syntax - Literals</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>JavaScript Literals</h2>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText =
        "Numbers (with or without decimals): " + 10.5 + ", " + 1001 + "\n" +
        'Strings (double or single quotes): "John Doe", ' + "'John Doe'";
    </script>
  </body>
</html>
