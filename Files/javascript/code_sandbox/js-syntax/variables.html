<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Syntax - Keywords & Variables</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Keywords &amp; Variables</h2>
    <pre id="demo"></pre>
    <script>
      let x = 5;
      const fname = "John";
      let y;
      y = 6;
      document.getElementById("demo").innerText =
        "let x = " + x + "\n" +
        'const fname = "' + fname + '"\n' +
        "y (defined, then assigned 6) = " + y;
    </script>
  </body>
</html>
