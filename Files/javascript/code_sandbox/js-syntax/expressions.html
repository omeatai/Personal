<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Syntax - Operators & Expressions</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Operators &amp; Expressions</h2>
    <pre id="demo"></pre>
    <script>
      let x = 5,
        y = 6;
      let sum = x + y;
      document.getElementById("demo").innerText =
        "x + y = " + sum + "\n" +
        "5 * 10 = " + 5 * 10 + "\n" +
        "(5 + 6) * 10 = " + (5 + 6) * 10 + "\n" +
        '"John" + " " + "Doe" = ' + ("John" + " " + "Doe");
    </script>
  </body>
</html>
