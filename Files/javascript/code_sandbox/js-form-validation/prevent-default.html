<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>submit + event.preventDefault() so the page does not reload</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
input { padding: 8px; width: 260px; margin-bottom: 4px; }
.error { color: red; margin: 0; }
.ok { color: green; margin: 0; }
.field { margin-bottom: 12px; }

    </style>
  </head>
  <body>
    <h2>Sign Up</h2>
<form id="signupForm">
  <div class="field">
    <label for="name">Name:</label><br>
    <input type="text" id="name">
    <p class="error" id="nameError"></p>
  </div>
  <div class="field">
    <label for="email">Email:</label><br>
    <input type="text" id="email">
    <p class="error" id="emailError"></p>
  </div>
  <div class="field">
    <label for="password">Password:</label><br>
    <input type="password" id="password">
    <p class="error" id="passwordError"></p>
  </div>
  <div class="field">
    <label for="confirm">Confirm Password:</label><br>
    <input type="password" id="confirm">
    <p class="error" id="confirmError"></p>
  </div>
  <button type="submit">Create Account</button>
  <p id="result"></p>
</form>
    <pre id="log"></pre>
    <script>
      const __log = [];
      function note(s) {
        __log.push(s);
        const el = document.getElementById("log");
        if (el) el.innerText = __log.join("\n");
      }
      const form = document.getElementById("signupForm");
      const result = document.getElementById("result");
      function validateForm() { return false; }
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        result.innerHTML = "";
        if (validateForm()) {
          result.innerHTML = "Form is valid!";
          result.className = "ok";
        } else {
          result.innerHTML = "Please fix the errors.";
          result.className = "error";
        }
      });
      form.requestSubmit();
      note("result -> " + result.innerHTML);
      note("class -> " + result.className);

    </script>
  </body>
</html>
