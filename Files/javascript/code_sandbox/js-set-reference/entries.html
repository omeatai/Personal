<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>entries() — [value, value] pairs</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>entries() — [value, value] pairs</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      const pairs = Array.from(letters.entries());
      document.getElementById("demo").innerText = "pairs -> " + String(JSON.stringify(pairs));
    </script>
  </body>
</html>
