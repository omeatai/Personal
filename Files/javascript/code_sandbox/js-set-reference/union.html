<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>union()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>union()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const A = new Set(["a","b","c"]);
      const B = new Set(["b","c","d"]);
      const C = A.union(B);
      document.getElementById("demo").innerText = "Array.from(C) -> " + String(JSON.stringify(Array.from(C))) + "\n" + "Array.from(A) unchanged -> " + String(JSON.stringify(Array.from(A)));
    </script>
  </body>
</html>
