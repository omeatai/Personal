<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>isSubsetOf() — all elements are in the other Set</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>isSubsetOf() — all elements are in the other Set</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const A = new Set(["a","b","c"]);
      const B = new Set(["b","c","d"]);
      const small = new Set(['b','c']);
      document.getElementById("demo").innerText = "A.isSubsetOf(B) -> " + String(A.isSubsetOf(B)) + "\n" + "small.isSubsetOf(A) -> " + String(small.isSubsetOf(A));
    </script>
  </body>
</html>
