<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>values() — iterator of values</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>values() — iterator of values</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      const list = Array.from(letters.values());
      document.getElementById("demo").innerText = "list -> " + String(JSON.stringify(list));
    </script>
  </body>
</html>
