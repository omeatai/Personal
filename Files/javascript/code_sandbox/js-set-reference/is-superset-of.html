<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>isSupersetOf() — contains the other Set</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>isSupersetOf() — contains the other Set</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const A = new Set(["a","b","c"]);
      const B = new Set(["b","c","d"]);
      const small = new Set(['b','c']);
      document.getElementById("demo").innerText = "A.isSupersetOf(B) -> " + String(A.isSupersetOf(B)) + "\n" + "A.isSupersetOf(small) -> " + String(A.isSupersetOf(small));
    </script>
  </body>
</html>
