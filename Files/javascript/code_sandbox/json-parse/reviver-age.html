<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Reviver — convert age to a number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const person = JSON.parse('{"name":"John","age":"30"}', function (key, value) {
        if (key == "age") { return Number(value); }
        return value;
      });
      document.getElementById("demo").innerText = typeof person.age + " " + person.age;
    </script>
  </body>
</html>
