<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>String.match(regexp)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>String.match(regexp)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const text = "a1 a2";
      const result = text.match(/a(\d)/);
      const all = text.match(/a(\d)/g);
      const miss = text.match(/z/);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result)) + "\n" + "all -> " + String(JSON.stringify(all)) + "\n" + "miss -> " + String(JSON.stringify(miss));
    </script>
  </body>
</html>
