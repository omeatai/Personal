<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>compile() — deprecated</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>compile() — deprecated</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const pattern = /abc/g;
      pattern.compile("def", "i");
      document.getElementById("demo").innerText = "pattern.source -> " + String(pattern.source) + "\n" + "pattern.flags -> " + String(pattern.flags) + "\n" + "String(pattern) -> " + String(String(pattern));
    </script>
  </body>
</html>
