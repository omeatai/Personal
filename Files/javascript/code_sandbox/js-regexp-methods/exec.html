<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>exec()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>exec()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const result = /e/.exec("The best things in life are free!");
      document.getElementById("demo").innerText = "JSON.stringify(result) -> " + String(JSON.stringify(result)) + "\n" + "result.index -> " + String(result.index);
    </script>
  </body>
</html>
