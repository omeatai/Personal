<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>escape() — RegExp.escape</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>escape() — RegExp.escape</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let result;
      try {
        result = RegExp.escape("[*]");
      } catch (e) {
        result = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result));
    </script>
  </body>
</html>
