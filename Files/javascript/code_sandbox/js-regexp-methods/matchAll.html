<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>String.matchAll(regexp)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>String.matchAll(regexp)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const text = "a1 a2";
      const result = [...text.matchAll(/a(\d)/g)].map((m) => [...m]);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result));
    </script>
  </body>
</html>
