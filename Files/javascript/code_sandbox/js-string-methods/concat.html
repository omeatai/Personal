<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`concat()` Hello World</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`concat()` Hello World</h2>
    <pre id="demo"></pre>
    <script>
      let text1 = "Hello";
      let text2 = "World";
      document.getElementById("demo").innerText =
        'concat(" ", "World") -> ' + text1.concat(" ", text2);
    </script>
  </body>
</html>
