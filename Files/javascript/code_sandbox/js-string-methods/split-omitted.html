<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`split()` with no separator</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`split()` with no separator</h2>
    <pre id="demo"></pre>
    <script>
      let text = "The quick brown fox.";
      document.getElementById("demo").innerText =
        "split() -> " + JSON.stringify(text.split());
    </script>
  </body>
</html>
