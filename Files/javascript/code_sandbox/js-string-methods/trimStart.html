<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`trimStart()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`trimStart()`</h2>
    <pre id="demo"></pre>
    <script>
      let text1 = " Hello World! ";
      document.getElementById("demo").innerText =
        "original  -> '" + text1 + "'\n" +
        "trimStart -> '" + text1.trimStart() + "'";
    </script>
  </body>
</html>
