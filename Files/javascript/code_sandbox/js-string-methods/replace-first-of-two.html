<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`replace()` only the first of two</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`replace()` only the first of two</h2>
    <pre id="demo"></pre>
    <script>
      let text = "Please visit Microsoft and Microsoft!";
      document.getElementById("demo").innerText =
        "replace first of two -> " + text.replace("Microsoft", "W3Schools");
    </script>
  </body>
</html>
