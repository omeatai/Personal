<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>d.toDateString()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>d.toDateString()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date();
      d.toDateString();
      document.getElementById("demo").innerText = "d.toDateString() -> " + String(d.toDateString());
    </script>
  </body>
</html>
