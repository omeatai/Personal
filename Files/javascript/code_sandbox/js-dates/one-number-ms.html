<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>1 number: new Date(2018) is milliseconds, not year</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>1 number: new Date(2018) is milliseconds, not year</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date(2018);
      document.getElementById("demo").innerText = "d -> " + String(String(d)) + "\n" + "d.getTime() -> " + String(d.getTime());
    </script>
  </body>
</html>
