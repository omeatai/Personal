<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>new Date(9, 11, 24) → 1909</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>new Date(9, 11, 24) → 1909</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date(9, 11, 24);
      document.getElementById("demo").innerText = "d -> " + String(String(d)) + "\n" + "d.getFullYear() -> " + String(d.getFullYear());
    </script>
  </body>
</html>
