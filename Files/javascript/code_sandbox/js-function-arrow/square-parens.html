<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>square (x) =&gt; with parentheses</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>square (x) =&gt; with parentheses</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const square = (x) => x * x;
      let z = square(5);
      document.getElementById("demo").innerText = "z -> " + String(z);
    </script>
  </body>
</html>
