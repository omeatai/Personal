<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>hello arrow with no parameters</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>hello arrow with no parameters</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const hello = () => "Hello World!";
      let text = hello();
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
