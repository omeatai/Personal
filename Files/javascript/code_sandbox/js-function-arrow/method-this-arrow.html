<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Method this with arrow → not John</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Method this with arrow → not John</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {
        name: "John",
        greet: () => {
          return this.name;
        }
      };
      let text = person.greet();
      document.getElementById("demo").innerText = "text -> " + String(String(text)) + "\n" + "text === 'John' -> " + String(text === 'John') + "\n" + "typeof text -> " + String(typeof text);
    </script>
  </body>
</html>
