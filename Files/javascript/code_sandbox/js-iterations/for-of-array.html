<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for...of over an array (table row; no Tryit)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for...of over an array (table row; no Tryit)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["BMW", "Volvo", "Saab", "Ford"];
      let text = "";
      for (const car of cars) {
        text += car + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
