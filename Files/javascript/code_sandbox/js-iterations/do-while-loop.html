<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>do...while (i &lt; 10)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>do...while (i &lt; 10)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "";
      let i = 0;
      do {
        text += "The number is " + i + "\n";
        i++;
      } while (i < 10);
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "i after loop -> " + String(i);
    </script>
  </body>
</html>
