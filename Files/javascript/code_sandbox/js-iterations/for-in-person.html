<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for...in over a person object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for...in over a person object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {fname:"John", lname:"Doe", age:25};
      let txt = "";
      for (let x in person) {
        txt += person[x] + " ";
      }
      document.getElementById("demo").innerText = "txt -> " + String(txt);
    </script>
  </body>
</html>
