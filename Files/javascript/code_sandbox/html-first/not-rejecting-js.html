<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Why HTML-First is not “no JavaScript”</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p>Use the browser's built-in features before adding extra complexity.</p>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText = "HTML-first does not mean JavaScript never. It means HTML before JavaScript.";
    </script>
  </body>
</html>
