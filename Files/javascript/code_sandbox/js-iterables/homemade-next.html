<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Home-made iterator: next() never done</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Home-made iterator: next() never done</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myNumbers() {
        let n = 0;
        return {
          next: function() {
            n += 10;
            return {value:n, done:false};
          }
        };
      }
      const n = myNumbers();
      const a = n.next();
      const b = n.next();
      const c = n.next();
      const d = n.next();
      document.getElementById("demo").innerText = "a -> " + String(JSON.stringify(a)) + "\n" + "b -> " + String(JSON.stringify(b)) + "\n" + "c -> " + String(JSON.stringify(c)) + "\n" + "d.value (Tryit display) -> " + String(d.value);
    </script>
  </body>
</html>
