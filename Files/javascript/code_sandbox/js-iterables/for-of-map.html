<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for...of over a Map of fruits</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for...of over a Map of fruits</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Map([
        ["apples", 500],
        ["bananas", 300],
        ["oranges", 200]
      ]);
      let text = "";
      for (const x of fruits) {
        text += x + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "first pair JSON -> " + String(JSON.stringify([...fruits][0]));
    </script>
  </body>
</html>
