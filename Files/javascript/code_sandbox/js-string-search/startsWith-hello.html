<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`startsWith("Hello")`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`startsWith(&quot;Hello&quot;)`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "Hello world, welcome to the universe.";
      document.getElementById("demo").innerText =
        'startsWith("Hello") -> ' + text.startsWith("Hello");
    </script>
  </body>
</html>
