<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`matchAll("Cats")`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`matchAll(&quot;Cats&quot;)`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "I love cats. Cats are very easy to love. Cats are very popular.";
      const found = Array.from(text.matchAll("Cats"), (m) => m[0]);
      document.getElementById("demo").innerText =
        'matchAll("Cats") -> ' + found.join(", ");
    </script>
  </body>
</html>
