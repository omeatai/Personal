<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`match("ain")`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`match(&quot;ain&quot;)`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "The rain in SPAIN stays mainly in the plain";
      const m = text.match("ain");
      document.getElementById("demo").innerText =
        'match("ain")[0] -> ' + m[0] + "\n" +
        "index           -> " + m.index;
    </script>
  </body>
</html>
