<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Property names in variables (page typo + fix)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Property names in variables (page typo + fix)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { firstName: "John", lastName: "Doe", age: 50 };
      let n1 = "firstName";
      let n2 = "lastName";
      let name = person[n2] + " " + person[n2];
      let clarified = person[n1] + " " + person[n2];
      document.getElementById("demo").innerText = "page: person[n2] + person[n2] -> " + String(name) + "\n" + "clarifying: person[n1] + person[n2] -> " + String(clarified);
    </script>
  </body>
</html>
