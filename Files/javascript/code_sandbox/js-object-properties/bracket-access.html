<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Bracket: person[&quot;firstName&quot;] + age</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Bracket: person[&quot;firstName&quot;] + age</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { firstName: "John", lastName: "Doe", age: 50 };
      let text = person["firstName"] + " is " + person["age"];
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
