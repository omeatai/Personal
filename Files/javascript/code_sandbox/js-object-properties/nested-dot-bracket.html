<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Nested: myObj.myCars[&quot;car2&quot;]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Nested: myObj.myCars[&quot;car2&quot;]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myObj = {
        name: "John",
        age: 30,
        myCars: { car1: "Ford", car2: "BMW", car3: "Fiat" }
      };
      document.getElementById("demo").innerText = "myObj.myCars[\"car2\"] -> " + String(myObj.myCars["car2"]);
    </script>
  </body>
</html>
