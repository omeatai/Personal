<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Nested: myObj[p1][p2]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Nested: myObj[p1][p2]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myObj = {
        name: "John",
        age: 30,
        myCars: { car1: "Ford", car2: "BMW", car3: "Fiat" }
      };
      let p1 = "myCars";
      let p2 = "car2";
      let car = myObj[p1][p2];
      document.getElementById("demo").innerText = "car -> " + String(car);
    </script>
  </body>
</html>
