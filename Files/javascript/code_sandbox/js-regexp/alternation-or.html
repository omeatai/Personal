<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>/red|green|blue/g — alternation</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>/red|green|blue/g — alternation</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "Black, white, red, green, blue, yellow.";
      let result = text.match(/red|green|blue/g);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result));
    </script>
  </body>
</html>
