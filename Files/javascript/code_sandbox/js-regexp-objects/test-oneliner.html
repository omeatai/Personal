<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>/e/.test(text) — no variable</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>/e/.test(text) — no variable</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let result = /e/.test("The best things in life are free!");
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
