<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Local variable carName</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Local variable carName</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction() {
        let carName = "Volvo";
        return carName;
      }
      let inside = myFunction();
      let outside;
      try {
        outside = carName;
      } catch (e) {
        outside = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "inside myFunction -> " + inside + "\n" +
        "outside -> " + outside;
    </script>
  </body>
</html>
