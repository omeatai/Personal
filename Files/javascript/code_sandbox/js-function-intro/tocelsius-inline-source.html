<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>toCelsius used inline as a variable value source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>function toCelsius(fahrenheit) {
  return (5 / 9) * (fahrenheit - 32);
}
let x = toCelsius(77);
let text1 = &quot;The temperature is &quot; + x + &quot; Celsius&quot;;
let text2 = &quot;The temperature is &quot; + toCelsius(77) + &quot; Celsius&quot;;</pre>
  </body>
</html>
