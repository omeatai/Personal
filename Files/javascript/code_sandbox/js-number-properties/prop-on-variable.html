<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Properties are not on variables</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Properties are not on variables</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 6;
      x.MAX_VALUE;
      document.getElementById("demo").innerText = "x.MAX_VALUE -> " + String(x.MAX_VALUE);
    </script>
  </body>
</html>
