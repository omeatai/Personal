<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`Number.NaN`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`Number.NaN`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = Number.NaN;
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "Number.isNaN(x) -> " + String(Number.isNaN(x));
    </script>
  </body>
</html>
