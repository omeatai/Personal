<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>setTimeout myFunction 3000 → Hello!</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>setTimeout myFunction 3000 → Hello!</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myDisplayer(t) {
        document.getElementById("demo").innerText = t;
      }
      setTimeout(myFunction, 3000);
      function myFunction() {
        myDisplayer("Hello!");
      }

    </script>
  </body>
</html>
