<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Passing extra args: setTimeout(showMessage, 2000, &quot;Hello&quot;, &quot;John&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Passing extra args: setTimeout(showMessage, 2000, &quot;Hello&quot;, &quot;John&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function showMessage(greeting, name) {
        document.getElementById("demo").innerText = greeting + " " + name;
      }
      setTimeout(showMessage, 2000, "Hello", "John");

    </script>
  </body>
</html>
