<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Long callback still blocks the page</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Long callback still blocks the page</h2>
    
    <pre id="demo"></pre>
    
    <script>
      setTimeout(function() {
        let i = 4e7;
        while (--i > 0);
        document.getElementById("demo").innerText = "Finished (loop 4e7; page used 4e9)";
      }, 1000);

    </script>
  </body>
</html>
