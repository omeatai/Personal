<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Repeated setTimeout (two ticks then stop)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Repeated setTimeout (two ticks then stop)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myDisplayer(t) {
        document.getElementById("demo").innerText = t;
      }
      let n = 0;
      function repeat() {
        n++;
        myDisplayer("Hello (tick " + n + ")");
        if (n < 2) setTimeout(repeat, 1000);
      }
      repeat();

    </script>
  </body>
</html>
