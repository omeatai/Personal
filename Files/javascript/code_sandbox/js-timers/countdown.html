<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Countdown (auto start)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Countdown (auto start)</h2>
    
    <pre id="demo"></pre>
    <p><button type="button" onclick="startCountdown()">Start Countdown</button></p>
    <script>
      function myDisplayer(t) {
        document.getElementById("demo").innerText = t;
      }
      let timer;
      function startCountdown() {
        clearInterval(timer);
        let count = 10;
        myDisplayer(String(count));
        timer = setInterval(function() {
          count--;
          myDisplayer(String(count));
          if (count === 0) {
            clearInterval(timer);
            myDisplayer("Finished!");
          }
        }, 1000);
      }
      startCountdown();

    </script>
  </body>
</html>
