<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Slideshow with text labels (nature / snow / mountains)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Slideshow with text labels (nature / snow / mountains)</h2>
    <p id="slide" style="font-size:28px;font-weight:bold;padding:12px 18px;border:3px solid #04aa6d;display:inline-block;">nature</p>
    <pre id="demo"></pre>
    <p><button type="button" onclick="startSlides()">Start</button> <button type="button" onclick="stopSlides()">Stop</button></p>
    <script>
      const images = ["nature", "snow", "mountains"];
      let index = 0;
      let timer;
      function showNextSlide() {
        index = (index + 1) % images.length;
        document.getElementById("slide").textContent = images[index];
        document.getElementById("demo").innerText = "slide " + images[index];
      }
      function startSlides() {
        if (!timer) {
          timer = setInterval(showNextSlide, 1000);
        }
      }
      function stopSlides() {
        clearInterval(timer);
        timer = undefined;
      }
      startSlides();

    </script>
  </body>
</html>
