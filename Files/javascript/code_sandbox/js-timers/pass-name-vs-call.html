<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Correct vs incorrect: pass the name, not myFunction()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Correct vs incorrect: pass the name, not myFunction()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myDisplayer(t) {
        document.getElementById("demo").innerText = t;
      }
      let lines = [];
      function myFunction() {
        lines.push("myFunction ran");
        myDisplayer(lines.join("\n"));
      }
      lines.push("incorrect: setTimeout(myFunction(), 3000)");
      setTimeout(myFunction(), 3000);
      lines.push("already ran (return value passed to setTimeout was undefined)");
      lines.push("correct form: setTimeout(myFunction, 3000)");
      myDisplayer(lines.join("\n"));

    </script>
  </body>
</html>
