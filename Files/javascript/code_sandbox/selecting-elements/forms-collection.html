<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Finding elements via document.forms</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <form id="frm1"><input name="a" value="Hello"><input name="b" value="World"></form>
    <pre id="demo"></pre>
    <script>
      const x = document.forms["frm1"];
      let text = "";
      for (let i = 0; i < x.length; i++) {
        text += x.elements[i].value + " ";
      }
      document.getElementById("demo").innerText = text;
    </script>
  </body>
</html>
