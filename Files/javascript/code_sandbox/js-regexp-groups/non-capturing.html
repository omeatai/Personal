<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>(?:x) — non-capturing group</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>(?:x) — non-capturing group</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "hahaha";
      let result = text.match(/(?:ha)+/);
      let cap = text.match(/(ha)+/);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result)) + "\n" + "cap -> " + String(JSON.stringify(cap));
    </script>
  </body>
</html>
