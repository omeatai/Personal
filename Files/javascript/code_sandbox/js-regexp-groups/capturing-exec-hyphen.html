<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>exec — capturing groups (Tryit hyphen)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>exec — capturing groups (Tryit hyphen)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "Alice loves Bob-";
      const pattern = /(\w+) loves (\w+)/;
      let result = pattern.exec(text);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result));
    </script>
  </body>
</html>
