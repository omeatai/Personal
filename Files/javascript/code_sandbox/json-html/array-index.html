<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Displaying a JSON array index</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText = JSON.parse('["Ford","Volvo","BMW"]')[0];
    </script>
  </body>
</html>
