<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>HTML table from JSON (local data stand-in for PHP)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <div id="box"></div>
    <pre id="demo"></pre>
    <script>
      const myObj = [{name:"John"},{name:"Anna"},{name:"Peter"}];
      const table = document.createElement("table");
      table.setAttribute("border", "1");
      for (const row of myObj) {
        const tr = table.insertRow();
        tr.insertCell().textContent = row.name;
      }
      document.getElementById("box").appendChild(table);
      document.getElementById("demo").innerText = table.innerText.replace(/\s+/g, " ");
    </script>
  </body>
</html>
