<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>HTML table from JSON (local data stand-in for PHP) source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>let text = &quot;&lt;table border=&#x27;1&#x27;&gt;&quot;;
for (let x in myObj) {
  text += &quot;&lt;tr&gt;&lt;td&gt;&quot; + myObj[x].name + &quot;&lt;/td&gt;&lt;/tr&gt;&quot;;
}</pre>
  </body>
</html>
