<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Displaying nested JSON</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const person = JSON.parse('{"name":"John","address":{"city":"New York","country":"USA"}}');
      document.getElementById("demo").innerText = person.address.city;
    </script>
  </body>
</html>
