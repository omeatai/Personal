<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Equivalent JSON for the product</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const o = JSON.parse('{"id":101,"currency":"USD","name":"Laptop","price":899}');
      document.getElementById("demo").innerText = o.name + " " + o.price + " " + o.currency;
    </script>
  </body>
</html>
