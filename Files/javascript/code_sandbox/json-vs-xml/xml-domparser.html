<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Working with XML — DOMParser</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const xmlDoc = new DOMParser().parseFromString("<person><name>John</name></person>", "text/xml");
      document.getElementById("demo").innerText =
        xmlDoc.getElementsByTagName("name")[0].textContent;
    </script>
  </body>
</html>
