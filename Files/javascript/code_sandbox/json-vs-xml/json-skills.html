<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON uses objects and arrays — skills</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const o = JSON.parse('{"name":"John","skills":["HTML","CSS","JavaScript"]}');
      document.getElementById("demo").innerText =
        Array.isArray(o.skills) + " " + o.skills[2];
    </script>
  </body>
</html>
