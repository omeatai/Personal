<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>XML can represent documents (mixed content)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const xml = "<message>Please read the <important>safety instructions</important> before continuing.</message>";
      const doc = new DOMParser().parseFromString(xml, "text/xml");
      document.getElementById("demo").innerText =
        doc.getElementsByTagName("important")[0].textContent;
    </script>
  </body>
</html>
