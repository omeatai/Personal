<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Add two strings</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Add two strings</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "10";
      let y = "20";
      let z = x + y;
      document.getElementById("demo").innerText = "z -> " + String(z) + "\n" + "typeof z -> " + String(typeof z);
    </script>
  </body>
</html>
