<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Division by zero</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Division by zero</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 2 / 0;
      let y = -2 / 0;
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "y -> " + String(y);
    </script>
  </body>
</html>
