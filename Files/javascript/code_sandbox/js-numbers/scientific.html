<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Scientific (exponent) notation</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Scientific (exponent) notation</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 123e5;    // 12300000
      let y = 123e-5;   // 0.00123
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "y -> " + String(y);
    </script>
  </body>
</html>
