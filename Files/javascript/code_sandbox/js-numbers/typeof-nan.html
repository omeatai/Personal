<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`typeof NaN` is number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`typeof NaN` is number</h2>
    
    <pre id="demo"></pre>
    
    <script>
      typeof NaN;
      document.getElementById("demo").innerText = "typeof NaN -> " + String(typeof NaN);
    </script>
  </body>
</html>
