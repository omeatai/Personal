<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Integer precision (15 digits)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Integer precision (15 digits)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 999999999999999;   // x will be 999999999999999
      let y = 9999999999999999;  // y will be 10000000000000000
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "y -> " + String(y);
    </script>
  </body>
</html>
