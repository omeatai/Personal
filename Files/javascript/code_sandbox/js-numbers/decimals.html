<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Decimals and integers</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Decimals and integers</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 3.14;    // A number with decimals
      let y = 3;       // A number without decimals
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "y -> " + String(y) + "\n" + "typeof x -> " + String(typeof x) + "\n" + "typeof y -> " + String(typeof y);
    </script>
  </body>
</html>
