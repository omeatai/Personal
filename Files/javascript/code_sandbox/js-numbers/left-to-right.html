<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Left-to-right: numbers then a string</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Left-to-right: numbers then a string</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 10;
      let y = 20;
      let z = "30";
      let result = x + y + z;
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
