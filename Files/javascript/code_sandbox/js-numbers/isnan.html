<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`isNaN()` checks Not-a-Number</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`isNaN()` checks Not-a-Number</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 100 / "Apple";
      isNaN(x);
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "isNaN(x) -> " + String(isNaN(x)) + "\n" + "isNaN(100 / '10') -> " + String(isNaN(100 / '10'));
    </script>
  </body>
</html>
