<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Two Number objects with ==</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Two Number objects with ==</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = new Number(500);
      let y = new Number(500);
      document.getElementById("demo").innerText = "x == y -> " + String(x == y);
    </script>
  </body>
</html>
