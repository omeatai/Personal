<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Add method: person.name = function () {...}</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Add method: person.name = function () {...}</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { firstName: "John", lastName: "Doe", age: 50 };
      person.name = function () {
        return this.firstName + " " + this.lastName;
      };
      document.getElementById("demo").innerText = "person.name() -> " + String(person.name());
    </script>
  </body>
</html>
