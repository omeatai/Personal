<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Fisher–Yates shuffle</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Fisher–Yates shuffle</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const points = [40, 100, 1, 5, 25, 10];
      for (let i = points.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        let k = points[i];
        points[i] = points[j];
        points[j] = k;
      }
      document.getElementById("demo").innerText = "points -> " + String(JSON.stringify(points));
    </script>
  </body>
</html>
