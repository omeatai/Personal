<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>sort(function(a, b){return b - a})</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>sort(function(a, b){return b - a})</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const points = [40, 100, 1, 5, 25, 10];
      points.sort(function(a, b){return b - a});
      document.getElementById("demo").innerText = "points -> " + String(JSON.stringify(points));
    </script>
  </body>
</html>
