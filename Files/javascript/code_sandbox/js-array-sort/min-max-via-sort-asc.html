<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Lowest / highest after ascending sort</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Lowest / highest after ascending sort</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const points = [40, 100, 1, 5, 25, 10];
      points.sort(function(a, b){return a - b});
      let lowest = points[0];
      let highest = points[points.length - 1];
      document.getElementById("demo").innerText = "points -> " + String(JSON.stringify(points)) + "\n" + "lowest -> " + String(lowest) + "\n" + "highest -> " + String(highest);
    </script>
  </body>
</html>
