<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>months.toSorted()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>months.toSorted()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const months = ["Jan", "Feb", "Mar", "Apr"];
      const sorted = months.toSorted();
      document.getElementById("demo").innerText = "sorted -> " + String(JSON.stringify(sorted)) + "\n" + "months -> " + String(JSON.stringify(months));
    </script>
  </body>
</html>
