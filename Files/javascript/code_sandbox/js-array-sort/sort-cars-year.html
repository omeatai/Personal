<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Sort cars by year</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Sort cars by year</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = [
        {type:"Volvo", year:2016},
        {type:"Saab", year:2001},
        {type:"BMW", year:2010}
      ];
      cars.sort(function(a, b){return a.year - b.year});
      document.getElementById("demo").innerText = "cars -> " + String(JSON.stringify(cars));
    </script>
  </body>
</html>
