<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Button click invoking showHello</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Button click invoking showHello</h2>
    
    <pre id="demo"></pre>
    <p><button type="button" onclick="showHello()">Click Me</button></p>
    <script>
      function sayHello() {
        return "Hello World";
      }
      function showHello() {
        document.getElementById("demo").innerHTML = sayHello();
      }
      showHello();
    </script>
  </body>
</html>
