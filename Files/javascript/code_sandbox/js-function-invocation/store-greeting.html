<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Store the greeting</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Store the greeting</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function sayHello() {
        return "Hello World";
      }
      let greeting = sayHello();
      document.getElementById("demo").innerText = "greeting -> " + String(greeting);
    </script>
  </body>
</html>
