<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Access without () — the function object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Access without () — the function object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function toCelsius(fahrenheit) {
        return (5 / 9) * (fahrenheit - 32);
      }
      let value = toCelsius;
      document.getElementById("demo").innerText = "typeof value -> " + String(typeof value) + "\n" + "String(value).slice(0, 60) -> " + String(String(value).replace(/\s+/g, ' ').slice(0, 60)) + "\n" + "value === toCelsius -> " + String(value === toCelsius);
    </script>
  </body>
</html>
