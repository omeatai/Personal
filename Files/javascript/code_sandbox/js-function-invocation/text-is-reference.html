<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let text = sayHello (reference)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let text = sayHello (reference)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function sayHello() {
        return "Hello World";
      }
      let text = sayHello;
      document.getElementById("demo").innerText = "typeof text -> " + String(typeof text) + "\n" + "text() -> " + String(text()) + "\n" + "text === sayHello -> " + String(text === sayHello);
    </script>
  </body>
</html>
