<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>setMilliseconds(500) — extra (table row, no Tryit)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>setMilliseconds(500) — extra (table row, no Tryit)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("January 01, 2025");
      d.setMilliseconds(500);
      document.getElementById("demo").innerText = "d -> " + String(String(d)) + "\n" + "d.getMilliseconds() -> " + String(d.getMilliseconds()) + "\n" + "d.toISOString() -> " + String(d.toISOString());
    </script>
  </body>
</html>
