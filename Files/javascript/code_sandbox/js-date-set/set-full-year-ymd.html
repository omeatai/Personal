<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>setFullYear(2020, 11, 3)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>setFullYear(2020, 11, 3)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("January 01, 2025");
      d.setFullYear(2020, 11, 3);
      document.getElementById("demo").innerText = "d -> " + String(String(d));
    </script>
  </body>
</html>
