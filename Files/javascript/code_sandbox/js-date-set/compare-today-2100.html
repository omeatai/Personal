<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Compare today vs January 14, 2100</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Compare today vs January 14, 2100</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "";
      const today = new Date();
      const someday = new Date();
      someday.setFullYear(2100, 0, 14);
      if (someday > today) {
        text = "Today is before January 14, 2100.";
      } else {
        text = "Today is after January 14, 2100.";
      }
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "today -> " + String(String(today)) + "\n" + "someday -> " + String(String(someday));
    </script>
  </body>
</html>
