<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>/\p{Emoji}/ without v</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>/\p{Emoji}/ without v</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "Hello \u{1F604}";
      const pattern = /\p{Emoji}/;
      let result = pattern.test(text);
      document.getElementById("demo").innerText = "result -> " + String(result) + "\n" + "pattern.source -> " + String(pattern.source);
    </script>
  </body>
</html>
