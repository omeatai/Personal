<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>/^is/m — multiline</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>/^is/m — multiline</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "\nIs th\nis it?";
      let result = text.match(/^is/m);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result));
    </script>
  </body>
</html>
