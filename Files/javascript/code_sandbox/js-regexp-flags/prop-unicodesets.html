<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>pattern.unicodeSets</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>pattern.unicodeSets</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "Hello \u{1F604}";
      const pattern = /\p{Emoji}/v;
      let result = pattern.unicodeSets;
      document.getElementById("demo").innerText = "result -> " + String(result) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
