<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>/\w+/y — sticky from lastIndex</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>/\w+/y — sticky from lastIndex</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "abc def ghi";
      const pattern = /\w+/y;
      pattern.lastIndex = 4;
      let result = text.match(pattern);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result)) + "\n" + "pattern.lastIndex -> " + String(pattern.lastIndex);
    </script>
  </body>
</html>
