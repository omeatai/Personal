<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>(?i:W3Schools) tutorials — inline i (true)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>(?i:W3Schools) tutorials — inline i (true)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "W3Schools tutorials.";
      let result;
      try {
        const pattern = new RegExp("(?i:W3Schools) tutorials", "");
        result = pattern.test(text);
      } catch (e) {
        result = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
