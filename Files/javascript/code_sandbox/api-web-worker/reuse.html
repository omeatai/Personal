<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Set w = undefined to reuse</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      let w = { fake: true };
      w = undefined;
      document.getElementById("demo").innerText = "typeof w=" + typeof w;
    </script>
  </body>
</html>
