<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>null.toString() is TypeError</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>null.toString() is TypeError</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let r0;
      try {
        r0 = null.toString();
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = undefined.toString();
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      let r2;
      try {
        r2 = String(null);
      } catch (e) {
        r2 = e.name + ": " + e.message;
      }
      let r3;
      try {
        r3 = String(undefined);
      } catch (e) {
        r3 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "null.toString() -> " + String(r0) + "\n" + "undefined.toString() -> " + String(r1) + "\n" + "String(null) -> " + String(r2) + "\n" + "String(undefined) -> " + String(r3);
    </script>
  </body>
</html>
