<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Number.prototype.toString — decimal</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Number.prototype.toString — decimal</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 123;
      let text = x.toString();
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "typeof text -> " + String(typeof text);
    </script>
  </body>
</html>
