<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Date.prototype.toString — local date/time</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Date.prototype.toString — local date/time</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date();
      let text = d.toString();
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
