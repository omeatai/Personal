<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object toString override</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object toString override</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let person = {
        firstname: "John",
        lastname: "Doe",
        toString: function () {
          return this.firstname + " " + this.lastname;
        }
      };
      let text = person.toString();
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "String(person) -> " + String(String(person));
    </script>
  </body>
</html>
