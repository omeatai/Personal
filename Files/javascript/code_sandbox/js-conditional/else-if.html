<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>The `else if` statement</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>The `else if` statement</h2>
    <pre id="demo"></pre>
    <script>
      let hour = 8;
      let greeting;
      if (hour < 10) {
        greeting = "Good morning";
      } else if (hour < 18) {
        greeting = "Good day";
      } else {
        greeting = "Good evening";
      }
      document.getElementById("demo").innerText =
        "hour -> " + hour + "\n" +
        "hour < 10 -> " + (hour < 10) + "\n" +
        "greeting -> " + greeting;
    </script>
  </body>
</html>
