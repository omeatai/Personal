<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>debugger; pauses like a breakpoint</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>debugger; pauses like a breakpoint</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 15 * 5;
      document.getElementById("demo").innerText =
        "x -> " + x + "\n" +
        "(debugger omitted so this page can finish)";
    </script>
  </body>
</html>
