<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Event bubbling vs capturing source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>&lt;div id=&quot;myDiv&quot;&gt;&lt;p id=&quot;myP&quot;&gt;click inner&lt;/p&gt;&lt;/div&gt;
&lt;script&gt;
document.getElementById(&quot;myP&quot;).addEventListener(&quot;click&quot;, function () { log(&quot;P&quot;); }, true);
document.getElementById(&quot;myDiv&quot;).addEventListener(&quot;click&quot;, function () { log(&quot;DIV&quot;); }, true);
&lt;/script&gt;</pre>
  </body>
</html>
