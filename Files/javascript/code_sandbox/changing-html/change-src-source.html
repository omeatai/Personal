<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Change an img src attribute source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>&lt;img id=&quot;myImage&quot; alt=&quot;demo&quot; src=&quot;smiley.svg&quot; width=&quot;48&quot; height=&quot;48&quot;&gt;
&lt;script&gt;
document.getElementById(&quot;myImage&quot;).src = &quot;landscape.svg&quot;;
&lt;/script&gt;</pre>
  </body>
</html>
