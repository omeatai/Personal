<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`Number.isFinite()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`Number.isFinite()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number.isFinite(123);
      document.getElementById("demo").innerText = "Number.isFinite(123) -> " + String(Number.isFinite(123)) + "\n" + "Number.isFinite(Infinity) -> " + String(Number.isFinite(Infinity)) + "\n" + "Number.isFinite(NaN) -> " + String(Number.isFinite(NaN));
    </script>
  </body>
</html>
