<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`Number.parseFloat()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`Number.parseFloat()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number.parseFloat("10");
      Number.parseFloat("10.33");
      Number.parseFloat("10 20 30");
      Number.parseFloat("10 years");
      Number.parseFloat("years 10");
      document.getElementById("demo").innerText = "Number.parseFloat(\"10\") -> " + String(Number.parseFloat("10")) + "\n" + "Number.parseFloat(\"10.33\") -> " + String(Number.parseFloat("10.33")) + "\n" + "Number.parseFloat(\"10 20 30\") -> " + String(Number.parseFloat("10 20 30")) + "\n" + "Number.parseFloat(\"10 years\") -> " + String(Number.parseFloat("10 years")) + "\n" + "Number.parseFloat(\"years 10\") -> " + String(Number.parseFloat("years 10"));
    </script>
  </body>
</html>
