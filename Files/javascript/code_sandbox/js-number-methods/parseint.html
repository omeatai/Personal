<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`parseInt()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`parseInt()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      parseInt("-10");
      parseInt("-10.33");
      parseInt("10");
      parseInt("10.33");
      parseInt("10 20 30");
      parseInt("10 years");
      parseInt("years 10");
      document.getElementById("demo").innerText = "parseInt(\"-10\") -> " + String(parseInt("-10")) + "\n" + "parseInt(\"-10.33\") -> " + String(parseInt("-10.33")) + "\n" + "parseInt(\"10\") -> " + String(parseInt("10")) + "\n" + "parseInt(\"10.33\") -> " + String(parseInt("10.33")) + "\n" + "parseInt(\"10 20 30\") -> " + String(parseInt("10 20 30")) + "\n" + "parseInt(\"10 years\") -> " + String(parseInt("10 years")) + "\n" + "parseInt(\"years 10\") -> " + String(parseInt("years 10"));
    </script>
  </body>
</html>
