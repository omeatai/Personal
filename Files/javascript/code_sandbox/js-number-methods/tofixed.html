<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`toFixed()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`toFixed()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 9.656;
      x.toFixed(0);
      x.toFixed(2);
      x.toFixed(4);
      x.toFixed(6);
      document.getElementById("demo").innerText = "toFixed(0) -> " + String(x.toFixed(0)) + "\n" + "toFixed(2) -> " + String(x.toFixed(2)) + "\n" + "toFixed(4) -> " + String(x.toFixed(4)) + "\n" + "toFixed(6) -> " + String(x.toFixed(6));
    </script>
  </body>
</html>
