<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`Number.isInteger()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`Number.isInteger()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number.isInteger(10);
      Number.isInteger(10.5);
      document.getElementById("demo").innerText = "Number.isInteger(10) -> " + String(Number.isInteger(10)) + "\n" + "Number.isInteger(10.5) -> " + String(Number.isInteger(10.5));
    </script>
  </body>
</html>
