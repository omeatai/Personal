<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`toString()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`toString()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 123;
      x.toString();
      (123).toString();
      (100 + 23).toString();
      document.getElementById("demo").innerText = "x.toString() -> " + String(x.toString()) + "\n" + "(123).toString() -> " + String((123).toString()) + "\n" + "(100 + 23).toString() -> " + String((100 + 23).toString()) + "\n" + "typeof x.toString() -> " + String(typeof x.toString());
    </script>
  </body>
</html>
