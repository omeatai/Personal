<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Static methods are not on variables</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Static methods are not on variables</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 10;
      let msg;
      try {
        x.isInteger();
        msg = "no error";
      } catch (e) {
        msg = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = msg;
    </script>
  </body>
</html>
