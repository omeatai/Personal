<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`Number.parseInt()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`Number.parseInt()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number.parseInt("-10");
      Number.parseInt("-10.33");
      Number.parseInt("10");
      Number.parseInt("10.33");
      Number.parseInt("10 20 30");
      Number.parseInt("10 years");
      Number.parseInt("years 10");
      document.getElementById("demo").innerText = "Number.parseInt(\"-10\") -> " + String(Number.parseInt("-10")) + "\n" + "Number.parseInt(\"-10.33\") -> " + String(Number.parseInt("-10.33")) + "\n" + "Number.parseInt(\"10\") -> " + String(Number.parseInt("10")) + "\n" + "Number.parseInt(\"10.33\") -> " + String(Number.parseInt("10.33")) + "\n" + "Number.parseInt(\"10 20 30\") -> " + String(Number.parseInt("10 20 30")) + "\n" + "Number.parseInt(\"10 years\") -> " + String(Number.parseInt("10 years")) + "\n" + "Number.parseInt(\"years 10\") -> " + String(Number.parseInt("years 10"));
    </script>
  </body>
</html>
