<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>&amp;&amp; AND — (x &lt; 10 &amp;&amp; y &gt; 1) is true</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>&amp;&amp; AND — (x &lt; 10 &amp;&amp; y &gt; 1) is true</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 6;
      let y = 3;
      let z = (x < 10 && y > 1);
      document.getElementById("demo").innerText = "x < 10 -> " + String(x < 10) + "\n" + "y > 1 -> " + String(y > 1) + "\n" + "z -> " + String(z);
    </script>
  </body>
</html>
