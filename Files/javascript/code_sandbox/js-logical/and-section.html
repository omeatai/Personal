<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Logical AND — both true with x=6 y=3</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Logical AND — both true with x=6 y=3</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 6;
      let y = 3;
      let z = (x < 10 && y > 1);
      document.getElementById("demo").innerText = "z -> " + String(z);
    </script>
  </body>
</html>
