<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>! NOT — !(x === y) is true</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>! NOT — !(x === y) is true</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 6;
      let y = 3;
      let z = !(x === y);
      document.getElementById("demo").innerText = "x === y -> " + String(x === y) + "\n" + "z -> " + String(z);
    </script>
  </body>
</html>
