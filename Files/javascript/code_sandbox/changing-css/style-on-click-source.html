<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Change style when a button is clicked source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>&lt;h1 id=&quot;id1&quot;&gt;My Heading 1&lt;/h1&gt;
&lt;button type=&quot;button&quot; onclick=&quot;document.getElementById(&#x27;id1&#x27;).style.color=&#x27;red&#x27;; document.getElementById(&#x27;id1&#x27;).style.fontSize=&#x27;40px&#x27;;&quot;&gt;
  Click Me!
&lt;/button&gt;</pre>
  </body>
</html>
