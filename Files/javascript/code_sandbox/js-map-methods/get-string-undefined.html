<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>get(&quot;apples&quot;) when the key is an object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>get(&quot;apples&quot;) when the key is an object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const apples = {name: "Apples"};
      const fruits = new Map();
      fruits.set(apples, 500);
      fruits.get("apples");
      document.getElementById("demo").innerText = "fruits.get(\"apples\") -> " + String(fruits.get("apples")) + "\n" + "fruits.get(apples) -> " + String(fruits.get(apples));
    </script>
  </body>
</html>
