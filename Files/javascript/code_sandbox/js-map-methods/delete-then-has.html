<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>delete() then has()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>delete() then has()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Map([
        ["apples", 500],
        ["bananas", 300],
        ["oranges", 200]
      ]);
      fruits.delete("apples");
      fruits.has("apples");
      document.getElementById("demo").innerText = "fruits.has(\"apples\") -> " + String(fruits.has("apples")) + "\n" + "fruits.size -> " + String(fruits.size);
    </script>
  </body>
</html>
