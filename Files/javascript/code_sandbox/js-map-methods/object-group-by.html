<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object.groupBy() vs Map.groupBy()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object.groupBy() vs Map.groupBy()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = [
        {name:"apples", quantity:300},
        {name:"bananas", quantity:500},
        {name:"oranges", quantity:200},
        {name:"kiwi", quantity:150}
      ];
      function myCallback({ quantity }) {
        return quantity > 200 ? "ok" : "low";
      }
      const obj = Object.groupBy(fruits, myCallback);
      const map = Map.groupBy(fruits, myCallback);
      document.getElementById("demo").innerText = "JSON.stringify(obj) -> " + String(JSON.stringify(obj)) + "\n" + "obj instanceof Map -> " + String(obj instanceof Map) + "\n" + "map instanceof Map -> " + String(map instanceof Map);
    </script>
  </body>
</html>
