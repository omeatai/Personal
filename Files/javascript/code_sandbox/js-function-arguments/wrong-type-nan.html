<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>toCelsius(&quot;John&quot;) → NaN</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>toCelsius(&quot;John&quot;) → NaN</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function toCelsius(fahrenheit) {
        return (5 / 9) * (fahrenheit - 32);
      }
      let value = toCelsius("John");
      document.getElementById("demo").innerText = "value -> " + String(value);
    </script>
  </body>
</html>
