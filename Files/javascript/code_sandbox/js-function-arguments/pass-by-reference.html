<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object passed by reference (property changes outside)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object passed by reference (property changes outside)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function changeName(obj) {
        obj.name = "Jane";
      }
      let person = {name: "John"};
      changeName(person);
      document.getElementById("demo").innerText = "person.name -> " + String(person.name);
    </script>
  </body>
</html>
