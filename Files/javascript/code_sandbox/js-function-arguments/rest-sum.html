<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Rest parameter ...args sum</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Rest parameter ...args sum</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function sum(...args) {
        let total = 0;
        for (let arg of args) total += arg;
        return total;
      }
      let x = sum(4, 9, 16, 25, 29, 100, 66, 77);
      document.getElementById("demo").innerText = "x -> " + String(x);
    </script>
  </body>
</html>
