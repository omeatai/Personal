<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>subtract: order matters</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>subtract: order matters</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function subtract(a, b) {
        return a - b;
      }
      let x1 = subtract(10, 5);
      let x2 = subtract(5, 10);
      document.getElementById("demo").innerText = "subtract(10, 5) -> " + String(x1) + "\n" + "subtract(5, 10) -> " + String(x2);
    </script>
  </body>
</html>
