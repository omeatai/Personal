<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Pass-by-value (number not changed outside)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Pass-by-value (number not changed outside)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function addOne(n) {
        n = n + 1;
        return n;
      }
      let x = 10;
      let y = addOne(x);
      document.getElementById("demo").innerText = "x (outside) -> " + String(x) + "\n" + "y (returned) -> " + String(y);
    </script>
  </body>
</html>
