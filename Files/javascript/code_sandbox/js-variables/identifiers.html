<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Variables - Identifiers</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Identifiers: underscore and dollar sign</h2>
    <pre id="demo"></pre>
    <script>
      let _lastName = "Johnson";
      let _x = 2;
      let _100 = 5;
      let $ = "Hello World";
      let $$$ = 2;
      let $myMoney = 5;
      document.getElementById("demo").innerText =
        "_lastName = " + _lastName + "\n" +
        "_x = " + _x + ", _100 = " + _100 + "\n" +
        "$ = " + $ + "\n" +
        "$$$ = " + $$$ + ", $myMoney = " + $myMoney;
    </script>
  </body>
</html>
