<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`toString()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`toString()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      (255).toString();
      (255).toString(16);
      document.getElementById("demo").innerText = "toString() -> " + String((255).toString()) + "\n" + "toString(16) -> " + String((255).toString(16));
    </script>
  </body>
</html>
