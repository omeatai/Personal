<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`isNaN()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`isNaN()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number.isNaN(123);
      Number.isNaN(NaN);
      document.getElementById("demo").innerText = "Number.isNaN(123) -> " + String(Number.isNaN(123)) + "\n" + "Number.isNaN(NaN) -> " + String(Number.isNaN(NaN));
    </script>
  </body>
</html>
