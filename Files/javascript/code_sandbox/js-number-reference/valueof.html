<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`valueOf()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>`valueOf()`</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = new Number(123);
      x.valueOf();
      document.getElementById("demo").innerText = "valueOf -> " + String(x.valueOf()) + "\n" + "typeof -> " + String(typeof x.valueOf());
    </script>
  </body>
</html>
