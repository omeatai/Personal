<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Exponential notation — 123e5 and 123e-5</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Exponential notation — 123e5 and 123e-5</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let y = 123e5;
      let z = 123e-5;
      document.getElementById("demo").innerText = "y -> " + String(y) + "\n" + "z -> " + String(z);
    </script>
  </body>
</html>
