<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Empty string &quot;&quot; is not undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Empty string &quot;&quot; is not undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let car = "";
      document.getElementById("demo").innerText = "car -> " + String(JSON.stringify(car)) + "\n" + "typeof car -> " + String(typeof car);
    </script>
  </body>
</html>
