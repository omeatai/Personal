<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Boolean from == comparison</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Boolean from == comparison</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 5;
      let y = 5;
      let z = 6;
      document.getElementById("demo").innerText = "x == y -> " + String(x == y) + "\n" + "x == z -> " + String(x == z);
    </script>
  </body>
</html>
