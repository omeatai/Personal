<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>typeof strings — &quot;&quot;, &quot;John&quot;, &quot;John Doe&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>typeof strings — &quot;&quot;, &quot;John&quot;, &quot;John Doe&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      typeof "";
      typeof "John";
      typeof "John Doe";
      document.getElementById("demo").innerText = "typeof \"\" -> " + String(typeof "") + "\n" + "typeof \"John\" -> " + String(typeof "John") + "\n" + "typeof \"John Doe\" -> " + String(typeof "John Doe");
    </script>
  </body>
</html>
