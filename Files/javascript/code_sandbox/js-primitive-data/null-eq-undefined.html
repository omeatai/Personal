<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>null === vs == undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>null === vs == undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      null === null;
      null === undefined;
      null == undefined;
      document.getElementById("demo").innerText = "null === null -> " + String(null === null) + "\n" + "null === undefined -> " + String(null === undefined) + "\n" + "null == undefined -> " + String(null == undefined);
    </script>
  </body>
</html>
