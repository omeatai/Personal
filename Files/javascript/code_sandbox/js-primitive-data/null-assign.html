<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let carName = null</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let carName = null</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let carName = null;
      document.getElementById("demo").innerText = "carName -> " + String(carName) + "\n" + "typeof carName -> " + String(typeof carName);
    </script>
  </body>
</html>
