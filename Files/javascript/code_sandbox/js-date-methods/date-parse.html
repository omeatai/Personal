<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>parse() — Date.parse()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>parse() — Date.parse()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let msec = Date.parse("2021-03-25T15:30:45.123Z");
      document.getElementById("demo").innerText = "msec -> " + String(msec);
    </script>
  </body>
</html>
