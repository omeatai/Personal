<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>UTC() — Date.UTC static</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>UTC() — Date.UTC static</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let ms = Date.UTC(2021, 2, 25, 15, 30, 45, 123);
      const d = new Date(ms);
      document.getElementById("demo").innerText = "ms -> " + String(ms) + "\n" + "d.toISOString() -> " + String(d.toISOString());
    </script>
  </body>
</html>
