<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>constructor — function that created Date.prototype</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>constructor — function that created Date.prototype</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      d.constructor;
      d.constructor === Date;
      document.getElementById("demo").innerText = "String(d.constructor) -> " + String(String(d.constructor)) + "\n" + "d.constructor === Date -> " + String(d.constructor === Date);
    </script>
  </body>
</html>
