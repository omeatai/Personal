<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>setYear(99) — deprecated; use setFullYear()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>setYear(99) — deprecated; use setFullYear()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      d.setYear(99);
      document.getElementById("demo").innerText = "d -> " + String(String(d)) + "\n" + "d.getFullYear() -> " + String(d.getFullYear()) + "\n" + "d.toISOString() -> " + String(d.toISOString());
    </script>
  </body>
</html>
