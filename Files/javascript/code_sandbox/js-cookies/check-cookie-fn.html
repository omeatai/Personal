<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>checkCookie() — welcome or prompt</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>

      function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
        let expires = "expires=" + d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
      }
      function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == " ") {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return "";
      }
      function clearNameCookie() {
        document.cookie = "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      }

      clearNameCookie();
      window.alert = function (m) { document.getElementById("demo").innerText = m; };
      window.prompt = function () { return "Sam"; };
      function checkCookie() {
        let username = getCookie("username");
        if (username != "") {
          alert("Welcome again " + username);
        } else {
          username = prompt("Please enter your name:", "");
          if (username != "" && username != null) {
            setCookie("username", username, 365);
          }
        }
      }
      checkCookie();
      document.getElementById("demo").innerText =
        "after first visit username=" + getCookie("username");
      checkCookie();
    </script>
  </body>
</html>
