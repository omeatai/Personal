<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Spread join two arrays</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Spread join two arrays</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const arr1 = [1, 2, 3];
      const arr2 = [4, 5, 6];
      const arr3 = [...arr1, ...arr2];
      document.getElementById("demo").innerText = "arr3 -> " + String(JSON.stringify(arr3));
    </script>
  </body>
</html>
