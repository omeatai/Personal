<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>forEach with value, index, array</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>forEach with value, index, array</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers = [45, 4, 9, 16, 25];
      let txt = "";
      numbers.forEach(myFunction);
      function myFunction(value, index, array) {
        txt += value + " ";
      }
      document.getElementById("demo").innerText = "txt -> " + String(txt);
    </script>
  </body>
</html>
