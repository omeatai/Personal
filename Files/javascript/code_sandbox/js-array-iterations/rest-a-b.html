<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>[a, b, ...rest] = arr1</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>[a, b, ...rest] = arr1</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let a, b, rest;
      const arr1 = [1,2,3,4,5,6,7,8];
      [a, b, ...rest] = arr1;
      document.getElementById("demo").innerText = "a -> " + String(a) + "\n" + "b -> " + String(b) + "\n" + "rest -> " + String(JSON.stringify(rest));
    </script>
  </body>
</html>
