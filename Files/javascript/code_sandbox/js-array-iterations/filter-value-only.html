<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>filter values &gt; 18 (value only)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>filter values &gt; 18 (value only)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers = [45, 4, 9, 16, 25];
      const over18 = numbers.filter(myFunction);
      function myFunction(value) {
        return value > 18;
      }
      document.getElementById("demo").innerText = "over18 -> " + String(JSON.stringify(over18));
    </script>
  </body>
</html>
