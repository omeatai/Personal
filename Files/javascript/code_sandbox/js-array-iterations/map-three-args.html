<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>map value * 2 (three-arg callback)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>map value * 2 (three-arg callback)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers1 = [45, 4, 9, 16, 25];
      const numbers2 = numbers1.map(myFunction);
      function myFunction(value, index, array) {
        return value * 2;
      }
      document.getElementById("demo").innerText = "numbers2 -> " + String(JSON.stringify(numbers2)) + "\n" + "numbers1 -> " + String(JSON.stringify(numbers1));
    </script>
  </body>
</html>
