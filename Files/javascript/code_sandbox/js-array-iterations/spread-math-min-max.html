<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math.min / Math.max with spread</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math.min / Math.max with spread</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const numbers = [23, 55, 21, 87, 56];
      let minValue = Math.min(...numbers);
      let maxValue = Math.max(...numbers);
      document.getElementById("demo").innerText = "minValue -> " + String(minValue) + "\n" + "maxValue -> " + String(maxValue);
    </script>
  </body>
</html>
