<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array.from(array, x =&gt; x * 2)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array.from(array, x =&gt; x * 2)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myNumbers = [1,2,3,4];
      const myArr = Array.from(myNumbers, (x) => x * 2);
      document.getElementById("demo").innerText = "myArr -> " + String(JSON.stringify(myArr));
    </script>
  </body>
</html>
