<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>months.with(2, &quot;March&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>months.with(2, &quot;March&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const months = ["Januar", "Februar", "Mar", "April"];
      const myMonths = months.with(2, "March");
      document.getElementById("demo").innerText = "myMonths -> " + String(JSON.stringify(myMonths)) + "\n" + "months -> " + String(JSON.stringify(months));
    </script>
  </body>
</html>
