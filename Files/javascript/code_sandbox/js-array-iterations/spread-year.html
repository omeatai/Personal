<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Spread four quarter arrays</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Spread four quarter arrays</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const q1 = ["Jan", "Feb", "Mar"];
      const q2 = ["Apr", "May", "Jun"];
      const q3 = ["Jul", "Aug", "Sep"];
      const q4 = ["Oct", "Nov", "Des"];
      const year = [...q1, ...q2, ...q3, ...q4];
      document.getElementById("demo").innerText = "year -> " + String(JSON.stringify(year));
    </script>
  </body>
</html>
