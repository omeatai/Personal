<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for...of over car values</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for...of over car values</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = ["BMW", "Volvo", "Mini"];
      let text = "";
      for (let x of cars) {
        text += x + ",";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
