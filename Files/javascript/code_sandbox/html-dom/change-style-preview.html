<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>What you will learn — change CSS from JavaScript</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p id="p2">Hello World!</p>
    <pre id="demo"></pre>
    <script>
      const p = document.getElementById("p2");
      p.style.color = "blue";
      document.getElementById("demo").innerText = "color=" + p.style.color;
    </script>
  </body>
</html>
