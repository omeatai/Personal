<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>What you will learn — change element content</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p id="msg">Waiting…</p>
    <pre id="demo"></pre>
    <script>
      document.getElementById("msg").textContent = "Content updated with the DOM.";
      document.getElementById("demo").innerText = document.getElementById("msg").textContent;
    </script>
  </body>
</html>
