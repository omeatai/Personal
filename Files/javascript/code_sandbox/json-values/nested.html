<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Nested object + array</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const p = JSON.parse('{"name":"John","age":30,"address":{"city":"New York","country":"USA"},"hobbies":["Reading","Cycling","Photography"]}');
      document.getElementById("demo").innerText =
        p.address.city + " / " + p.hobbies[1];
    </script>
  </body>
</html>
