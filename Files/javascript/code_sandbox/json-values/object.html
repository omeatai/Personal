<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON object values</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const o = JSON.parse('{"name":"John","age":30,"city":"New York"}');
      document.getElementById("demo").innerText = o.city;
    </script>
  </body>
</html>
