<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Missing object property is undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Missing object property is undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {firstName:"John", lastName:"Doe"};
      document.getElementById("demo").innerText = "person.age -> " + String(person.age) + "\n" + "typeof person.age -> " + String(typeof person.age);
    </script>
  </body>
</html>
