<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>undefined == null is true; === is false</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>undefined == null is true; === is false</h2>
    
    <pre id="demo"></pre>
    
    <script>
      undefined == null;
      undefined === null;
      document.getElementById("demo").innerText = "undefined == null -> " + String(undefined == null) + "\n" + "undefined === null -> " + String(undefined === null);
    </script>
  </body>
</html>
