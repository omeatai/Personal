<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Function without return yields undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Function without return yields undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction() {
        let x = 5;
      }
      document.getElementById("demo").innerText = "myFunction() -> " + String(myFunction()) + "\n" + "typeof myFunction() -> " + String(typeof myFunction());
    </script>
  </body>
</html>
