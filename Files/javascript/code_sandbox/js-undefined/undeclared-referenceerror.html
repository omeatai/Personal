<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Reading an undeclared name is ReferenceError</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Reading an undeclared name is ReferenceError</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let r0;
      try {
        r0 = missing;
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = typeof missing;
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "missing -> " + String(r0) + "\n" + "typeof missing -> " + String(r1);
    </script>
  </body>
</html>
