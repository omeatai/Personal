<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Omit exp1 (`i = 2` before the loop)</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Omit exp1 (`i = 2` before the loop)</h2>
    <pre id="demo"></pre>
    <script>
      const cars = ["BMW", "Volvo", "Saab", "Ford"];
      let len = cars.length;
      let i = 2;
      let text = "";
      for (; i < len; i++) {
        text += cars[i] + " ";
      }
      document.getElementById("demo").innerText =
        "start i -> 2\n" +
        "text -> " + text.trim();
    </script>
  </body>
</html>
