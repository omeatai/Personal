<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>\B — not a word boundary</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>\B — not a word boundary</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let text = "JavaScript";
      let result = text.match(/\BScript/);
      let edge = text.match(/\bScript/);
      document.getElementById("demo").innerText = "result -> " + String(JSON.stringify(result)) + "\n" + "edge -> " + String(JSON.stringify(edge));
    </script>
  </body>
</html>
