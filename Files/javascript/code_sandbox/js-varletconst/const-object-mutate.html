<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>const object: mutate property vs reassign</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>const object: mutate property vs reassign</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const user = { name: "Alice" };
      user.name = "Bob";
      let afterMutate = user.name;
      let afterReplace;
      try {
        user = { name: "Charlie" };
        afterReplace = user.name;
      } catch (e) {
        afterReplace = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "user.name after mutate -> " + afterMutate + "\n" +
        "user = { name: \"Charlie\" } -> " + afterReplace;
    </script>
  </body>
</html>
