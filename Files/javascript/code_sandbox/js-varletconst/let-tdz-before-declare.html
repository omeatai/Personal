<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>let TDZ — ReferenceError before declare</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>let TDZ — ReferenceError before declare</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let early;
      try {
        x = x + 1;
      } catch (e) {
        early = e.name + ": " + e.message;
      }
      let x = 5;
      document.getElementById("demo").innerText =
        "before let x -> " + early + "\n" +
        "after let x -> " + x;
    </script>
  </body>
</html>
