<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>const cannot reassign — TypeError</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>const cannot reassign — TypeError</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const PI = 3.14;
      let msg;
      try {
        PI = 3.14159;
        msg = "PI -> " + PI;
      } catch (e) {
        msg = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "PI -> " + PI + "\n" +
        "PI = 3.14159 -> " + msg;
    </script>
  </body>
</html>
