<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>var used before declare is undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>var used before declare is undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let shown = x;
      var x = 5;
      document.getElementById("demo").innerText = "shown -> " + String(shown) + "\n" + "x after -> " + String(x);
    </script>
  </body>
</html>
