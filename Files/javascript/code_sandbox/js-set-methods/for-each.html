<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>forEach() for each value</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>forEach() for each value</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      let text = "";
      letters.forEach(function (value) {
        text += value;
      });
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
