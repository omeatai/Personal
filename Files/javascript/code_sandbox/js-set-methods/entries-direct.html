<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for...of letters.entries()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for...of letters.entries()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      let text = "";
      for (const entry of letters.entries()) {
        text += entry;
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
