<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>delete(&quot;b&quot;) — listed, no Tryit</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>delete(&quot;b&quot;) — listed, no Tryit</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      const removed = letters.delete("b");
      const missing = letters.delete("z");
      document.getElementById("demo").innerText = "removed -> " + String(removed) + "\n" + "missing -> " + String(missing) + "\n" + "Array.from(letters) -> " + String(JSON.stringify(Array.from(letters))) + "\n" + "letters.size -> " + String(letters.size);
    </script>
  </body>
</html>
