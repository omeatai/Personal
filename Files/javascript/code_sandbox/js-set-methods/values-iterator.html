<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>values() iterator variable</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>values() iterator variable</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const letters = new Set(["a","b","c"]);
      const myIterator = letters.values();
      let text = "";
      for (const entry of myIterator) {
        text += entry;
      }
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "Array.from(letters.values()) -> " + String(JSON.stringify(Array.from(letters.values())));
    </script>
  </body>
</html>
