<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>createTextNode()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p id='t'>Hello <b>World</b></p><p id='u'>Next</p>
    <pre id="demo"></pre>
    <script>
      const t = document.createTextNode("plain");
      document.getElementById("t").appendChild(t);
      document.getElementById("demo").innerText = t.nodeName + " " + JSON.stringify(t.nodeValue);
    </script>
  </body>
</html>
