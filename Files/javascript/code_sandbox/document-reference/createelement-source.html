<!doctype html>
<html>
  <head>

      body { background: #f1f1f1; }
      pre {
        margin: 0;

  <body>
    <h3>Example</h3>
    <pre>const el = document.createElement(&quot;em&quot;);
      el.textContent = &quot;new&quot;;
      document.getElementById(&quot;t&quot;).appendChild(el);
      document.getElementById(&quot;demo&quot;).innerText = el.tagName + &quot; &quot; + el.textContent;</pre>
  </body>
