<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>doctype</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }

  <body>
    <p id='t'>Hello <b>World</b></p><p id='u'>Next</p>
