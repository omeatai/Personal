<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>EvalError — deprecated name; use SyntaxError</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>EvalError — deprecated name; use SyntaxError</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const e = new EvalError("legacy");
      let evalMsg;
      try {
        eval("alert('Hello)");
        evalMsg = "eval ran";
      } catch (err) {
        evalMsg = err.name + ": " + err.message;
      }
      document.getElementById("demo").innerText =
        "EvalError name -> " + e.name + "\n" +
        "EvalError message -> " + e.message + "\n" +
        "eval broken string -> " + evalMsg;
    </script>
  </body>
</html>
