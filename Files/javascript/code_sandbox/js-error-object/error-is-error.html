<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Error.isError(x) — true only for real Error objects</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Error.isError(x) — true only for real Error objects</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const real = new Error("x");
      const fake = { name: "Error", message: "x" };
      document.getElementById("demo").innerText = "typeof Error.isError -> " + String(typeof Error.isError) + "\n" + "Error.isError(new Error(\"x\")) -> " + String(Error.isError(real)) + "\n" + "Error.isError(plain object) -> " + String(Error.isError(fake)) + "\n" + "Error.isError(null) -> " + String(Error.isError(null));
    </script>
  </body>
</html>
