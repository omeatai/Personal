<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Dot notation: person.firstName</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Dot notation: person.firstName</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {firstName:"John", lastName:"Doe", age:50, eyeColor:"blue"};
      let name = person.firstName;
      document.getElementById("demo").innerText = "name -> " + String(name);
    </script>
  </body>
</html>
