<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Example 4: new Object({...})</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Example 4: new Object({...})</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = new Object({
        firstName: "John",
        lastName: "Doe",
        age: 50,
        eyeColor: "blue"
      });
      document.getElementById("demo").innerText = "person.firstName -> " + String(person.firstName) + "\n" + "person instanceof Object -> " + String(person instanceof Object);
    </script>
  </body>
</html>
