<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Example 3: empty object then add properties</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Example 3: empty object then add properties</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {};
      person.firstName = "John";
      person.lastName = "Doe";
      person.age = 50;
      person.eyeColor = "blue";
      document.getElementById("demo").innerText = "person.firstName -> " + String(person.firstName) + "\n" + "person.lastName -> " + String(person.lastName) + "\n" + "person.age -> " + String(person.age) + "\n" + "person.eyeColor -> " + String(person.eyeColor);
    </script>
  </body>
</html>
