<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>const car = { type, model, color }</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>const car = { type, model, color }</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const car = { type: "Fiat", model: "500", color: "white" };
      document.getElementById("demo").innerText = "car.type -> " + String(car.type) + "\n" + "car.model -> " + String(car.model) + "\n" + "car.color -> " + String(car.color);
    </script>
  </body>
</html>
