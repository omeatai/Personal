<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Adding events</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <button type="button" id="btn">Click</button><p id="out"></p>
    <pre id="demo"></pre>
    <script>
      const btn = document.getElementById("btn");
      function myFunction() { document.getElementById("out").innerHTML = "Clicked!"; }
      btn.addEventListener("click", myFunction);
      btn.click();
      document.getElementById("demo").innerText = document.getElementById("out").innerHTML;
    </script>
  </body>
</html>
