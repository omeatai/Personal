<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>getMinutes() on &quot;2021-03-25&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>getMinutes() on &quot;2021-03-25&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25");
      d.getMinutes();
      document.getElementById("demo").innerText = "d.getMinutes() -> " + String(d.getMinutes());
    </script>
  </body>
</html>
