<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>months[d.getMonth()] on now</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>months[d.getMonth()] on now</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const d = new Date();
      let month = months[d.getMonth()];
      document.getElementById("demo").innerText = "month -> " + String(month) + "\n" + "d.getMonth() -> " + String(d.getMonth());
    </script>
  </body>
</html>
