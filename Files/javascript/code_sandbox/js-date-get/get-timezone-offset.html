<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>getTimezoneOffset()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>getTimezoneOffset()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date();
      let diff = d.getTimezoneOffset();
      document.getElementById("demo").innerText = "diff -> " + String(diff) + "\n" + "d -> " + String(String(d));
    </script>
  </body>
</html>
