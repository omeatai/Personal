<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>getUTCMonth()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>getUTCMonth()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25");
      d.getUTCMonth();
      document.getElementById("demo").innerText = "d.getUTCMonth() -> " + String(d.getUTCMonth()) + "\n" + "d.toISOString() -> " + String(d.toISOString());
    </script>
  </body>
</html>
