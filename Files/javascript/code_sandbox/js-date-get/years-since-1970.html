<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Years since 1970 (page formula)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Years since 1970 (page formula)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const minute = 1000 * 60;
      const hour = minute * 60;
      const day = hour * 24;
      const year = day * 365;
      let years = Math.round(Date.now() / year);
      document.getElementById("demo").innerText = "years -> " + String(years) + "\n" + "year (ms) -> " + String(year);
    </script>
  </body>
</html>
