<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>getTime() on &quot;1970-01-01&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>getTime() on &quot;1970-01-01&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("1970-01-01");
      d.getTime();
      document.getElementById("demo").innerText = "d.getTime() -> " + String(d.getTime()) + "\n" + "d -> " + String(String(d)) + "\n" + "d.toISOString() -> " + String(d.toISOString());
    </script>
  </body>
</html>
