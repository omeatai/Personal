<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>&quot;use strict&quot; function: this is undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>&quot;use strict&quot; function: this is undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function strictThis() {
        "use strict";
        return this;
      }
      let x = strictThis();
      document.getElementById("demo").innerText =
        "strict this -> " + String(x) + "\n" +
        "typeof this -> " + typeof x;
    </script>
  </body>
</html>
