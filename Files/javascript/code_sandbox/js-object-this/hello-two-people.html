<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>person1.hello() vs person2.hello()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>person1.hello() vs person2.hello()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person1 = {
        name: "John",
        hello: function () {
          return "Hello " + this.name;
        }
      };
      const person2 = {
        name: "Anna",
        hello: function () {
          return "Hello " + this.name;
        }
      };
      document.getElementById("demo").innerText = "person1.hello() -> " + String(person1.hello()) + "\n" + "person2.hello() -> " + String(person2.hello());
    </script>
  </body>
</html>
