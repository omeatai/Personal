<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>this in a regular function (non-strict)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>this in a regular function (non-strict)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction() {
        return this;
      }
      let x = myFunction();
      document.getElementById("demo").innerText =
        "String(this) -> " + String(x) + "\n" +
        "this === window -> " + (x === window);
    </script>
  </body>
</html>
