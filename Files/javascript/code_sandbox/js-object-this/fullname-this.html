<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>fullName with this</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>fullName with this</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {
        firstName: "John",
        lastName: "Doe",
        age: 50,
        fullName: function () {
          return this.firstName + " " + this.lastName;
        }
      };
      document.getElementById("demo").innerText = "person.fullName() -> " + String(person.fullName());
    </script>
  </body>
</html>
