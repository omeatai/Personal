  <body>
    <h3>Example</h3>
    <pre>let time = 8;
let greeting;
if (time &lt; 10) {
  greeting = &quot;Good morning&quot;;
} else if (time &lt; 20) {
  greeting = &quot;Good day&quot;;
} else {
  greeting = &quot;Good evening&quot;;
}</pre>
