<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>else — hour 10 is Good day</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>else — hour 10 is Good day</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let hour = 10;
      let greeting;
      if (hour < 18) {
        greeting = "Good day";
      } else {
        greeting = "Good evening";
      }
      document.getElementById("demo").innerText = "hour -> " + String(hour) + "\n" + "hour < 18 -> " + String(hour < 18) + "\n" + "greeting -> " + String(greeting);
    </script>
  </body>
</html>
