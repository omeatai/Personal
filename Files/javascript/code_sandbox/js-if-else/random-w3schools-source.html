<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Random link — Math.random() 0.2 visits W3Schools source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>let n = 0.2; // pinned stand-in for Math.random()
let text;
if (n &lt; 0.5) {
  text = &#x27;&lt;a href=&quot;https://www.w3schools.com&quot;&gt;Visit W3Schools&lt;/a&gt;&#x27;;
} else {
  text = &#x27;&lt;a href=&quot;https://www.wwf.org&quot;&gt;Visit WWF&lt;/a&gt;&#x27;;
}</pre>
  </body>
</html>
