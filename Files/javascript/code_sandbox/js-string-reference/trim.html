<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`trim()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`trim()`</h2>
    <pre id="demo"></pre>
    <script>
      let original = " Hello ";
      let trimmed = original.trim();
      document.getElementById("demo").innerText =
        "original -> '" + original + "'\n" +
        "trim()   -> '" + trimmed + "'";
    </script>
  </body>
</html>
