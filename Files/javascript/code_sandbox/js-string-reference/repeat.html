<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`repeat()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`repeat()`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "Ha";
      document.getElementById("demo").innerText =
        "repeat(2) -> " + text.repeat(2) + "\n" +
        "repeat(4) -> " + text.repeat(4);
    </script>
  </body>
</html>
