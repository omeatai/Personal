<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`endsWith()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`endsWith()`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "John Doe";
      document.getElementById("demo").innerText =
        'endsWith("Doe")  -> ' + text.endsWith("Doe") + "\n" +
        'endsWith("John") -> ' + text.endsWith("John");
    </script>
  </body>
</html>
