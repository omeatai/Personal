<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`prototype`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`prototype`</h2>
    <pre id="demo"></pre>
    <script>
      String.prototype.exclaim = function () {
        return String(this) + "!";
      };
      document.getElementById("demo").innerText = '"Hi".exclaim() -> ' + "Hi".exclaim();
    </script>
  </body>
</html>
