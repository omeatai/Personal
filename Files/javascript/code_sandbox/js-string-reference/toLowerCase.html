<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`toLowerCase()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`toLowerCase()`</h2>
    <pre id="demo"></pre>
    <script>
      let text1 = "Hello World!";
      document.getElementById("demo").innerText =
        "original     -> " + text1 + "\n" +
        "toLowerCase  -> " + text1.toLowerCase();
    </script>
  </body>
</html>
