<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`padStart()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`padStart()`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "5";
      document.getElementById("demo").innerText =
        'padStart(4, "0") -> ' + text.padStart(4, "0") + "\n" +
        'padStart(4, "x") -> ' + text.padStart(4, "x");
    </script>
  </body>
</html>
