<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`trimEnd()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`trimEnd()`</h2>
    <pre id="demo"></pre>
    <script>
      let text1 = " Hello World! ";
      document.getElementById("demo").innerText =
        "original -> '" + text1 + "'\n" +
        "trimEnd  -> '" + text1.trimEnd() + "'";
    </script>
  </body>
</html>
