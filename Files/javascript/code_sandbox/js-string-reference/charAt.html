<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`charAt()`</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`charAt()`</h2>
    <pre id="demo"></pre>
    <script>
      let text = "HELLO WORLD";
      document.getElementById("demo").innerText =
        'charAt(0)  -> ' + text.charAt(0) + "\n" +
        'charAt(99) -> "' + text.charAt(99) + '" (empty string)';
    </script>
  </body>
</html>
