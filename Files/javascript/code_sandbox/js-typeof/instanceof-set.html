<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>fruits instanceof Set</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>fruits instanceof Set</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = new Set(["apples", "bananas", "oranges"]);
      (fruits instanceof Set);
      document.getElementById("demo").innerText = "fruits instanceof Set -> " + String(fruits instanceof Set);
    </script>
  </body>
</html>
