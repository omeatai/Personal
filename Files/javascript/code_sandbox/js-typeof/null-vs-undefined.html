<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>undefined vs null — type and == / ===</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>undefined vs null — type and == / ===</h2>
    
    <pre id="demo"></pre>
    
    <script>
      typeof undefined;
      typeof null;
      null === undefined;
      null == undefined;
      document.getElementById("demo").innerText = "typeof undefined -> " + String(typeof undefined) + "\n" + "typeof null -> " + String(typeof null) + "\n" + "null === undefined -> " + String(null === undefined) + "\n" + "null == undefined -> " + String(null == undefined);
    </script>
  </body>
</html>
