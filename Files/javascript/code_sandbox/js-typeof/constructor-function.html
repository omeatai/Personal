<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>function () {}.constructor</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>function () {}.constructor</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let c = function () {}.constructor;
      document.getElementById("demo").innerText = "String(c) -> " + String(String(c)) + "\n" + "c === Function -> " + String(c === Function);
    </script>
  </body>
</html>
