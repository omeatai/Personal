<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>person = null — value null, typeof object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>person = null — value null, typeof object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let person = {firstName:"John", lastName:"Doe", age:50, eyeColor:"blue"};
      person = null;
      document.getElementById("demo").innerText = "person -> " + String(person) + "\n" + "typeof person -> " + String(typeof person);
    </script>
  </body>
</html>
