<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>car = undefined after &quot;Volvo&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>car = undefined after &quot;Volvo&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let car = "Volvo";
      car = undefined;
      document.getElementById("demo").innerText = "car -> " + String(car) + "\n" + "typeof car -> " + String(typeof car);
    </script>
  </body>
</html>
