<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>typeof new Date()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>typeof new Date()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      typeof new Date();
      document.getElementById("demo").innerText = "typeof new Date() -> " + String(typeof new Date());
    </script>
  </body>
</html>
