<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Write a read-only defineProperty (writable: false)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Write a read-only defineProperty (writable: false)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      "use strict";
      const obj = {};
      Object.defineProperty(obj, "x", {value: 0, writable: false});
      let msg;
      try {
        obj.x = 3.14;
        msg = "obj.x -> " + obj.x;
      } catch (e) {
        msg = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "obj.x stays -> " + obj.x + "\n" +
        "obj.x = 3.14 -> " + msg;
    </script>
  </body>
</html>
