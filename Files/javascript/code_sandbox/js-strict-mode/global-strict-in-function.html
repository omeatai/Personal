<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Global strict: undeclared y inside a function</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Global strict: undeclared y inside a function</h2>
    
    <pre id="demo"></pre>
    
    <script>
      "use strict";
      function myFunction() {
        y = 3.14;
      }
      let msg;
      try {
        myFunction();
        msg = "y -> " + y;
      } catch (e) {
        msg = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = msg;
    </script>
  </body>
</html>
