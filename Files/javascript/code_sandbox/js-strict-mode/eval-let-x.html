<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>eval(&quot;let x=2&quot;) then x — error</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>eval(&quot;let x=2&quot;) then x — error</h2>
    
    <pre id="demo"></pre>
    
    <script>
      eval("let x = 2");
      let readX;
      try {
        readX = x;
      } catch (e) {
        readX = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText =
        "eval(\"let x = 2\") then x -> " + readX;
    </script>
  </body>
</html>
