<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>0 == false is true; 0 === false is false</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>0 == false is true; 0 === false is false</h2>
    
    <pre id="demo"></pre>
    
    <script>
      0 == false;
      0 === false;
      document.getElementById("demo").innerText = "0 == false -> " + String(0 == false) + "\n" + "0 === false -> " + String(0 === false);
    </script>
  </body>
</html>
