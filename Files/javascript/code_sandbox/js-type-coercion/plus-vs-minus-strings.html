<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>(&#x27;5&#x27; + &#x27;2&#x27;) vs (&#x27;5&#x27; - &#x27;2&#x27;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>(&#x27;5&#x27; + &#x27;2&#x27;) vs (&#x27;5&#x27; - &#x27;2&#x27;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let result1 = ('5' + '2');
      let result2 = ('5' - '2');
      document.getElementById("demo").innerText = "result1 -> " + String(result1) + "\n" + "typeof result1 -> " + String(typeof result1) + "\n" + "result2 -> " + String(result2) + "\n" + "typeof result2 -> " + String(typeof result2);
    </script>
  </body>
</html>
