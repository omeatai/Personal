<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>&quot;&quot; == 0 is true</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>&quot;&quot; == 0 is true</h2>
    
    <pre id="demo"></pre>
    
    <script>
      "" == 0;
      document.getElementById("demo").innerText = "\"\" == 0 -> " + String("" == 0) + "\n" + "\"\" === 0 -> " + String("" === 0);
    </script>
  </body>
</html>
