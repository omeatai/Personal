<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JS Assignment - +=</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>The += Operator</h2>
    <pre id="demo"></pre>
    <script>
      let x = 10;
      x += 5;
      document.getElementById("demo").innerText =
        "let x = 10;\n" + "x += 5;     -> x = " + x;
    </script>
  </body>
</html>
