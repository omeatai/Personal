<html>
  <head>

    <title>JS Assignment</title>
    <link rel="stylesheet" href="../sandbox.css" />

  <body>
    <h2>JavaScript Assignment</h2>
    <p id="out"></p>

      let x = 10;
      x += 5;
      let text1 = "What a very ";

    </script>
