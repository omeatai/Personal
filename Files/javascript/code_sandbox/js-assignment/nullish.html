<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JS Assignment - ??=</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>The ??= Operator (ES2020)</h2>
    <pre id="demo"></pre>
    <script>
      let a;
      a ??= 10;
      let b = 0;
      b ??= 10;
      let c = null;
      c ??= 10;
      let d = undefined;
      d ??= 10;
      let x = 10;
      let y = 5;
      x ??= 10;
      document.getElementById("demo").innerText =
        "let a;            a ??= 10  -> " +
        a +
        "\n" +
        "let b = 0;        b ??= 10  -> " +
        b +
        "   (0 is not nullish)\n" +
        "let c = null;     c ??= 10  -> " +
        c +
        "\n" +
        "let d = undefined; d ??= 10 -> " +
        d +
        "\n" +
        "x = 10, y = 5;    x ??= 10  -> " +
        x;
    </script>
  </body>
</html>
