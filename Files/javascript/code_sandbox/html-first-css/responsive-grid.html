<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Responsive layouts with media queries</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
.container { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.container div { background:#ddd; padding:12px; }
@media (max-width:600px) {
  .container { grid-template-columns:1fr; }
}

    </style>
  </head>
  <body>
    <div class="container" id="c"><div>A</div><div>B</div><div>C</div></div>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText =
        "grid-template-columns=" + getComputedStyle(document.getElementById("c")).gridTemplateColumns;
    </script>
  </body>
</html>
