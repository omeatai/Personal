<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>When CSS is enough vs when you need JavaScript</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p>CSS is often the second step after HTML.</p>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText = [
        "CSS: colors, sizes, spacing, layout, motion, simple visibility",
        "JS: logic, data processing, storage, talking to a server"
      ].join("\n");
    </script>
  </body>
</html>
