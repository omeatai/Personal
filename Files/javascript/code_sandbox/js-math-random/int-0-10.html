<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math.floor(Math.random() * 11) — [0, 10]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math.floor(Math.random() * 11) — [0, 10]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Math.floor(Math.random() * 11);
      document.getElementById("demo").innerText = "Math.floor(Math.random() * 11) -> " + String(Math.floor(Math.random() * 11)) + "\n" + "in range? -> " + String((function(){ const n = Math.floor(Math.random() * 11); return n >= 0 && n <= 10 && Number.isInteger(n); })());
    </script>
  </body>
</html>
