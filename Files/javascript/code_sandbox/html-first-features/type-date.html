<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Input type — date (Birthday example)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <label>Birthday: <input id="b" type="date" value="2000-01-31"></label>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText = "value=" + document.getElementById("b").value + " type=" + document.getElementById("b").type;
    </script>
  </body>
</html>
