<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>The datalist element</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <label>Choose a browser: <input id="i" list="browsers" name="browser"></label><datalist id="browsers"><option value="Edge"><option value="Firefox"><option value="Chrome"><option value="Opera"><option value="Safari"></datalist>
    <pre id="demo"></pre>
    <script>
      const dl = document.getElementById("browsers");
      document.getElementById("demo").innerText =
        "options=" + dl.options.length + " list=" + document.getElementById("i").getAttribute("list");
    </script>
  </body>
</html>
