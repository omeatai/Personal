<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Lazy loading images</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <img id="i" alt="later" loading="lazy" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText = "loading=" + document.getElementById("i").loading;
    </script>
  </body>
</html>
