<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JS Comparisons - Inequality & relational</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>!=  !==  &gt;  &lt;  &gt;=  &lt;=  (x = 5)</h2>
    <pre id="demo"></pre>
    <script>
      let x = 5;
      document.getElementById("demo").innerText =
        "x != 8      -> " +
        (x != 8) +
        "\n" +
        "x !== 5     -> " +
        (x !== 5) +
        "\n" +
        'x !== "5"   -> ' +
        (x !== "5") +
        "\n" +
        "x !== 8     -> " +
        (x !== 8) +
        "\n" +
        "x > 8       -> " +
        (x > 8) +
        "\n" +
        "x < 8       -> " +
        (x < 8) +
        "\n" +
        "x >= 8      -> " +
        (x >= 8) +
        "\n" +
        "x <= 8      -> " +
        (x <= 8);
    </script>
  </body>
</html>
