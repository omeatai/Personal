<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON objects — firstName / lastName</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const o = JSON.parse('{"firstName":"John","lastName":"Doe"}');
      document.getElementById("demo").innerText = o.firstName + " " + o.lastName;
    </script>
  </body>
</html>
