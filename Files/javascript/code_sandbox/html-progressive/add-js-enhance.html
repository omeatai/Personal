<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Add JavaScript as an enhancement</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <form id="f" action="#"><input name="email" value="a@b.c"><button type="submit">Join</button></form>
    <pre id="demo"></pre>
    <script>
      const form = document.querySelector("form");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        document.getElementById("demo").innerText = "Form submitted!";
      });
      form.requestSubmit();
    </script>
  </body>
</html>
