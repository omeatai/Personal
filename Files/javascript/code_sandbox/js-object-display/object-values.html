<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object.values(person).toString()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object.values(person).toString()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { name: "John", age: 30, city: "New York" };
      const myArray = Object.values(person);
      let text = myArray.toString();
      document.getElementById("demo").innerText = "myArray -> " + String(JSON.stringify(myArray)) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
