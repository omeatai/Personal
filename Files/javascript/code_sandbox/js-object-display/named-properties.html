<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>person.name + age + city</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>person.name + age + city</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { name: "John", age: 30, city: "New York" };
      let text = person.name + "," + person.age + "," + person.city;
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
