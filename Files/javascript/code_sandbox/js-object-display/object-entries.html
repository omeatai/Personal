<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object.entries fruits loop</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object.entries fruits loop</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = { Bananas: 300, Oranges: 200, Apples: 500 };
      let text = "";
      for (let [fruit, value] of Object.entries(fruits)) {
        text += fruit + ": " + value + " ";
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
