<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for..in loop: person[x] (not person.x)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for..in loop: person[x] (not person.x)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { name: "John", age: 30, city: "New York" };
      let text = "";
      for (let x in person) {
        text += person[x] + " ";
      }
      let wrong = "";
      for (let x in person) {
        wrong += person.x + " ";
      }
      document.getElementById("demo").innerText = "person[x] -> " + String(text) + "\n" + "person.x (wrong) -> " + String(wrong);
    </script>
  </body>
</html>
