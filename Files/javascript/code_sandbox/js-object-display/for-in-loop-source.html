<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for..in loop: person[x] (not person.x) source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>const person = { name: &quot;John&quot;, age: 30, city: &quot;New York&quot; };
let text = &quot;&quot;;
for (let x in person) {
  text += person[x] + &quot; &quot;;
}
let wrong = &quot;&quot;;
for (let x in person) {
  wrong += person.x + &quot; &quot;;
}</pre>
  </body>
</html>
