<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`while` i < 10</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`while` i &lt; 10</h2>
    <pre id="demo"></pre>
    <script>
      let i = 0;
      let text = "";
      while (i < 10) {
        text += "The number is " + i + "\n";
        i++;
      }
      document.getElementById("demo").innerText =
        "after, i -> " + i + "\n" +
        "text -> " + text.trim();
    </script>
  </body>
</html>
