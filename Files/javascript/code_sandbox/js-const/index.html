<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Const</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>JavaScript Const</h2>
    <p id="pi"></p>
    <p id="cars"></p>
    <p id="car"></p>
    <p id="block"></p>
    <script>
      const PI = 3.14159265359;
      document.getElementById("pi").innerText = "PI = " + PI;
      const cars = ["Saab", "Volvo", "BMW"];
      cars[0] = "Toyota";
      cars.push("Audi");
      document.getElementById("cars").innerText = "cars = " + cars.join(", ");
      const car = { type: "Fiat", model: "500", color: "white" };
      car.color = "red";
      car.owner = "Johnson";
      document.getElementById("car").innerText =
        car.type + " " + car.model + ", " + car.color + ", owner " + car.owner;
      const x = 10;
      let insideX;
      {
        const x = 2;
        insideX = x;
      }
      document.getElementById("block").innerText =
        "Inside block x = " + insideX + "; outside x = " + x;
    </script>
  </body>
</html>
