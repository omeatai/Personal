<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Const - Constant Objects</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Constant Objects</h2>
    <pre id="demo"></pre>
    <script>
      const car = { type: "Fiat", model: "500", color: "white" };
      car.color = "red"; // change a property - OK
      car.owner = "Johnson"; // add a property - OK
      let msg =
        "type=" + car.type + ", color=" + car.color + ", owner=" + car.owner + "\n";
      try {
        car = { type: "Volvo" }; // reassign the object - NOT OK
      } catch (e) {
        msg += "car = {...}  -> " + e.name + " (cannot reassign the object)";
      }
      document.getElementById("demo").innerText = msg;
    </script>
  </body>
</html>
