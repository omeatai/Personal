<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>delete(key)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>delete(key)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myMap = new WeakMap();
      let myObj = {fname:"John", lname:"Doe"};
      myMap.set(myObj, "player");
      const ok = myMap.delete(myObj);
      document.getElementById("demo").innerText = "ok -> " + String(ok) + "\n" + "myMap.has(myObj) -> " + String(myMap.has(myObj)) + "\n" + "String(myMap.get(myObj)) -> " + String(String(myMap.get(myObj)));
    </script>
  </body>
</html>
