<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WeakMap secret data on a class source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>const myMap = new WeakMap();
class User {
  constructor(name) {
    myMap.set(this, {secret:&quot;hidden data&quot;});
    this.name = name;
  }
  getSecret() {
    return myMap.get(this).secret;
  }
}
const user1 = new User(&quot;John&quot;);
const secret = user1.getSecret();</pre>
  </body>
</html>
