<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WeakMap is not iterable</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>WeakMap is not iterable</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myMap = new WeakMap();
      const obj = {x: 1};
      myMap.set(obj, "v");
      let r0;
      try {
        r0 = [...myMap];
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = (function () { for (const x of myMap) {} return 'looped'; })();
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      let r2;
      try {
        r2 = myMap.forEach(function () {});
      } catch (e) {
        r2 = e.name + ": " + e.message;
      }
      let r3;
      try {
        r3 = myMap.keys();
      } catch (e) {
        r3 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "[...myMap] -> " + String(r0) + "\n" + "for...of -> " + String(r1) + "\n" + "myMap.forEach(fn) -> " + String(r2) + "\n" + "myMap.keys() -> " + String(r3);
    </script>
  </body>
</html>
