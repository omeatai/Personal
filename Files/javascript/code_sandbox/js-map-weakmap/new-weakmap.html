<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>new WeakMap()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>new WeakMap()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myMap = new WeakMap();
      document.getElementById("demo").innerText = "typeof myMap -> " + String(typeof myMap) + "\n" + "myMap instanceof WeakMap -> " + String(myMap instanceof WeakMap);
    </script>
  </body>
</html>
