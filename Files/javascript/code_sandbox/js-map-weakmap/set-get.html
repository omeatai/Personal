<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>set() then get()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>set() then get()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myMap = new WeakMap();
      let myObj = {fname:"John", lname:"Doe"};
      myMap.set(myObj, "player");
      const type = myMap.get(myObj);
      document.getElementById("demo").innerText = "type -> " + String(type) + "\n" + "myMap.get(myObj) -> " + String(myMap.get(myObj));
    </script>
  </body>
</html>
