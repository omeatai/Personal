<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>No size and no clear()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>No size and no clear()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myMap = new WeakMap();
      let r0;
      try {
        r0 = myMap.size;
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = myMap.clear();
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "myMap.size -> " + String(r0) + "\n" + "myMap.clear() -> " + String(r1);
    </script>
  </body>
</html>
