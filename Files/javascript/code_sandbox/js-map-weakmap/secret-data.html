<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WeakMap secret data on a class</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>WeakMap secret data on a class</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myMap = new WeakMap();
      class User {
        constructor(name) {
          myMap.set(this, {secret:"hidden data"});
          this.name = name;
        }
        getSecret() {
          return myMap.get(this).secret;
        }
      }
      const user1 = new User("John");
      let r0;
      try {
        r0 = user1.getSecret();
      } catch (e) {
        r0 = e.name + ": " + e.message;
      }
      let r1;
      try {
        r1 = myMap.get(user1).secret;
      } catch (e) {
        r1 = e.name + ": " + e.message;
      }
      let r2;
      try {
        r2 = [...myMap];
      } catch (e) {
        r2 = e.name + ": " + e.message;
      }
      let r3;
      try {
        r3 = JSON.stringify(Array.from(myMap));
      } catch (e) {
        r3 = e.name + ": " + e.message;
      }
      document.getElementById("demo").innerText = "user1.getSecret() -> " + String(r0) + "\n" + "myMap.get(user1).secret -> " + String(r1) + "\n" + "[...myMap] -> " + String(r2) + "\n" + "Array.from(myMap) -> " + String(r3);
    </script>
  </body>
</html>
