<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JSON from a server with XMLHttpRequest</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      (async function () {
        const out = [];
        function show(v) { out.push(String(v)); }
        function myDisplayer(v) { show(v); }
        try {
          const myObj = await (await fetch("json_demo.txt")).json();
          show(myObj.name);
        } catch (e) {
          out.push(e.name + ": " + e.message);
        }
        document.getElementById("demo").innerText = out.join("\n");
      })();
    </script>
  </body>
</html>
