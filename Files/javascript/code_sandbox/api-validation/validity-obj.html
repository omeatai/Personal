<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>validity property</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <input id="id1" type="number" required>
    <pre id="demo"></pre>
    <script>
      const v = document.getElementById("id1").validity;
      document.getElementById("demo").innerText =
        "valid=" + v.valid + " valueMissing=" + v.valueMissing;
    </script>
  </body>
</html>
