<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>checkValidity() method</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <input id="id1" type="number" min="100" max="300" required> <button type="button" id="ok">OK</button>
    <pre id="demo"></pre>
    <script>
      const inpObj = document.getElementById("id1");
      document.getElementById("ok").onclick = function () {
        if (!inpObj.checkValidity()) {
          document.getElementById("demo").innerText = inpObj.validationMessage;
        } else {
          document.getElementById("demo").innerText = "valid";
        }
      };
      document.getElementById("ok").click();
    </script>
  </body>
</html>
