<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>break — without it, cases fall through</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>break — without it, cases fall through</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let dayNum = 1;
      let day = "";
      switch (dayNum) {
        case 1:
          day += "Monday ";
        case 2:
          day += "Tuesday";
          break;
        default:
          day = "other";
      }
      document.getElementById("demo").innerText = "dayNum -> " + String(dayNum) + "\n" + "day -> " + String(day);
    </script>
  </body>
</html>
