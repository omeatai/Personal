<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>switch weekday number — 3 is Wednesday</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>switch weekday number — 3 is Wednesday</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let dayNum = 3; // pinned stand-in for new Date().getDay()
      let day;
      switch (dayNum) {
        case 0:
          day = "Sunday";
          break;
        case 1:
          day = "Monday";
          break;
        case 2:
          day = "Tuesday";
          break;
        case 3:
          day = "Wednesday";
          break;
        case 4:
          day = "Thursday";
          break;
        case 5:
          day = "Friday";
          break;
        case 6:
          day = "Saturday";
      }
      document.getElementById("demo").innerText = "dayNum -> " + String(dayNum) + "\n" + "day -> " + String(day);
    </script>
  </body>
</html>
