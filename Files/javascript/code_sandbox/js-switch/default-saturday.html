<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>default switch — 6 is Today is Saturday</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>default switch — 6 is Today is Saturday</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let dayNum = 6;
      let text;
      switch (dayNum) {
        case 6:
          text = "Today is Saturday";
          break;
        case 0:
          text = "Today is Sunday";
          break;
        default:
          text = "Looking forward to the Weekend";
      }
      document.getElementById("demo").innerText = "dayNum -> " + String(dayNum) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
