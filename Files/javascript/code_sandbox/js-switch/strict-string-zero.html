<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Strict comparison — string &quot;0&quot; does not match case 0</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Strict comparison — string &quot;0&quot; does not match case 0</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = "0";
      let text;
      switch (x) {
        case 0:
          text = "Off";
          break;
        case 1:
          text = "On";
          break;
        default:
          text = "No value found";
      }
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "typeof x -> " + String(typeof x) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
