<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`for` i < 5 — "The number is i"</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`for` i &lt; 5 — &quot;The number is i&quot;</h2>
    <pre id="demo"></pre>
    <script>
      let text = "";
      for (let i = 0; i < 5; i++) {
        text += "The number is " + i + "\n";
      }
      document.getElementById("demo").innerText = "text -> " + text.trim();
    </script>
  </body>
</html>
