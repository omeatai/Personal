<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>`for` over a cars array</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>`for` over a cars array</h2>
    <pre id="demo"></pre>
    <script>
      const cars = ["BMW", "Volvo", "Saab", "Ford", "Fiat", "Audi"];
      let text = "";
      for (let i = 0; i < cars.length; i++) {
        text += cars[i] + " ";
      }
      document.getElementById("demo").innerText =
        "cars.length -> " + cars.length + "\n" +
        "text -> " + text.trim();
    </script>
  </body>
</html>
