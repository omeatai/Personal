<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Number.isNaN(NaN) is the right test</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Number.isNaN(NaN) is the right test</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number.isNaN(NaN);
      Number.isNaN(100 / "Apple");
      document.getElementById("demo").innerText = "Number.isNaN(NaN) -> " + String(Number.isNaN(NaN)) + "\n" + "Number.isNaN(100 / \"Apple\") -> " + String(Number.isNaN(100 / "Apple"));
    </script>
  </body>
</html>
