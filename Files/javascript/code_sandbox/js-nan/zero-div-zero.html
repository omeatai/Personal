<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>0 / 0 is NaN</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>0 / 0 is NaN</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 0 / 0;
      let inf = 1 / 0;
      document.getElementById("demo").innerText = "0 / 0 -> " + String(x) + "\n" + "1 / 0 -> " + String(inf);
    </script>
  </body>
</html>
