<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object.is(NaN, NaN) is true</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object.is(NaN, NaN) is true</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Object.is(NaN, NaN);
      document.getElementById("demo").innerText = "Object.is(NaN, NaN) -> " + String(Object.is(NaN, NaN));
    </script>
  </body>
</html>
