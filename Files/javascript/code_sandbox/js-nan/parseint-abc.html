<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>parseInt(&quot;abc&quot;) is NaN</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>parseInt(&quot;abc&quot;) is NaN</h2>
    
    <pre id="demo"></pre>
    
    <script>
      parseInt("abc");
      parseFloat("abc");
      document.getElementById("demo").innerText = "parseInt(\"abc\") -> " + String(parseInt("abc")) + "\n" + "parseFloat(\"abc\") -> " + String(parseFloat("abc"));
    </script>
  </body>
</html>
