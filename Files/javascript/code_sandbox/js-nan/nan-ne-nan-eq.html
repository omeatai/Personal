<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>NaN == NaN is false</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>NaN == NaN is false</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = NaN;
      x == x;
      document.getElementById("demo").innerText = "x == x -> " + String(x == x) + "\n" + "x === x -> " + String(x === x);
    </script>
  </body>
</html>
