<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>String(Date()) — Date() as a function</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>String(Date()) — Date() as a function</h2>
    
    <pre id="demo"></pre>
    
    <script>
      String(Date());
      document.getElementById("demo").innerText = "String(Date()) -> " + String(String(Date()));
    </script>
  </body>
</html>
