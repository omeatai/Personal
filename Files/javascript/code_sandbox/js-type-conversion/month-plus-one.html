<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>(getMonth()+1).toString() — 1–12</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>(getMonth()+1).toString() — 1–12</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      (d.getMonth() + 1).toString();
      document.getElementById("demo").innerText = "d.getMonth() + 1 -> " + String(d.getMonth() + 1) + "\n" + "(d.getMonth() + 1).toString() -> " + String((d.getMonth() + 1).toString());
    </script>
  </body>
</html>
