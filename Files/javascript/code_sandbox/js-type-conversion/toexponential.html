<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>toExponential()</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>toExponential()</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 123;
      x.toExponential();
      document.getElementById("demo").innerText = "x.toExponential() -> " + String((123).toExponential());
    </script>
  </body>
</html>
