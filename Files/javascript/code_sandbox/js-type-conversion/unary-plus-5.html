<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>unary + on &quot;5&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>unary + on &quot;5&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let y = "5";
      let x = + y;
      document.getElementById("demo").innerText = "y -> " + String(y) + "\n" + "x -> " + String(x) + "\n" + "typeof y -> " + String(typeof y) + "\n" + "typeof x -> " + String(typeof x);
    </script>
  </body>
</html>
