<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Number(false) is 0</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Number(false) is 0</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Number(false);
      document.getElementById("demo").innerText = "Number(false) -> " + String(Number(false));
    </script>
  </body>
</html>
