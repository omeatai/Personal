<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>String(100 + 23)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>String(100 + 23)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      String(100 + 23);
      document.getElementById("demo").innerText = "String(100 + 23) -> " + String(String(100 + 23));
    </script>
  </body>
</html>
