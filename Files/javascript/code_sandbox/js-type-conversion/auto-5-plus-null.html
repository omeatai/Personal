<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>5 + null — null becomes 0</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>5 + null — null becomes 0</h2>
    
    <pre id="demo"></pre>
    
    <script>
      5 + null;
      document.getElementById("demo").innerText = "5 + null -> " + String(5 + null);
    </script>
  </body>
</html>
