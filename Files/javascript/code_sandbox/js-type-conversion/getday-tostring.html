<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>getDay().toString() — weekday 0–6</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>getDay().toString() — weekday 0–6</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      d.getDay().toString();
      document.getElementById("demo").innerText = "d.getDay() -> " + String(d.getDay()) + "\n" + "d.getDay().toString() -> " + String(d.getDay().toString());
    </script>
  </body>
</html>
