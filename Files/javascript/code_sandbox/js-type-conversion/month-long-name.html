<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>toLocaleString month:&#x27;long&#x27;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>toLocaleString month:&#x27;long&#x27;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      d.toLocaleString('default', { month: 'long' });
      document.getElementById("demo").innerText = "month -> " + String(d.toLocaleString('default', { month: 'long' }));
    </script>
  </body>
</html>
