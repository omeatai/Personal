<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>getMinutes().toString() — 0–59 (not 0–23)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>getMinutes().toString() — 0–59 (not 0–23)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      d.getMinutes().toString();
      document.getElementById("demo").innerText = "d.getMinutes() -> " + String(d.getMinutes()) + "\n" + "d.getMinutes().toString() -> " + String(d.getMinutes().toString());
    </script>
  </body>
</html>
