<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Date().toString() — already a string</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Date().toString() — already a string</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Date().toString();
      document.getElementById("demo").innerText = "Date().toString() -> " + String(Date().toString());
    </script>
  </body>
</html>
