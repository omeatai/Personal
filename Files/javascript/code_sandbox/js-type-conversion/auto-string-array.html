<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Automatic toString — array → &quot;1,2,3,4&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Automatic toString — array → &quot;1,2,3,4&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let myVar = [1, 2, 3, 4];
      String(myVar);
      document.getElementById("demo").innerText = "String(myVar) -> " + String(String(myVar));
    </script>
  </body>
</html>
