<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Automatic toString — Date</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Automatic toString — Date</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("2021-03-25T15:30:45.123Z");
      String(d);
      document.getElementById("demo").innerText = "String(d) -> " + String(String(d));
    </script>
  </body>
</html>
