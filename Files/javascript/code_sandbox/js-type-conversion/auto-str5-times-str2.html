<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>&quot;5&quot; * &quot;2&quot; — both become numbers</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>&quot;5&quot; * &quot;2&quot; — both become numbers</h2>
    
    <pre id="demo"></pre>
    
    <script>
      "5" * "2";
      document.getElementById("demo").innerText = "\"5\" * \"2\" -> " + String("5" * "2");
    </script>
  </body>
</html>
