<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>splice(2, 2, &quot;Lemon&quot;, &quot;Kiwi&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>splice(2, 2, &quot;Lemon&quot;, &quot;Kiwi&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      let removed = fruits.splice(2, 2, "Lemon", "Kiwi");
      document.getElementById("demo").innerText = "fruits -> " + String(JSON.stringify(fruits)) + "\n" + "removed -> " + String(JSON.stringify(removed));
    </script>
  </body>
</html>
