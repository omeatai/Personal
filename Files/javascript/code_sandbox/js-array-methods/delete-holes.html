<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WARNING delete fruits[0]</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>WARNING delete fruits[0]</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      delete fruits[0];
      document.getElementById("demo").innerText = "fruits -> " + String(JSON.stringify(fruits)) + "\n" + "fruits[0] -> " + String(fruits[0]) + "\n" + "0 in fruits -> " + String(0 in fruits) + "\n" + "fruits.length -> " + String(fruits.length);
    </script>
  </body>
</html>
