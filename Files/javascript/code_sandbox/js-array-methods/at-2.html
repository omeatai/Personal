<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>fruits.at(2)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>fruits.at(2)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      let fruit = fruits.at(2);
      document.getElementById("demo").innerText = "fruit -> " + String(fruit);
    </script>
  </body>
</html>
