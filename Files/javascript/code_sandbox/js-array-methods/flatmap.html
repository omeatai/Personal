<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>flatMap(x =&gt; [x, x * 10])</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>flatMap(x =&gt; [x, x * 10])</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const myArr = [1, 2, 3, 4, 5, 6];
      const newArr = myArr.flatMap(x => [x, x * 10]);
      document.getElementById("demo").innerText = "newArr -> " + String(JSON.stringify(newArr));
    </script>
  </body>
</html>
