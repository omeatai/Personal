<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>WARNING fruits[-1] vs fruits.at(-1)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>WARNING fruits[-1] vs fruits.at(-1)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      let bracket = fruits[-1];
      let fromEnd = fruits.at(-1);
      document.getElementById("demo").innerText = "fruits[-1] -> " + String(bracket) + "\n" + "fruits.at(-1) -> " + String(fromEnd);
    </script>
  </body>
</html>
