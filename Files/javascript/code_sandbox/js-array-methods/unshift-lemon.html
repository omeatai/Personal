<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>fruits.unshift(&quot;Lemon&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>fruits.unshift(&quot;Lemon&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      fruits.unshift("Lemon");
      document.getElementById("demo").innerText = "fruits -> " + String(JSON.stringify(fruits));
    </script>
  </body>
</html>
