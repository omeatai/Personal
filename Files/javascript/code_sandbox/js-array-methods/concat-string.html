<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>concat an array with &quot;Peter&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>concat an array with &quot;Peter&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const arr1 = ["Emil", "Tobias", "Linus"];
      const myChildren = arr1.concat("Peter");
      document.getElementById("demo").innerText = "myChildren -> " + String(JSON.stringify(myChildren));
    </script>
  </body>
</html>
