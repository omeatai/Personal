<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Function Expressions</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Function Expressions</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const multiply = function(a, b) {
        return a * b;
      };
      let z = multiply(4, 3);
      document.getElementById("demo").innerText = "z -> " + String(z) + "\n" + "typeof multiply -> " + String(typeof multiply);
    </script>
  </body>
</html>
