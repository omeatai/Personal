<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Arrow Functions</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Arrow Functions</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const multiply = (a, b) => a * b;
      let z = multiply(4, 5);
      document.getElementById("demo").innerText = "z -> " + String(z);
    </script>
  </body>
</html>
