<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Decimal to binary</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Decimal to binary</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function dec2bin(dec) {
        return (dec >>> 0).toString(2);
      }
      document.getElementById("demo").innerText = "dec2bin(5) -> " + String(dec2bin(5)) + "\n" + "dec2bin(-5) -> " + String(dec2bin(-5));
    </script>
  </body>
</html>
