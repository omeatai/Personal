<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>camelCase vs under_score vs PascalCase vs $</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>camelCase vs under_score vs PascalCase vs $</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const firstName = "camel";
      const date_of_birth = "underscore";
      const Person = { kind: "PascalCase constructor style" };
      const PI = 3.14;
      const $foo = "legal but avoid";
      document.getElementById("demo").innerText = "firstName -> " + String(firstName) + "\n" + "date_of_birth -> " + String(date_of_birth) + "\n" + "Person.kind -> " + String(Person.kind) + "\n" + "PI -> " + String(PI) + "\n" + "$foo -> " + String($foo);
    </script>
  </body>
</html>
