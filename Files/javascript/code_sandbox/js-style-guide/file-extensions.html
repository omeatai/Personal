<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>File extensions: .html .css .js</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>File extensions: .html .css .js</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const files = ["index.html", "style.css", "app.js"];
      document.getElementById("demo").innerText = "files -> " + String(files.join(", "));
    </script>
  </body>
</html>
