<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Load scripts with &lt;script src=&quot;myscript.js&quot;&gt; (no type)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Load scripts with &lt;script src=&quot;myscript.js&quot;&gt; (no type)</h2>
    <p id="note">External file: <code>myscript.js</code></p>
    <pre id="demo"></pre>
    
    <script>
      document.getElementById("demo").innerText = "use: <script src=\"myscript.js\"></script>\n(type attribute omitted)";
    </script>
  </body>
</html>
