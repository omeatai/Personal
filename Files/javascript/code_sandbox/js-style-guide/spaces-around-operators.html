<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Spaces around operators and after commas</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Spaces around operators and after commas</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let y = 2;
      let z = 3;
      let x = y + z;
      const myArray = ["Volvo", "Saab", "Fiat"];
      document.getElementById("demo").innerText = "x -> " + String(x) + "\n" + "myArray -> " + String(myArray.join(", "));
    </script>
  </body>
</html>
