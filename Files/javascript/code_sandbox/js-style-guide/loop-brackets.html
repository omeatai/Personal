<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for loop: `{` on the `for` line</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for loop: `{` on the `for` line</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let x = 0;
      for (let i = 0; i < 5; i++) {
        x += i;
      }
      document.getElementById("demo").innerText = "x -> " + String(x);
    </script>
  </body>
</html>
