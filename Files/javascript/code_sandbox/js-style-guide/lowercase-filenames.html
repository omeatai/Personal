<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Use lower-case file names</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Use lower-case file names</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const unix = "london.jpg" === "London.jpg";
      document.getElementById("demo").innerText = "london.jpg === London.jpg -> " + String(unix);
    </script>
  </body>
</html>
