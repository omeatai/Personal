<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Break long lines after an operator or comma (line length &lt; 80)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Break long lines after an operator or comma (line length &lt; 80)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      document.getElementById("demo").innerText =
"Hello Dolly.";
    </script>
  </body>
</html>
