<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Indent code blocks with 2 spaces (not tabs)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Indent code blocks with 2 spaces (not tabs)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function toCelsius(fahrenheit) {
        return (5 / 9) * (fahrenheit - 32);
      }
      document.getElementById("demo").innerText = "toCelsius(32) -> " + String(toCelsius(32)) + "\n" + "toCelsius(212) -> " + String(toCelsius(212));
    </script>
  </body>
</html>
