<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>tabIndex source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>const w = document.getElementById(&quot;wrap&quot;);
      document.getElementById(&quot;demo&quot;).innerText = String(w.tabIndex);
      w.tabIndex = 3;
      document.getElementById(&quot;demo&quot;).innerText += &quot; -&gt; &quot; + w.tabIndex;</pre>
  </body>
</html>
