<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>The oninput event</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <input id="fname"><p id="out"></p>
    <pre id="demo"></pre>
    <script>
      const f = document.getElementById("fname");
      f.oninput = function () { document.getElementById("out").innerHTML = this.value; };
      f.value = "Hi";
      f.dispatchEvent(new Event("input", { bubbles: true }));
      document.getElementById("demo").innerText = document.getElementById("out").innerHTML;
    </script>
  </body>
</html>
