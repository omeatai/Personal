<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>More examples — change an image while the mouse is down source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>&lt;img id=&quot;light&quot; alt=&quot;bulb&quot; width=&quot;48&quot; height=&quot;48&quot;
  onmousedown=&quot;this.src=&#x27;down.svg&#x27;&quot; onmouseup=&quot;this.src=&#x27;up.svg&#x27;&quot; src=&quot;up.svg&quot;&gt;</pre>
  </body>
</html>
