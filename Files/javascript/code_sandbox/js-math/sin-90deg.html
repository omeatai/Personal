<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math.sin(90°) via radians</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math.sin(90°) via radians</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Math.sin(90 * Math.PI / 180);
      document.getElementById("demo").innerText = "Math.sin(90 * Math.PI / 180) -> " + String(Math.sin(90 * Math.PI / 180));
    </script>
  </body>
</html>
