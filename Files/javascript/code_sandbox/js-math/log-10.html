<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math.log(10) — times to multiply e to get 10</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math.log(10) — times to multiply e to get 10</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Math.log(10);
      document.getElementById("demo").innerText = "Math.log(10) -> " + String(Math.log(10)) + "\n" + "Math.LN10 -> " + String(Math.LN10);
    </script>
  </body>
</html>
