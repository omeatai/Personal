<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Eight Math constant properties</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Eight Math constant properties</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Math.E;
      Math.PI;
      Math.SQRT2;
      Math.SQRT1_2;
      Math.LN2;
      Math.LN10;
      Math.LOG2E;
      Math.LOG10E;
      document.getElementById("demo").innerText = "Math.E -> " + String(Math.E) + "\n" + "Math.PI -> " + String(Math.PI) + "\n" + "Math.SQRT2 -> " + String(Math.SQRT2) + "\n" + "Math.SQRT1_2 -> " + String(Math.SQRT1_2) + "\n" + "Math.LN2 -> " + String(Math.LN2) + "\n" + "Math.LN10 -> " + String(Math.LN10) + "\n" + "Math.LOG2E -> " + String(Math.LOG2E) + "\n" + "Math.LOG10E -> " + String(Math.LOG10E);
    </script>
  </body>
</html>
