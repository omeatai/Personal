<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math.floor — round toward −∞</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math.floor — round toward −∞</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Math.floor(4.7);
      document.getElementById("demo").innerText = "Math.floor(4.7) -> " + String(Math.floor(4.7)) + "\n" + "Math.floor(4.9) -> " + String(Math.floor(4.9)) + "\n" + "Math.floor(4.4) -> " + String(Math.floor(4.4)) + "\n" + "Math.floor(4.2) -> " + String(Math.floor(4.2)) + "\n" + "Math.floor(-4.2) -> " + String(Math.floor(-4.2));
    </script>
  </body>
</html>
