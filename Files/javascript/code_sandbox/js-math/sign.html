<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Math.sign — −1 / 0 / 1</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Math.sign — −1 / 0 / 1</h2>
    
    <pre id="demo"></pre>
    
    <script>
      Math.sign(4);
      document.getElementById("demo").innerText = "Math.sign(4) -> " + String(Math.sign(4)) + "\n" + "Math.sign(-4) -> " + String(Math.sign(-4)) + "\n" + "Math.sign(0) -> " + String(Math.sign(0));
    </script>
  </body>
</html>
