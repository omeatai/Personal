<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array toLocaleString — each element</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array toLocaleString — each element</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const dates = [
        new Date("2026-01-01"),
        new Date("2026-12-24")
      ];
      let text = dates.toLocaleString("en-US");
      document.getElementById("demo").innerText = "text -> " + String(text) + "\n" + "dates[0].toISOString() -> " + String(dates[0].toISOString()) + "\n" + "dates[1].toISOString() -> " + String(dates[1].toISOString());
    </script>
  </body>
</html>
