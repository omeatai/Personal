<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>minimumFractionDigits / maximumFractionDigits</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>minimumFractionDigits / maximumFractionDigits</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let num = 3.14159;
      let text = num.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
