<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>BigInt toLocaleString (named type on the page)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>BigInt toLocaleString (named type on the page)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let n = 1234567890123456789n;
      let text = n.toLocaleString("en-US");
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
