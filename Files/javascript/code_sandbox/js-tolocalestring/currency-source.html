<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>style currency — USD, EUR, NOK source</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      body { background: #f1f1f1; }
      pre {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-left: 4px solid #04aa6d;
        font-family: Consolas, "Courier New", monospace;
        font-size: 16px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Example</h3>
    <pre>let price = 1299.95;
let dollars = price.toLocaleString(&quot;en-US&quot;, {style:&quot;currency&quot;, currency:&quot;USD&quot;});
let euros = price.toLocaleString(&quot;de-DE&quot;, {style:&quot;currency&quot;, currency:&quot;EUR&quot;});
let kroner = price.toLocaleString(&quot;no-NO&quot;, {style:&quot;currency&quot;, currency:&quot;NOK&quot;});</pre>
  </body>
</html>
