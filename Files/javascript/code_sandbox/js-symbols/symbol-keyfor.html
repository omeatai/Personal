<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol.keyFor — registry lookup</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol.keyFor — registry lookup</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const g = Symbol.for("id");
      const local = Symbol("id");
      document.getElementById("demo").innerText = "Symbol.keyFor(g) -> " + String(Symbol.keyFor(g)) + "\n" + "Symbol.keyFor(local) -> " + String(Symbol.keyFor(local));
    </script>
  </body>
</html>
