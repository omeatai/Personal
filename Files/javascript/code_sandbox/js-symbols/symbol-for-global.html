<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol.for(&quot;id&quot;) is reused</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol.for(&quot;id&quot;) is reused</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const id1 = Symbol.for("id");
      const id2 = Symbol.for("id");
      let result = (id1 === id2);
      document.getElementById("demo").innerText = "result -> " + String(result);
    </script>
  </body>
</html>
