<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol as an object key</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol as an object key</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const id = Symbol("id");
      const person = { firstName: "John", lastName: "Doe" };
      person[id] = 123;
      document.getElementById("demo").innerText = "person[id] -> " + String(person[id]) + "\n" + "person.firstName -> " + String(person.firstName);
    </script>
  </body>
</html>
