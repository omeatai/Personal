<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol(&quot;id&quot;) === Symbol(&quot;id&quot;) is false</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol(&quot;id&quot;) === Symbol(&quot;id&quot;) is false</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const id1 = Symbol("id");
      const id2 = Symbol("id");
      let result = (id1 === id2);
      document.getElementById("demo").innerText = "result -> " + String(result) + "\n" + "String(id1) -> " + String(String(id1));
    </script>
  </body>
</html>
