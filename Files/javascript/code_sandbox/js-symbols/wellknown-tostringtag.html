<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol.toStringTag</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol.toStringTag</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const o = { [Symbol.toStringTag]: "Foo" };
      let tag = Object.prototype.toString.call(o);
      document.getElementById("demo").innerText = "tag -> " + String(tag) + "\n" + "String(o) -> " + String(String(o));
    </script>
  </body>
</html>
