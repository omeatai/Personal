<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol() === Symbol() is false</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol() === Symbol() is false</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const id1 = Symbol();
      const id2 = Symbol();
      let result = (id1 === id2);
      document.getElementById("demo").innerText = "result -> " + String(result) + "\n" + "typeof id1 -> " + String(typeof id1);
    </script>
  </body>
</html>
