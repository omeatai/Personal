<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>person[id] vs person.id</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>person[id] vs person.id</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {
        firstName: "John",
        lastName: "Doe",
        age: 50,
        eyeColor: "blue"
      };
      let id = Symbol("id");
      person[id] = 140353;
      document.getElementById("demo").innerText = "person[id] -> " + String(person[id]) + "\n" + "person.id -> " + String(person.id);
    </script>
  </body>
</html>
