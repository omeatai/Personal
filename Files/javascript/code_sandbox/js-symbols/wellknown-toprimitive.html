<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Symbol.toPrimitive</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Symbol.toPrimitive</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const o = {
        [Symbol.toPrimitive](hint) {
          if (hint === "number") return 42;
          return "ok";
        }
      };
      document.getElementById("demo").innerText = "Number(o) -> " + String(Number(o)) + "\n" + "String(o) -> " + String(String(o)) + "\n" + "o + 1 -> " + String(o + 1);
    </script>
  </body>
</html>
