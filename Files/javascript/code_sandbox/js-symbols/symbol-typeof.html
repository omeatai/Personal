<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>typeof Symbol(&quot;id&quot;) is &quot;symbol&quot;</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>typeof Symbol(&quot;id&quot;) is &quot;symbol&quot;</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const id = Symbol("id");
      let type = typeof id;
      document.getElementById("demo").innerText = "type -> " + String(type);
    </script>
  </body>
</html>
