<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>onclick — change this.innerHTML</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <button type="button" id="btn">The time is?</button>
    <pre id="demo"></pre>
    <script>
      document.getElementById("btn").onclick = function () { this.innerHTML = Date(); };
      document.getElementById("btn").click();
      document.getElementById("demo").innerText = document.getElementById("btn").innerHTML;
    </script>
  </body>
</html>
