<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Calling a JavaScript function from onclick</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <button type="button" id="btn">The time is?</button><p id="out"></p>
    <pre id="demo"></pre>
    <script>
      function displayDate() { document.getElementById("out").innerHTML = Date(); }
      document.getElementById("btn").onclick = displayDate;
      document.getElementById("btn").click();
      document.getElementById("demo").innerText = document.getElementById("out").innerHTML;
    </script>
  </body>
</html>
