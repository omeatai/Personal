<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Highly recommended — addEventListener</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <button type="button" id="myBtn">Click me</button><p id="out"></p>
    <pre id="demo"></pre>
    <script>
      const btn = document.getElementById("myBtn");
      btn.addEventListener("click", function () {
        document.getElementById("out").innerHTML = Date();
      });
      btn.click();
      document.getElementById("demo").innerText = document.getElementById("out").innerHTML;
    </script>
  </body>
</html>
