<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Common event — onchange</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <input id="n"><p id="out"></p>
    <pre id="demo"></pre>
    <script>
      const n = document.getElementById("n");
      n.onchange = function () { document.getElementById("out").textContent = this.value; };
      n.value = "Ada";
      n.dispatchEvent(new Event("change", { bubbles: true }));
      document.getElementById("demo").innerText = document.getElementById("out").textContent;
    </script>
  </body>
</html>
