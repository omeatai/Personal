<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Common event — onload</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <p>Load event</p>
    <pre id="demo"></pre>
    <script>
      function loaded() { document.getElementById("demo").innerText = "page loaded"; }
      window.addEventListener("load", loaded);
      if (document.readyState === "complete") loaded();
    </script>
  </body>
</html>
