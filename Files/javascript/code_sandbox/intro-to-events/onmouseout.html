<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Common event — onmouseout</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <div id="box" style="padding:12px;background:#eee;">inside</div>
    <pre id="demo"></pre>
    <script>
      const box = document.getElementById("box");
      box.onmouseout = function () { box.textContent = "left"; };
      box.dispatchEvent(new MouseEvent("mouseout", { bubbles: true }));
      document.getElementById("demo").innerText = box.textContent;
    </script>
  </body>
</html>
