<!doctype html>
<html>

    <meta name="color-scheme" content="light" />
    <title>Symbol omitted from objects, null in arrays</title>
    <link rel="stylesheet" href="../sandbox.css" />

      button { margin-right: 4px; }
      
    </style>

    <pre id="demo"></pre>
    <script>
