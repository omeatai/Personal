<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Formatting JSON with space</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    
    <pre id="demo"></pre>
    <script>
      const text = JSON.stringify({ name: "John", age: 30, city: "New York" }, null, 1);
      document.getElementById("demo").innerText = text;
    </script>
  </body>
</html>
