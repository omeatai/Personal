  <body>
    <h2>isSubsetOf() — page Tryit</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const A = new Set(["a","b","c"]);
      const B = new Set(["b","c","d"]);
      const answer = A.isSubsetOf(B);
      document.getElementById("demo").innerText = "A.isSubsetOf(B) -> " + String(A.isSubsetOf(B)) + "\n" + "Array.from(A) -> " + String(JSON.stringify(Array.from(A))) + "\n" + "Array.from(B) -> " + String(JSON.stringify(Array.from(B)));
    </script>
