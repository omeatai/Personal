<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>isDisjointFrom() true case</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>isDisjointFrom() true case</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const A = new Set(["a","b","c"]);
      const Z = new Set(["z"]);
      const answer = A.isDisjointFrom(Z);
      document.getElementById("demo").innerText = "A.isDisjointFrom(Z) -> " + String(A.isDisjointFrom(Z)) + "\n" + "A.isDisjointFrom(new Set([\"a\"])) -> " + String(A.isDisjointFrom(new Set(["a"])));
    </script>
  </body>
</html>
