<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Output - console.log</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h1>My First Web Page</h1>
    <p>Open the browser console to see <code>console.log(5 + 6)</code>.</p>
    <p>Console output (mirrored to the page for the snapshot):</p>
    <pre
      id="out"
      style="
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 10px 14px;
        border-radius: 4px;
        font-family: Consolas, monospace;
      "
    ></pre>
    <script>
      console.log(5 + 6);
      document.getElementById("out").textContent = "> " + (5 + 6);
    </script>
  </body>
</html>
