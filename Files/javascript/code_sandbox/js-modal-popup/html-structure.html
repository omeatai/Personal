<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>HTML: Open button, overlay, box, close ×</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
.modal-overlay {
  display: none;
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
}
.modal-overlay.show { display: block; }
.modal-box {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: 100px auto;
  padding: 20px;
  border-radius: 10px;
  position: relative;
}
.modal-close {
  position: absolute;
  right: 12px;
  top: 8px;
  font-size: 24px;
  border: none;
  background: none;
  cursor: pointer;
}

    </style>
  </head>
  <body>
    <h2>Modal Popup</h2>
<button type="button" id="openBtn">Open Modal</button>
<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <button type="button" id="closeBtn" class="modal-close">&times;</button>
    <h3>Hello!</h3>
    <p>This is a modal popup.</p>
  </div>
</div>
    <pre id="log"></pre>
    <script>
      const __log = [];
      function note(s) {
        __log.push(s);
        const el = document.getElementById("log");
        if (el) el.innerText = __log.join("\n");
      }
      const modal = document.getElementById("modal");
      note("overlay display -> " + getComputedStyle(modal).display);
      note("openBtn -> " + document.getElementById("openBtn").textContent.trim());

    </script>
  </body>
</html>
