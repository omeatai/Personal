<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Date.parse(&quot;March 21, 2012&quot;) — milliseconds</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Date.parse(&quot;March 21, 2012&quot;) — milliseconds</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let msec = Date.parse("March 21, 2012");
      document.getElementById("demo").innerText = "msec -> " + String(msec);
    </script>
  </body>
</html>
