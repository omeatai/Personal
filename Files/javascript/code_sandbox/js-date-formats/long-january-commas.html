<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>new Date(&quot;JANUARY, 25, 2015&quot;)</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>new Date(&quot;JANUARY, 25, 2015&quot;)</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const d = new Date("JANUARY, 25, 2015");
      document.getElementById("demo").innerText = "d -> " + String(String(d)) + "\n" + "d.toISOString() -> " + String(d.toISOString());
    </script>
  </body>
</html>
