<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Empty array, then assign by index</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Empty array, then assign by index</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const cars = [];
      cars[0] = "Saab";
      cars[1] = "Volvo";
      cars[2] = "BMW";
      document.getElementById("demo").innerText = "cars -> " + String(JSON.stringify(cars));
    </script>
  </body>
</html>
