<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array elements can be objects, functions, arrays</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array elements can be objects, functions, arrays</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function myFunction() {
        return "hello";
      }
      const myCars = ["Saab", "Volvo"];
      const myArray = [];
      myArray[0] = Date.now;
      myArray[1] = myFunction;
      myArray[2] = myCars;
      document.getElementById("demo").innerText = "typeof myArray[0] -> " + String(typeof myArray[0]) + "\n" + "myArray[1]() -> " + String(myArray[1]()) + "\n" + "myArray[2] -> " + String(JSON.stringify(myArray[2]));
    </script>
  </body>
</html>
