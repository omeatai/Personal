<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object: person.firstName is John</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object: person.firstName is John</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {firstName:"John", lastName:"Doe", age:46};
      document.getElementById("demo").innerText = "person -> " + String(JSON.stringify(person)) + "\n" + "person.firstName -> " + String(person.firstName);
    </script>
  </body>
</html>
