<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>typeof fruits is object</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>typeof fruits is object</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple"];
      let type = typeof fruits;
      document.getElementById("demo").innerText = "type -> " + String(type);
    </script>
  </body>
</html>
