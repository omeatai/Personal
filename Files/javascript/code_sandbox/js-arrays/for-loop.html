<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>for loop over fruits</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>for loop over fruits</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const fruits = ["Banana", "Orange", "Apple", "Mango"];
      let fLen = fruits.length;
      let text = "";
      for (let i = 0; i < fLen; i++) {
        text += fruits[i] + (i < fLen - 1 ? ", " : "");
      }
      document.getElementById("demo").innerText = "text -> " + String(text);
    </script>
  </body>
</html>
