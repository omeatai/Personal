<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Array: person[0] is John</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Array: person[0] is John</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = ["John", "Doe", 46];
      document.getElementById("demo").innerText = "person -> " + String(JSON.stringify(person)) + "\n" + "person[0] -> " + String(person[0]);
    </script>
  </body>
</html>
