<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Arithmetic - Basic</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Basic Arithmetic</h2>
    <pre id="demo"></pre>
    <script>
      let a = 100,
        b = 50;
      document.getElementById("demo").innerText =
        "a = 100, b = 50\n" +
        "a + b = " +
        (a + b) +
        "\n" +
        "a - b = " +
        (a - b) +
        "\n" +
        "a * b = " +
        a * b +
        "\n" +
        "a / b = " +
        a / b;
    </script>
  </body>
</html>
