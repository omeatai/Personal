<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Arithmetic - Precedence</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Operator Precedence</h2>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText =
        "100 + 50 * 3   = " + (100 + 50 * 3) + "   (* before +)\n" +
        "(100 + 50) * 3 = " + ((100 + 50) * 3) + "   (parentheses first)\n" +
        "100 + 50 - 3   = " + (100 + 50 - 3) + "   (same level, left to right)\n" +
        "2 ** 3 ** 2    = " + (2 ** 3 ** 2) + "   (** is right to left: 2 ** 9)";
    </script>
  </body>
</html>
