<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Arithmetic - Modulus & Power</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Modulus & Exponentiation</h2>
    <pre id="demo"></pre>
    <script>
      document.getElementById("demo").innerText =
        "5 % 2   = " + (5 % 2) + "\n" +
        "10 % 3  = " + (10 % 3) + "\n" +
        "9 % 3   = " + (9 % 3) + "   (evenly divisible)\n" +
        "5 ** 2  = " + (5 ** 2) + "\n" +
        "2 ** 10 = " + (2 ** 10) + "\n" +
        "Math.pow(5,2) = " + Math.pow(5, 2) + "  (same as 5 ** 2)";
    </script>
  </body>
</html>
