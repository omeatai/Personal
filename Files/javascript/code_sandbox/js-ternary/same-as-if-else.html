<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Ternary vs the equivalent if…else</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Ternary vs the equivalent if…else</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let age = 16;
      let textIf;
      if (age < 18) {
        textIf = "Minor";
      } else {
        textIf = "Adult";
      }
      let textTernary = (age < 18) ? "Minor" : "Adult";
      document.getElementById("demo").innerText = "textIf -> " + String(textIf) + "\n" + "textTernary -> " + String(textTernary) + "\n" + "same -> " + String(textIf === textTernary);
    </script>
  </body>
</html>
