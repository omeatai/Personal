<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>The three operands: condition, ?, expressions</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>The three operands: condition, ?, expressions</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let condition = (10 > 9);
      let expression1 = "yes";
      let expression2 = "no";
      let result = condition ? expression1 : expression2;
      document.getElementById("demo").innerText = "condition -> " + String(condition) + "\n" + "expression1 -> " + String(expression1) + "\n" + "expression2 -> " + String(expression2) + "\n" + "result -> " + String(result);
    </script>
  </body>
</html>
