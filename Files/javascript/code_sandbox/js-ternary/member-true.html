<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>isMember true → discount 0.2</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>isMember true → discount 0.2</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let isMember = true;
      let discount = isMember ? 0.2 : 0;
      document.getElementById("demo").innerText = "isMember -> " + String(isMember) + "\n" + "discount -> " + String(discount);
    </script>
  </body>
</html>
