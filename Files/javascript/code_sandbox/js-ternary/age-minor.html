<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>age &lt; 18 ? Minor : Adult — age 16</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>age &lt; 18 ? Minor : Adult — age 16</h2>
    
    <pre id="demo"></pre>
    
    <script>
      let age = 16;
      let text = (age < 18) ? "Minor" : "Adult";
      document.getElementById("demo").innerText = "age -> " + String(age) + "\n" + "age < 18 -> " + String(age < 18) + "\n" + "text -> " + String(text);
    </script>
  </body>
</html>
