<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Continue</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>JavaScript Continue</h2>
    <p id="out"></p>
    <script>
      let text = "";
      for (let i = 1; i < 10; i++) {
        if (i === 3) {
          continue;
        }
        text += i + " ";
      }
      let t1 = "";
      loop1: for (let j = 1; j < 5; j++) {
        loop2: for (let i = 1; i < 5; i++) {
          if (i === 3) {
            continue loop1;
          }
          t1 += i;
        }
      }
      let t2 = "";
      loop1b: for (let j = 1; j < 5; j++) {
        loop2b: for (let i = 1; i < 5; i++) {
          if (i === 3) {
            continue loop2b;
          }
          t2 += i;
        }
      }
      document.getElementById("out").innerHTML =
        "skip 3 -> " +
        text.trim() +
        "<br>continue loop1 -> " +
        t1 +
        "<br>continue loop2 -> " +
        t2;
    </script>
  </body>
</html>
