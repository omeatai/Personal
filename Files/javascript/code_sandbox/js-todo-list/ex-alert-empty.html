<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Exercise 1: alert if the task is empty</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <h2>To-Do List</h2>
<input type="text" id="task" placeholder="New task">
<button type="button" onclick="addTask()">Add</button>
<ul id="list"></ul>
<button type="button" onclick="clearAll()">Clear All</button>
    <pre id="log"></pre>
    <script>
      const __log = [];
      function note(s) {
        __log.push(s);
        const el = document.getElementById("log");
        if (el) el.innerText = __log.join("\n");
      }
let tasks = [];
function displayTasks() {
  let html = "";
  for (let i = 0; i < tasks.length; i++) {
    html += "<li>" + tasks[i] + " <button type=\"button\" onclick=\"removeTask(" + i + ")\">x</button></li>";
  }
  document.getElementById("list").innerHTML = html;
}
function addTask() {
  let taskInput = document.getElementById("task");
  let text = taskInput.value;
  if (text === "") {
    note("Please enter a task");
    return;
  }
  tasks.push(text);
  taskInput.value = "";
  saveTasks();
  displayTasks();
}
function removeTask(i) {
  tasks.splice(i, 1);
  saveTasks();
  displayTasks();
}
function clearAll() {
  tasks = [];
  saveTasks();
  displayTasks();
}
function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}
function loadTasks() {
  let saved = localStorage.getItem("tasks");
  if (saved !== null) {
    tasks = JSON.parse(saved);
  }
}
loadTasks();
displayTasks();
      localStorage.removeItem("tasks");
      tasks = [];
      document.getElementById("task").value = "";
      addTask();
      note("tasks still -> " + JSON.stringify(tasks));

    </script>
  </body>
</html>
