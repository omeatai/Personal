<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light" />
    <title>JS Statements - Semicolons</title>
    <link rel="stylesheet" href="../sandbox.css" />
  </head>
  <body>
    <h2>Semicolons</h2>
    <pre id="demo"></pre>
    <script>
      let a, b, c;
      a = 5;
      b = 6;
      c = a + b; // multiple statements, separated by semicolons
      document.getElementById("demo").innerText =
        "a = " + a + ", b = " + b + ", c = a + b = " + c;
    </script>
  </body>
</html>
