<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Exercise 3 + solutions: loadCount() when the page opens</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      button { margin-right: 4px; }
      
    </style>
  </head>
  <body>
    <h2>Counter</h2>
<p id="count" style="font-size:40px;">10</p>
<button type="button" onclick="increaseCount()">+</button>
<button type="button" onclick="decreaseCount()">-</button>
<button type="button" onclick="resetCount()">Reset</button>
<button type="button" onclick="saveCount()">Save</button>
<button type="button" onclick="loadCount()">Load</button>
    <pre id="log"></pre>
    <script>
      const __log = [];
      function note(s) {
        __log.push(s);
        const el = document.getElementById("log");
        if (el) el.innerText = __log.join("\n");
      }
      localStorage.setItem("count", "10");
      let count = 10;
      function updateCount() {
        document.getElementById("count").innerHTML = count;
      }
      function loadCount() {
        let saved = localStorage.getItem("count");
        if (saved !== null) {
          count = Number(saved);
        }
        updateCount();
      }
      loadCount();
      note("opened at -> " + count);

    </script>
  </body>
</html>
