<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>fullName returns a string</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>fullName returns a string</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function fullName(firstName, lastName) {
        return firstName + " " + lastName;
      }
      let name = fullName("John", "Doe");
      document.getElementById("demo").innerText = "name -> " + String(name);
    </script>
  </body>
</html>
