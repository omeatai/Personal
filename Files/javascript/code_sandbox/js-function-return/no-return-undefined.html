<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>No return → undefined</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>No return → undefined</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function multiply(a, b) {
        let x = a * b;
      }
      let result = multiply(4, 3);
      document.getElementById("demo").innerText = "result -> " + String(String(result)) + "\n" + "result === undefined -> " + String(result === undefined);
    </script>
  </body>
</html>
