<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>console.log vs return</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>console.log vs return</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function onlyLog() {
        console.log("Hello");
      }
      function withReturn() {
        return "Hello";
      }
      let x = onlyLog();
      let y = withReturn();
      document.getElementById("demo").innerText =
        "onlyLog() -> " + String(x) + "\n" +
        "withReturn() -> " + y;
    </script>
  </body>
</html>
