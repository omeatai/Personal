<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object Methods</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object Methods</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const car = {
        start: function () {
          return "started";
        }
      };
      let msg = car.start();
      document.getElementById("demo").innerText = "msg -> " + String(msg) + "\n" + "typeof car.start -> " + String(typeof car.start);
    </script>
  </body>
</html>
