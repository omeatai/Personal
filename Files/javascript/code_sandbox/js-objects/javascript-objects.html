<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>JavaScript Objects</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>JavaScript Objects</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const car = {
        type: "Fiat",
        start: function () {
          return "started";
        }
      };
      document.getElementById("demo").innerText = "car.type -> " + String(car.type) + "\n" + "car.start() -> " + String(car.start());
    </script>
  </body>
</html>
