<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object Properties</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object Properties</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const car = { type: "Fiat", color: "white" };
      car.type = "Volvo";
      car.model = "500";
      delete car.color;
      document.getElementById("demo").innerText = "car.type -> " + String(car.type) + "\n" + "car.model -> " + String(car.model) + "\n" + "car.color -> " + String(car.color) + "\n" + "\"color\" in car -> " + String("color" in car);
    </script>
  </body>
</html>
