<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object this</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object this</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = {
        firstName: "John",
        greet: function () {
          return this.firstName;
        }
      };
      document.getElementById("demo").innerText = "person.greet() -> " + String(person.greet());
    </script>
  </body>
</html>
