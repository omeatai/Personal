<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object Constructors</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object Constructors</h2>
    
    <pre id="demo"></pre>
    
    <script>
      function Person(first) {
        this.firstName = first;
      }
      const p = new Person("John");
      document.getElementById("demo").innerText = "p.firstName -> " + String(p.firstName) + "\n" + "p instanceof Person -> " + String(p instanceof Person);
    </script>
  </body>
</html>
