<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Object Display</title>
    <link rel="stylesheet" href="../sandbox.css" />
    <style>
      pre {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h2>Object Display</h2>
    
    <pre id="demo"></pre>
    
    <script>
      const person = { name: "John", age: 30 };
      let asObject = String(person);
      let named = person.name + ", " + person.age;
      let json = JSON.stringify(person);
      document.getElementById("demo").innerText = "String(person) -> " + String(asObject) + "\n" + "named -> " + String(named) + "\n" + "JSON.stringify -> " + String(json);
    </script>
  </body>
</html>
