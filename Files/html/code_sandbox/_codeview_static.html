<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example</title>
<style>
html, body { background:#fff; margin:0; }
#snap-target {
  display:inline-block;
  background:#E7E9EB;
  padding:16px 16px 20px;
  font-family:Verdana,Geneva,sans-serif;
  min-width:420px;
}
h3 { margin:0 0 12px; font-size:20px; font-weight:bold; }
.box {
  background:#fff;
  border-left:4px solid #04AA6D;
  padding:8px 16px;
  font-family:Consolas,"Courier New",monospace;
  font-size:15px;
  line-height:1.45;
  color:#000;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.t { color:#880055; }
.btn {
  display:inline-block;
  margin-top:12px;
  background:#04AA6D;
  color:#fff;
  padding:8px 16px;
  border-radius:5px;
  font-size:15px;
}
</style>
</head>
<body>
<div id="snap-target">
  <h3>Example</h3>
  <div class="box">&lt;meta charset=&quot;UTF-8&quot;&gt;
</div>
  <div class="btn">Try it Yourself »</div>
</div>
</body>
</html>
