<!doctype html>
<html lang="en">
  <body>
    <p>
      GET appends name/value pairs to the URL. POST puts data in the request
      body.
    </p>
    <form action="" method="get">
      <label for="fname">First name:</label><br />
      <input type="text" id="fname" name="fname" value="John" /><br />
      <label for="lname">Last name:</label><br />
      <input type="text" id="lname" name="lname" value="Doe" /><br /><br />
      <input type="submit" value="Submit GET" />
    </form>
    <form action="" method="post">
      <label for="fname2">First name:</label><br />
      <input type="text" id="fname2" name="fname" value="John" /><br />
      <label for="lname2">Last name:</label><br />
      <input type="text" id="lname2" name="lname" value="Doe" /><br /><br />
      <input type="submit" value="Submit POST" />
    </form>
  </body>
</html>
