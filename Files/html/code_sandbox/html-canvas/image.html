<!doctype html>
<html lang="en">
  <body>
    <img
      id="scream"
      src="picture.jpg"
      alt="The Scream"
      width="220"
      height="277"
    />
    <canvas
      id="myCanvas"
      width="250"
      height="300"
      style="border: 1px solid #d3d3d3"
    ></canvas>
    <script>
      window.onload = function () {
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        var img = document.getElementById("scream");
        ctx.drawImage(img, 10, 10);
      };
    </script>
  </body>
</html>
