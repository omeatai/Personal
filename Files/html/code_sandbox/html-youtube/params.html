<!doctype html>
<html lang="en">
  <body>
    <p>autoplay + mute</p>
    <iframe
      width="420"
      height="315"
      src="https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1&amp;mute=1"
    ></iframe>
    <p>loop</p>
    <iframe
      width="420"
      height="315"
      src="https://www.youtube.com/embed/tgbNymZ7vqY?playlist=tgbNymZ7vqY&amp;loop=1"
    ></iframe>
    <p>controls=0</p>
    <iframe
      width="420"
      height="315"
      src="https://www.youtube.com/embed/tgbNymZ7vqY?controls=0"
    ></iframe>
  </body>
</html>
